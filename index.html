<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

const API = "https://script.google.com/macros/s/AKfycbyCCkm0VIH6jsuj6T68KktBiHgE3IKnDQEOgEogRExKxmQ4WHXaW9wK4C9gZ2hhlfk/exec";
const BASE_URL = "https://bali-scans.saujanalab.com";
const AUTH_SESSION_KEY = "saujana-auth";
const ADMIN_KEY_SESSION_KEY = "saujana-contact-sheets-admin-key";
const DATA_CACHE_KEY = "saujana-dispatch-cache-v1";
const STOCK_CACHE_KEY = "saujana-stock-cache-v1";
const STOCK_HISTORY_CACHE_KEY = "saujana-stock-history-cache-v1";
const API_TIMEOUTS = {
  default: 20000,
  getInitialData: 12000,
  getCustomers: 12000,
  getOrders: 12000,
  getStock: 12000,
  getStockHistory: 12000,
  verifyContactSheetAdmin: 15000,
  addCustomer: 25000,
  updateCustomer: 25000,
  deleteCustomer: 25000,
  addOrder: 35000,
  createFolder: 45000,
  beginContactSheetUpload: 60000,
  createContactSheetUploadTicket: 60000,
  completeContactSheetUpload: 60000,
  cancelContactSheetUpload: 25000,
  saveStock: 35000,
  recordStockHistory: 35000
};

function apiTimeoutFor(action) {
  return API_TIMEOUTS[action] || API_TIMEOUTS.default;
}

function readDispatchCache() {
  try {
    const cached = JSON.parse(localStorage.getItem(DATA_CACHE_KEY) || "null");
    return cached && Array.isArray(cached.customers) && Array.isArray(cached.orders)
      ? cached
      : null;
  } catch(e) {
    return null;
  }
}

function writeDispatchCache(customers, orders) {
  try {
    localStorage.setItem(DATA_CACHE_KEY, JSON.stringify({
      customers,
      orders,
      savedAt: Date.now()
    }));
  } catch(e) {}
}

function readStockCache() {
  try {
    const cached = JSON.parse(localStorage.getItem(STOCK_CACHE_KEY) || "null");
    return cached && Array.isArray(cached.stock) ? cached : null;
  } catch(e) {
    return null;
  }
}

function writeStockCache(stock) {
  try {
    localStorage.setItem(STOCK_CACHE_KEY, JSON.stringify({
      stock,
      savedAt: Date.now()
    }));
  } catch(e) {}
}

function readLocalStockHistory() {
  try {
    const history = JSON.parse(localStorage.getItem(STOCK_HISTORY_CACHE_KEY) || "[]");
    return Array.isArray(history) ? history : [];
  } catch(e) {
    return [];
  }
}

function writeLocalStockHistory(history) {
  try {
    localStorage.setItem(STOCK_HISTORY_CACHE_KEY, JSON.stringify((history || []).slice(0, 30)));
  } catch(e) {}
}

async function apiCall(action, data=null) {
  try {
    if (!API) {
      return {
        success: true,
        id: `beta-${action}-${Date.now()}`,
        ...(data || {})
      };
    }
    const url = `${API}?action=${encodeURIComponent(action)}&_=${Date.now()}`;
    const fetchWithTimeout = async (endpoint, options={}) => {
      const controller = new AbortController();
      const timeoutMs = apiTimeoutFor(action);
      const timer = setTimeout(() => controller.abort(), timeoutMs);
      try {
        return await fetch(endpoint, {...options, signal: controller.signal});
      } finally {
        clearTimeout(timer);
      }
    };
    const readJson = async response => {
      const text = await response.text();
      try {
        return JSON.parse(text);
      } catch (err) {
        return {
          error: `Google Sheets returned ${response.status || "a non-JSON response"} while running ${action}`,
          detail: text.slice(0, 180)
        };
      }
    };

    if (data) {
      const r = await fetchWithTimeout(url, {
        method: "POST", 
        redirect: "follow",
        cache: "no-store",
        headers: {
          "Content-Type": "text/plain;charset=utf-8"
        },
        body: JSON.stringify(data)
      });
      return await readJson(r);
    }

    let r;
    try {
      r = await fetchWithTimeout(url, {
        method: "GET",
        redirect: "follow",
        cache: "no-store"
      });
      const result = await readJson(r);
      if (!result?.error) return result;
    } catch (getErr) {
      console.warn("GET API failed, retrying as POST:", getErr);
    }

    r = await fetchWithTimeout(url, {
      method: "POST",
      redirect: "follow",
      cache: "no-store",
      headers: {
        "Content-Type": "text/plain;charset=utf-8"
      },
      body: "{}"
    });
    return await readJson(r);
  } catch(e) { 
    if (e?.name === "AbortError") {
      return {error: `${action} took too long to finish. Please try again in a moment.`};
    }
    return {error: e?.message || e.toString()}; 
  }
}

function getContactSheetAdminKey() {
  return sessionStorage.getItem(ADMIN_KEY_SESSION_KEY) || "";
}

function normalizeScanStyle(value) {
  return String(value || "classic").trim().toLowerCase().replace(/\s+/g,"-");
}

function normalizeFrameFormat(value) {
  return String(value || "full").toLowerCase() === "half" ? "half-frame" : "full-frame";
}

async function uploadContactSheetVariant({orderNumber,uploadNonce,sheet,variant}) {
  const blob = variant === "story" ? sheet.storyBlob : sheet.deliveryBlob;
  if (!(blob instanceof Blob)) throw new Error(`Missing ${variant} JPEG for ${sheet.filmName}`);

  const ticket = await apiCall("createContactSheetUploadTicket", {
    orderNumber,
    uploadNonce,
    rollIndex:sheet.rollIndex,
    variant
  });
  if (!ticket?.uploadUrl || !ticket?.fileUrl) {
    throw new Error(ticket?.error || `Could not prepare the ${variant} upload`);
  }

  let response;
  try {
    response = await fetch(ticket.uploadUrl, {
      method:"PUT",
      headers:{"Content-Type":"image/jpeg"},
      body:blob
    });
  } catch(error) {
    throw new Error("Could not reach contact-sheet storage. Open Darkroom Dispatch from its approved web address and try again.");
  }
  if (!response.ok) {
    let message = `Upload failed (${response.status})`;
    try {
      const result = await response.json();
      if (result?.error) message = result.error;
    } catch(e) {}
    throw new Error(message);
  }
  return ticket.fileUrl;
}

const fmtDate = ts => ts ? new Date(ts).toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"}) : "-";
const fmtDT   = ts => {
  if (!ts) return "-";
  const d = new Date(ts);
  return d.toLocaleDateString("en-GB",{day:"2-digit",month:"short"}) + " · " +
         d.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"});
};
const cleanOrderNumber = value => String(value || "").trim().toUpperCase();
const ORDER_NUMBER_CACHE_KEY = "saujana-order-number-cache-v1";

function readOrderNumberCache() {
  try {
    return JSON.parse(localStorage.getItem(ORDER_NUMBER_CACHE_KEY) || "{}") || {};
  } catch(e) {
    return {};
  }
}

function rememberOrderNumber(id, orderNumber) {
  if (!id || !orderNumber) return;
  try {
    const cache = readOrderNumberCache();
    cache[id] = cleanOrderNumber(orderNumber);
    localStorage.setItem(ORDER_NUMBER_CACHE_KEY, JSON.stringify(cache));
  } catch(e) {}
}

function restoreOrderNumbers(orders) {
  const cache = readOrderNumberCache();
  return (orders || []).map(order => ({
    ...order,
    orderNumber: cache[order.id] || cleanOrderNumber(order.orderNumber)
  }));
}

const deliveryUrl = o => {
  if (!o || typeof o !== 'object') return BASE_URL;
  const orderNum = (o.orderNumber || "").toString();
  const name     = (o.customerName || "Customer").toString();
  const film     = (o.deliveryFilm || o.film || "").toString();
  const link     = (o.driveLink || "").toString();
  const sheetMode = Array.isArray(o.contactSheets) ? (o.contactSheets.length ? "1" : "0") : "";
  const deliveryTheme = normalizeDeliveryTheme(o.deliveryTheme);
  const deliveryDate = String(o.deliveryDate || baliDeliveryDate());
  // Notes excluded from URL — fetched from Sheets by delivery page
  return `${BASE_URL}/?theme=bali&negative=${encodeURIComponent(deliveryTheme)}&date=${encodeURIComponent(deliveryDate)}&order=${encodeURIComponent(orderNum)}&name=${encodeURIComponent(name)}&film=${encodeURIComponent(film)}&link=${encodeURIComponent(link)}${sheetMode ? `&sheets=${sheetMode}` : ""}`;
};

const DELIVERY_THEME_OPTIONS = [
  {value:"colour", label:"Colour Negative", accent:"#ff6425", paper:"#f3c3a2", surface:"#180b06"},
  {value:"bw", label:"Black & White", accent:"#eeeae2", paper:"#f3f1eb", surface:"#111111"},
  {value:"classic", label:"Classic", accent:"#c9a15c", paper:"#ece7db", surface:"#111315"}
];

function normalizeDeliveryTheme(value) {
  const normalized = String(value || "").trim().toLowerCase();
  return normalized === "bw" || normalized === "classic" ? normalized : "colour";
}

function baliDeliveryDate(value = new Date()) {
  const parts = new Intl.DateTimeFormat("en-CA", {
    timeZone:"Asia/Makassar",
    year:"numeric",
    month:"2-digit",
    day:"2-digit"
  }).formatToParts(value);
  const fields = Object.fromEntries(parts.map(part=>[part.type,part.value]));
  return `${fields.year}-${fields.month}-${fields.day}`;
}

function compactRollDetails(values) {
  const rolls = (values || []).map(value=>String(value || "").trim()).filter(Boolean);
  if (!rolls.length) return "";

  const groups = [];
  rolls.forEach(name => {
    const existing = groups.find(group=>group.name.toLocaleLowerCase()===name.toLocaleLowerCase());
    if (existing) existing.count += 1;
    else groups.push({name,count:1});
  });

  if (groups.length === 1 && groups[0].count > 1) {
    return `${groups[0].name} · ${groups[0].count} rolls`;
  }
  return groups.map(group=>group.count > 1 ? `${group.name} × ${group.count}` : group.name).join(" · ");
}

const escapePreviewHtml = value => String(value || "")
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");

const blobToDataUrl = blob => new Promise((resolve,reject) => {
  const reader = new FileReader();
  reader.onload = () => resolve(reader.result);
  reader.onerror = () => reject(new Error("Could not prepare the delivery preview."));
  reader.readAsDataURL(blob);
});

async function createLocalDeliveryPreview({customerName,orderNumber,driveLink,film,notes,contactSheets}) {
  const prepared = [];
  for (const sheet of contactSheets || []) {
    const imageUrl = sheet.deliveryBlob
      ? await blobToDataUrl(sheet.deliveryBlob)
      : (sheet.deliveryUrl || sheet.deliveryPreviewUrl || "");
    const storyUrl = sheet.storyBlob
      ? await blobToDataUrl(sheet.storyBlob)
      : (sheet.storyUrl || sheet.storyPreviewUrl || "");
    if (imageUrl) prepared.push({...sheet,imageUrl,storyUrl});
  }

  let brandLogo = "";
  try {
    const logoResponse = await fetch("saujana-white.png");
    if (logoResponse.ok) brandLogo = await blobToDataUrl(await logoResponse.blob());
  } catch(error) {}

  const assetUrl = fileName => new URL(fileName, window.location.href).href;
  const contactDownloadIcon = escapePreviewHtml(assetUrl("icon-contact-download.png"));
  const contactShareIcon = escapePreviewHtml(assetUrl("icon-contact-share.png"));
  const fullDownloadIcon = escapePreviewHtml(assetUrl("icon-full-download.png"));

  const safeFileName = value => String(value || "saujana-roll").replace(/[<>:"/\\|?*]/g,"-");
  const slides = prepared.map((sheet,index) => {
    const baseName = safeFileName(sheet.filmName);
    return `
    <article class="slide${index===0?" active":""}">
      <picture><source media="(max-width: 760px)" srcset="${sheet.storyUrl}"><img src="${sheet.imageUrl}" alt="${escapePreviewHtml(sheet.filmName)} contact sheet"></picture>
      <div class="caption"><strong>${escapePreviewHtml(sheet.filmName)}</strong><span>${Number(sheet.frameCount)||0} frames</span></div>
      <div class="sheet-actions">
        <a class="sheet-button" href="${sheet.imageUrl}" download="${escapePreviewHtml(baseName)}_contact-4x3.jpg"><img class="button-image-icon button-image-icon--light" src="${contactDownloadIcon}" alt="" aria-hidden="true"><span>Download contact sheet</span></a>
        ${sheet.storyUrl?`<button class="sheet-button share-sheet" type="button" data-story="${sheet.storyUrl}" data-name="${escapePreviewHtml(baseName)}_contact-story.jpg"><img class="button-image-icon button-image-icon--light" src="${contactShareIcon}" alt="" aria-hidden="true"><span>Share contact sheet</span></button>`:""}
      </div>
    </article>`;
  }).join("");
  const dots = prepared.map((_,index)=>`<button class="dot${index===0?" active":""}" data-index="${index}" aria-label="Show roll ${index+1}"></button>`).join("");
  const carousel = prepared.length ? `
    <div class="contact-preview">
      <section class="carousel">
      ${slides}
      ${prepared.length>1?`<button class="nav prev" aria-label="Previous roll">‹</button><button class="nav next" aria-label="Next roll">›</button><div class="dots">${dots}</div>`:""}
      </section>
    </div>` : "";
  const personalNote = notes ? `<span class="personal-note">${escapePreviewHtml(notes)}<br><br></span>` : "";
  const logoMarkup = brandLogo
    ? `<img src="${brandLogo}" alt="Saujana Film Lab Bali">`
    : `<div class="logo-fallback">Saujana <span>FILM LAB BALI</span></div>`;

async function getShortLink(longUrl) {
  // is.gd supports CORS natively — no proxy needed, fast and reliable
  const services = [
    `https://is.gd/create.php?format=simple&url=${encodeURIComponent(longUrl)}`,
    `https://v.gd/create.php?format=simple&url=${encodeURIComponent(longUrl)}`,
  ];
  for (const endpoint of services) {
    try {
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 8000);
      const res = await fetch(endpoint, { signal: controller.signal });
      clearTimeout(timeout);
      const text = (await res.text()).trim();
      if (text.startsWith("http")) return text;
    } catch(e) {}
  }
  return longUrl; // fallback to full URL if both fail
}

  const [selected, setSelected]   = useState(null);
  const [editing, setEditing]     = useState(null);
  const [form, setForm]           = useState({name:"",email:"",phone:""});
  const [saving, setSaving]       = useState(false);
  const [toast, setToast]         = useState("");
  const [page, setPage]           = useState(1);
  const pageSize = 20;

  const showToast = msg => { setToast(msg); setTimeout(()=>setToast(""),2500); };

const filtered = customers
  .filter(c => {
    const q = search.toLowerCase();

    return (
      String(c.name || "").toLowerCase().includes(q) ||
      String(c.email || "").toLowerCase().includes(q) ||
      String(c.phone || "").toLowerCase().includes(q)
    );
  })    .sort((a,b)=>
      sortBy==="orders"?(b.totalOrders||0)-(a.totalOrders||0):
      sortBy==="recent"?(b.lastOrderDate||0)-(a.lastOrderDate||0):
      a.name.localeCompare(b.name)
    );
  const totalPages = Math.max(1, Math.ceil(filtered.length / pageSize));
  const currentPage = Math.min(page, totalPages);
  const pagedCustomers = filtered.slice((currentPage-1)*pageSize, currentPage*pageSize);

  const custOrders = selected
    ? orders.filter(o=>o.customerId===selected.id).sort((a,b)=>b.createdAt-a.createdAt)
    : [];
  const recentCustomers = [...customers]
    .sort((a,b)=>(b.createdAt||0)-(a.createdAt||0))
    .slice(0,8);

  async function save() {
    if (!form.name.trim()||!form.email.trim()) return;
    setSaving(true);
    if (editing==="new") {
      await onAdd(form);
      showToast("Customer added ✓");
    } else {
      await onUpdate({...editing,...form});
      showToast("Updated ✓");
    }
    setEditing(null); setSaving(false);
  }
async function updateCustomerInfo() {
  if (!selCust) return;

  const res = await apiCall("updateCustomer", {
    id: selCust.id,
    name: custInput.trim(),
    email: custEmail.trim(),
    phone: custPhone.trim()
  });

  if (res?.success) {
  setSelCust({
    ...selCust,
    name: custInput.trim(),
    email: custEmail.trim(),
    phone: custPhone.trim()
  });

  showToast("Customer updated ✓");
} else {
  showToast(res?.error || "Could not update customer");
}
}
  async function del(id) {
    if (!confirm("Remove this customer?")) return;
    try {
      await onDelete(id);
      if (selected?.id===id) setSelected(null);
      showToast("Removed ✓");
    } catch(e) {
      showToast("Could not remove from Sheets");
    }
  }

  return (
    <div style={{display:"flex",gap:16,height:"calc(100vh - 130px)"}}>
      <Toast msg={toast}/>

      {/* Left */}
      <div style={{width:380,flexShrink:0,display:"flex",flexDirection:"column",gap:10,overflowY:"auto"}}>
        {/* Search + Add */}
        <div style={{display:"flex",gap:8}}>
          <input value={search} onChange={e=>{setSearch(e.target.value); setPage(1);}}
            placeholder="Search name, email or phone..." style={{flex:1,fontSize:12}}/>
          <button className="day-accent" onClick={()=>{setEditing("new");setForm({name:"",email:"",phone:""}); }}
            style={{...css.btn("blue"),padding:"11px 14px",whiteSpace:"nowrap"}}>+ Add</button>
        </div>

        {/* Sort */}
        <div style={{display:"flex",gap:6}}>
          {[{id:"name",l:"A-Z"},{id:"orders",l:"Most Orders"},{id:"recent",l:"Recent"}].map(s=>(
            <button key={s.id} onClick={()=>{setSortBy(s.id); setPage(1);}} style={{
              flex:1,padding:7,background:"none",fontFamily:"'Montserrat',sans-serif",
              border:`1px solid ${sortBy===s.id?"var(--blue-l)":"var(--border)"}`,borderRadius:2,
              color:sortBy===s.id?"var(--blue-l)":"var(--muted)",
              fontSize:9,letterSpacing:"0.15em",textTransform:"uppercase",cursor:"pointer",
            }}>{s.l}</button>
          ))}
        </div>

        {/* Add/Edit form */}
        {editing&&(
          <div style={{background:"var(--dark)",border:"1px solid var(--blue)",
                       borderTop:"2px solid var(--blue-l)",borderRadius:3,padding:18}}>
            <span style={{...css.secLabel,color:"var(--blue-l)"}}>
              {editing==="new"?"New Customer":"Edit Customer"}
            </span>
            {[{id:"name",l:"Name *",ph:"Full name"},
              {id:"email",l:"Email *",ph:"email@example.com"},
              {id:"phone",l:"Phone (optional)",ph:"+62 ..."}].map(f=>(
              <div key={f.id} style={{marginBottom:10}}>
                <label style={css.label}>{f.l}</label>
                <input value={form[f.id]} onChange={e=>setForm(p=>({...p,[f.id]:e.target.value}))}
                  placeholder={f.ph} onKeyDown={e=>e.key==="Enter"&&save()}/>
              </div>
            ))}
            <div style={{display:"flex",gap:8,marginTop:8}}>
              <button onClick={save} disabled={saving}
                style={{...css.btn("blue"),flex:1}}>{saving?"Saving...":"Save"}</button>
              <button onClick={()=>setEditing(null)}
                style={{...css.btn("ghost"),flex:1}}>Cancel</button>
            </div>
          </div>
        )}

        {/* Count */}
        <div style={{fontSize:9,color:"var(--dim)",letterSpacing:"0.25em",textTransform:"uppercase"}}>
          {filtered.length} customer{filtered.length!==1?"s":""}{search?` · "${search}"`:""}
          {filtered.length>pageSize?` · page ${currentPage}/${totalPages}`:""}
        </div>

        {/* List */}
        <div style={{flex:1,overflowY:"auto"}}>
          {filtered.length===0 ? (
            <div style={{textAlign:"center",padding:"40px 20px"}}>
              <div style={{fontFamily:"'Cormorant Garamond',serif",fontSize:28,fontStyle:"italic",color:"var(--dim)",marginBottom:8}}>
                {search?"No results":"Empty"}
              </div>
              <div style={{fontSize:9,color:"var(--dim)",letterSpacing:"0.2em",textTransform:"uppercase"}}>
                {search?"Try a different search":"Add your first customer"}
              </div>
            </div>
          ) : pagedCustomers.map(c=>(
            <div key={c.id} onClick={()=>setSelected(c)}
              style={{background:selected?.id===c.id?"var(--blue-gl)":"var(--card)",
                border:`1px solid ${selected?.id===c.id?"var(--blue)":"var(--border)"}`,
                borderLeft:`3px solid ${selected?.id===c.id?"var(--blue-l)":"var(--border)"}`,
                borderRadius:2,padding:"14px 16px",cursor:"pointer",marginBottom:6,transition:"all 0.15s"}}>
              <div style={{display:"flex",alignItems:"flex-start",justifyContent:"space-between",gap:12}}>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"}}>
                    <span style={{fontFamily:"'Cormorant Garamond',serif",fontSize:15,fontStyle:"italic",
                      color:selected?.id===c.id?"var(--blue-l)":"var(--white)"}}>{c.name}</span>
                    {c.totalOrders>0&&<span className="day-accent" style={{fontSize:9,background:"var(--ocean)",color:"var(--white)",
                      padding:"2px 8px",borderRadius:10,fontWeight:700}}>{c.totalOrders}×</span>}
                  </div>
                  <div style={{fontSize:11,color:"var(--muted)",marginTop:3}}>
                    {c.email}{c.phone?` · ${c.phone}`:""}
                  </div>
                  {c.lastOrderDate&&<div style={{fontSize:10,color:"var(--dim)",marginTop:3}}>
                    Last: {fmtDate(c.lastOrderDate)}
                  </div>}
                </div>
                <div style={{display:"flex",gap:6,flexShrink:0}}>
                  <button onClick={e=>{e.stopPropagation();setEditing(c);setForm({name:c.name,email:c.email,phone:c.phone||""});}}
                    style={{...css.btn("ghost"),padding:"4px 10px",fontSize:10}}>Edit</button>
                  <button onClick={e=>{e.stopPropagation();del(c.id);}}
                    style={{...css.btn("danger"),padding:"4px 10px",fontSize:10}}>×</button>
                </div>
              </div>
            </div>
          ))}
        </div>

        {filtered.length>pageSize&&(
          <div style={{display:"grid",gridTemplateColumns:"1fr auto 1fr",gap:8,alignItems:"center"}}>
            <button onClick={()=>setPage(p=>Math.max(1,p-1))} disabled={currentPage===1}
              style={{...css.btn("ghost"),padding:9,fontSize:9,opacity:currentPage===1?0.35:1}}>
              Previous
            </button>
            <div style={{fontSize:10,color:"var(--dim)",minWidth:78,textAlign:"center"}}>
              {((currentPage-1)*pageSize)+1}-{Math.min(currentPage*pageSize,filtered.length)}
            </div>
            <button onClick={()=>setPage(p=>Math.min(totalPages,p+1))} disabled={currentPage===totalPages}
              style={{...css.btn("ghost"),padding:9,fontSize:9,opacity:currentPage===totalPages?0.35:1}}>
              Next
            </button>
          </div>
        )}
      </div>

      {/* Right: Detail */}
      <div style={{flex:1,minWidth:0}}>
        {selected ? (
          <div style={{...css.card,height:"100%",display:"flex",flexDirection:"column"}}>
            {/* Header */}
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:20}}>
              <div>
                <div style={{fontFamily:"'Cormorant Garamond',serif",fontSize:26,fontStyle:"italic",color:"var(--white)"}}>
                  {selected.name}
                </div>
                <div style={{fontSize:12,color:"var(--muted)",marginTop:4}}>{selected.email}</div>
                {selected.phone&&<div style={{fontSize:12,color:"var(--muted)"}}>{selected.phone}</div>}
                <div style={{fontSize:10,color:"var(--dim)",marginTop:6}}>Member since {fmtDate(selected.createdAt)}</div>
              </div>
              <div style={{display:"flex",gap:8}}>
                <button onClick={()=>onNewOrderFor(selected)}
                  style={{...css.btn("green"),fontSize:9,padding:"10px 16px"}}>+ New Order</button>
                <button onClick={()=>setSelected(null)}
                  style={{background:"none",border:"1px solid var(--border)",borderRadius:2,
                          color:"var(--muted)",fontSize:16,padding:"6px 12px"}}>×</button>
              </div>
            </div>

            {/* Stats */}
            <div style={{display:"flex",gap:8,marginBottom:20}}>
              {[{l:"Total Orders",v:String(selected.totalOrders||0)},
                {l:"Last Visit",v:fmtDate(selected.lastOrderDate)},
                {l:"Member Since",v:fmtDate(selected.createdAt)}].map(s=>(
                <div key={s.l} style={{flex:1,background:"var(--dark)",border:"1px solid var(--border)",
                                       borderRadius:2,padding:"12px 14px",textAlign:"center"}}>
                  <div style={{fontSize:20,fontWeight:700,color:"var(--blue-l)",
                               fontFamily:"'Cormorant Garamond',serif"}}>{s.v}</div>
                  <div style={{fontSize:9,color:"var(--muted)",letterSpacing:"0.2em",
                               textTransform:"uppercase",marginTop:4}}>{s.l}</div>
                </div>
              ))}
            </div>

            {/* Orders */}
            <span style={css.secLabel}>Order History</span>
            <div style={{flex:1,overflowY:"auto"}}>
              {custOrders.length===0 ? (
                <div style={{textAlign:"center",padding:32,color:"var(--dim)",fontSize:12}}>No orders yet</div>
              ) : custOrders.map(o=>(
                <div key={o.id} style={{display:"flex",alignItems:"center",gap:12,padding:"12px 14px",
                  background:"var(--dark)",border:"1px solid var(--border)",
                  borderLeft:"3px solid var(--blue)",borderRadius:2,marginBottom:6}}>
                  <div style={{flex:1}}>
                    <div style={{display:"flex",gap:10,alignItems:"center",flexWrap:"wrap"}}>
                      <span style={{fontFamily:"'Cormorant Garamond',serif",fontSize:14,
                        color:"var(--white)",letterSpacing:"0.05em"}}>{o.orderNumber}</span>
                      <span style={{fontSize:11,color:"var(--muted)"}}>{o.film}</span>
                    </div>
                    <div style={{fontSize:10,color:"var(--dim)",marginTop:3}}>{fmtDT(o.createdAt)}</div>
                  </div>
                  {o.notes&&<div style={{fontSize:10,color:"var(--muted)",maxWidth:160,textAlign:"right"}}>{o.notes}</div>}
                  {o.driveLink&&<a href={deliveryUrl(o)} target="_blank" rel="noopener"
                    style={{...css.btn("ghost"),padding:"6px 10px",fontSize:9,whiteSpace:"nowrap",
                      color:"var(--blue-l)",textDecoration:"none"}}>
                    Open scans ↗
                  </a>}
                </div>
              ))}
            </div>
          </div>
        ) : (
          <div style={{...css.card,height:"100%",display:"flex",flexDirection:"column",gap:18}}>
            <div>
              <div style={{fontFamily:"'Cormorant Garamond',serif",fontSize:32,fontStyle:"italic",color:"var(--white)"}}>
                Recently Added
              </div>
              <div style={{fontSize:9,color:"var(--dim)",letterSpacing:"0.3em",textTransform:"uppercase",marginTop:4}}>
                latest customer entries
              </div>
            </div>

            <div style={{display:"flex",flexDirection:"column",gap:8,overflowY:"auto"}}>
              {recentCustomers.length===0 ? (
                <div style={{textAlign:"center",padding:36,color:"var(--dim)",fontSize:12}}>
                  No customer entries yet
                </div>
              ) : recentCustomers.map(c=>(
                <div key={c.id} style={{background:"var(--dark)",border:"1px solid var(--border)",
                  borderLeft:"3px solid var(--gold)",borderRadius:2,padding:"12px 14px",
                  display:"flex",alignItems:"center",gap:12}}>
                  <button onClick={()=>setSelected(c)}
                    style={{flex:1,background:"none",border:"none",textAlign:"left",cursor:"pointer",padding:0}}>
                    <div style={{fontFamily:"'Cormorant Garamond',serif",fontSize:17,fontStyle:"italic",color:"var(--white)"}}>
                      {c.name || "Unnamed Customer"}
                    </div>
                    <div style={{fontSize:11,color:"var(--muted)",marginTop:3}}>
                      {c.email || "-"}{c.phone?` · ${c.phone}`:""}
                    </div>
                    <div style={{fontSize:10,color:"var(--dim)",marginTop:4}}>
                      Added {fmtDT(c.createdAt)}
                    </div>
                  </button>
                  <button onClick={()=>onNewOrderFor(c)}
                    style={{...css.btn("green"),fontSize:9,padding:"8px 10px",whiteSpace:"nowrap"}}>
                    + Order
                  </button>
                </div>
              ))}
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

function App() {
  const cachedDispatch = readDispatchCache();
  const [authed, setAuthed]       = useState(
    sessionStorage.getItem(AUTH_SESSION_KEY)==="1" && Boolean(sessionStorage.getItem(ADMIN_KEY_SESSION_KEY))
  );
  const [theme, setTheme]         = useState("night");
  const [tab, setTab]             = useState("dispatch");
  const [customers, setCustomers] = useState(cachedDispatch?.customers || []);
  const [orders, setOrders]       = useState(cachedDispatch?.orders || []);
  const [loading, setLoading]     = useState(!cachedDispatch);
  const [syncing, setSyncing]     = useState(false);
  const [refreshStatus, setRefreshStatus] = useState("");
  const [prefill, setPrefill]     = useState(null);
  const [newOrderSignal, setNewOrderSignal] = useState(0);
  const [grainBurst, setGrainBurst] = useState(0);
  const [loadError, setLoadError] = useState("");

  useEffect(() => {
    document.body.setAttribute("data-theme", theme === "day" ? "light" : "dark");
  }, [theme]);

  const wait = ms => new Promise(resolve => setTimeout(resolve, ms));

  async function loadSheetData() {
    const combined = await apiCall("getInitialData");
    if (combined && Array.isArray(combined.customers) && Array.isArray(combined.orders)) {
      return [combined.customers, restoreOrderNumbers(combined.orders)];
    }

    const [c, o] = await Promise.all([
      apiCall("getCustomers"),
      apiCall("getOrders")
    ]);

    if (!Array.isArray(c) || !Array.isArray(o)) {
      throw new Error(c?.error || o?.error || "Google Sheets returned an unexpected response");
    }

    return [c, restoreOrderNumbers(o)];
  }

  async function load() {
    if (!API) {
      setLoading(false);
      setSyncing(false);
      setRefreshStatus("");
      setLoadError("");
      return;
    }
    setLoading(customers.length === 0 && orders.length === 0);
    setSyncing(true);
    setRefreshStatus("working");
    setLoadError("");
    let ok = false;

    try {
      let c, o;
      try {
        [c, o] = await loadSheetData();
      } catch (firstErr) {
        console.warn("LOAD RETRY:", firstErr);
        await wait(1800);
        [c, o] = await loadSheetData();
      }

      console.log("CUSTOMERS API:", c);

      setCustomers(c);
      setOrders(o);
      writeDispatchCache(c, o);
      ok = true;
    } catch (err) {
      console.error("LOAD ERROR:", err);
      setLoadError(`Could not load Google Sheets: ${err.message || err}. Wait a moment, then reopen the app.`);
    } finally {
      setLoading(false);
      setSyncing(false);
      if (ok) {
        setRefreshStatus("done");
        setTimeout(() => setRefreshStatus(""), 1200);
      } else {
        setRefreshStatus("");
      }
    }
  }

  useEffect(()=>{ if(authed) load(); },[authed]);

  async function handleAdd(form) {
    setSyncing(true);
    const nc = await apiCall("addCustomer",form);
    setCustomers(p=>[nc,...p]);
    setSyncing(false);
  }

  async function handleUpdate(c) {
    setSyncing(true);
    await apiCall("updateCustomer",c);
    setCustomers(p=>p.map(cu=>cu.id===c.id?{...cu,...c}:cu));
    setSyncing(false);
  }

  async function handleDelete(id) {
    setSyncing(true);
    try {
      const result = await apiCall("deleteCustomer",{id, customerId:id});
      if (result?.error) throw new Error(result.error);
      setCustomers(p=>p.filter(c=>c.id!==id));
      await load();
    } finally {
      setSyncing(false);
    }
  }

  function handleOrderSaved(saved, custId) {
    rememberOrderNumber(saved?.id, saved?.orderNumber);
    setOrders(p=>[{...saved,createdAt:Date.now()},...p]);
    if (custId) {
      setCustomers(p=>p.map(c=>c.id===custId
        ?{...c,totalOrders:(c.totalOrders||0)+1,lastOrderDate:Date.now()}:c));
    }
  }

  function handleNewOrderFor(c) {
    setPrefill(c); setTab("dispatch");
  }

  function handleNewOrder() {
    setPrefill(null);
    setTab("dispatch");
    setNewOrderSignal(n => n + 1);
    setGrainBurst(n => n + 1);
  }

  if (!authed) return <LockScreen onUnlock={()=>setAuthed(true)}/>;

  return (
    <>
      {grainBurst > 0 && (
        <div className="grain-burst" key={grainBurst}>
          {Array.from({length:26}).map((_, i) => {
            const angle = (i * 137.5) * Math.PI / 180;
            const distance = 28 + (i % 9) * 8;
            const x = Math.cos(angle) * distance;
            const y = Math.sin(angle) * distance + (i % 4) * 5;
            return (
              <span
                key={i}
                className="grain-particle"
                style={{
                  "--x": `${x}px`,
                  "--y": `${y}px`,
                  animationDelay: `${(i % 5) * 18}ms`
                }}
              />
            );
          })}
        </div>
      )}
      {/* Header */}
      <div style={{background:"var(--dark)",borderBottom:"1px solid var(--border)",
                   padding:"0 24px",position:"sticky",top:0,zIndex:100}}>
        <div style={{maxWidth:1500,margin:"0 auto"}}>
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",paddingTop:14}}>
            <div>
              <img className="brand-logo" src="dd-horizontal.png" alt="Darkroom Dispatch Logo" style={{height:45, objectFit:"contain", display:"block"}}/>
              <div style={{fontSize:8,letterSpacing:"0.4em",textTransform:"uppercase",color:"var(--muted)",marginTop:8}}>
                Film Lab Bali · Operations
              </div>
            </div>
            <div style={{display:"flex",alignItems:"center",gap:12}}>
              {syncing&&<span style={{fontSize:9,color:"var(--muted)",letterSpacing:"0.2em",textTransform:"uppercase"}}>Syncing...</span>}
              <button
                onClick={() => setTheme(t => t === "day" ? "night" : "day")}
                style={{...css.btn("ghost"),padding:"6px 12px",fontSize:9,minWidth:82}}
              >
                Theme: {theme === "day" ? "☀️" : "🌙"}
              </button>
              <button className="day-accent" onClick={handleNewOrder} style={{...css.btn("blue"),padding:"6px 12px",fontSize:9}}>
                + New Order
              </button>
              <button onClick={load} disabled={syncing} style={{...css.btn("ghost"),padding:"6px 12px",fontSize:9,opacity:syncing?0.55:1}}>
                {refreshStatus === "working" ? "Working on it..." : refreshStatus === "done" ? "All done!" : "↻ Refresh"}
              </button>
              <div className="scoreboard" aria-label={`${customers.length} customers, ${orders.length} orders`}>
                <div className="scoreboard-item">
                  <span className="scoreboard-number">{customers.length}</span>
                  <span className="scoreboard-label">Cust</span>
                </div>
                <div className="scoreboard-item">
                  <span className="scoreboard-number">{orders.length}</span>
                  <span className="scoreboard-label">Orders</span>
                </div>
              </div>
            </div>
          </div>
          <div style={{display:"flex",marginTop:10}}>
            {[{id:"dispatch",l:"Darkroom Dispatch"},{id:"registry",l:"Customer Registry"},{id:"stock",l:"Stock Count"}].map(t=>(
              <button key={t.id} onClick={()=>setTab(t.id)} style={{
                padding:"10px 24px",background:"none",
                border:"none",borderBottom:`2px solid ${tab===t.id?"var(--blue-l)":"transparent"}`,
                color:tab===t.id?"var(--white)":"var(--muted)",
                fontFamily:"'Montserrat',sans-serif",fontSize:10,
                fontWeight:tab===t.id?500:300,letterSpacing:"0.2em",textTransform:"uppercase",cursor:"pointer",
              }}>{t.l}</button>
            ))}
          </div>
        </div>
      </div>

      {/* Content */}
      <div style={{maxWidth:tab==="dispatch"?1500:1100,margin:"0 auto",padding:"20px 24px"}}>
        {loadError && (
          <div style={{marginBottom:16,padding:"12px 14px",border:"1px solid var(--red)",background:"rgba(255,80,80,0.08)",
                       color:"var(--light)",fontSize:11,lineHeight:1.6}}>
            {loadError}
          </div>
        )}
        {loading ? (
          <div style={{textAlign:"center",padding:80,fontSize:11,letterSpacing:"0.3em",
                       textTransform:"uppercase",color:"var(--dim)"}}>
            Connecting to Google Sheets...
          </div>
        ) : tab==="dispatch" ? (
          <Dispatch customers={customers} orders={orders} onOrderSaved={handleOrderSaved}
            prefill={prefill} clearPrefill={()=>setPrefill(null)} resetSignal={newOrderSignal}/>
        ) : tab==="registry" ? (
  <Registry customers={customers} orders={orders}
    onAdd={handleAdd} onUpdate={handleUpdate} onDelete={handleDelete}
    onNewOrderFor={handleNewOrderFor}/>
) : (
  <StockTracker/>
        )}
      </div>
    </>
  );
}

  {category:"BW 35MM", items:[
    {name:"Kodak 400TX", qty:0, sold:0, visible:true},
    {name:"Ilford HP5 400", qty:0, sold:0, visible:true},
    {name:"Fomapan 400", qty:0, sold:0, visible:true},
  ]},
  {category:"120 FILM", items:[
    {name:"Kodak Portra 400", qty:0, sold:0, visible:true},
    {name:"Kodak Gold 200", qty:0, sold:0, visible:true},
    {name:"Ilford HP5 400", qty:0, sold:0, visible:true},
  ]},
  {category:"COLOR 110 FILM", items:[
    {name:"Lomo Purple", qty:0, sold:0, visible:true},
    {name:"Lomo Lobster", qty:0, sold:0, visible:true},
  ]},
  {category:"CAMERA", items:[
    {name:"Reto 3D Black", qty:0, sold:0, visible:true},
    {name:"Reto 3D White", qty:0, sold:0, visible:true},
  ]},
];

// ── STOCK TRACKER COMPONENT ───────────────────────────────
function StockTracker() {
  const cachedStock = readStockCache();
  const [stock, setStock]         = useState(cachedStock?.stock || []);
  const [loading, setLoading]     = useState(!cachedStock);
  const [refreshing, setRefreshing] = useState(false);
  const [stockRefreshStatus, setStockRefreshStatus] = useState("");
  const [saving, setSaving]       = useState(false);
  const [report, setReport]       = useState("");
  const [copied, setCopied]       = useState(false);
  const [toast, setToast]         = useState("");
  // Add item UI
  const [addingTo, setAddingTo]   = useState(null); // category name
  const [newItemName, setNewItemName] = useState("");
  const [addingCategory, setAddingCategory] = useState(false);
  const [newCatName, setNewCatName] = useState("");
  const [manageOpen, setManageOpen] = useState(false);
  const [manageNew, setManageNew] = useState({category:"", name:"", qty:"0"});
  const [manageSearch, setManageSearch] = useState("");
  const [stockInDrafts, setStockInDrafts] = useState({});
  const [historyOpen, setHistoryOpen] = useState(false);
  const [stockHistory, setStockHistory] = useState(readLocalStockHistory());
  const [historyLoading, setHistoryLoading] = useState(false);
  const [historyNotice, setHistoryNotice] = useState("");
  const [selectedHistory, setSelectedHistory] = useState(null);

  const showToast = msg => { setToast(msg); setTimeout(()=>setToast(""),2500); };
  const remainingQty = item => Math.max(0, (item.qty || 0) - (item.sold || 0));
  const stockKey = value => String(value || "").trim().toLowerCase();
  const stockDraftKey = (catIdx, itemIdx) => `${catIdx}:${itemIdx}`;
  const stockMetaText = item => {
    if (item.addedAt) return `Added ${fmtDT(item.addedAt)}`;
    if (item.lastUpdated) return `Updated ${fmtDT(item.lastUpdated)}`;
    return "Not saved yet";
  };
  const createStockItem = (name, qty=0) => ({
    name,
    qty:Number(qty) || 0,
    sold:0,
    visible:true,
    addedAt:new Date().toISOString(),
    lastUpdated:""
  });
  const markStockSaved = (categories, timestamp) => categories.map(cat => ({
    ...cat,
    items: (cat.items || []).map(item => ({
      ...item,
      sold:0,
      addedAt:"",
      lastUpdated:timestamp || new Date().toISOString()
    }))
  }));
  const stampStockSaved = (categories, timestamp) => categories.map(cat => ({
    ...cat,
    items: (cat.items || []).map(item => ({
      ...item,
      addedAt:"",
      lastUpdated:timestamp || new Date().toISOString()
    }))
  }));
  const normalizeStock = categories => categories.map(cat => ({
    ...cat,
    items: (cat.items || []).map(item => ({
      ...item,
      qty: Number(item.qty) || 0,
      sold: Number(item.sold) || 0,
      visible: item.visible !== false,
      addedAt: item.addedAt || "",
      lastUpdated: item.lastUpdated || ""
    }))
  }));
  const finalizeStock = categories => categories.map(cat => ({
    ...cat,
    items: (cat.items || []).map(item => ({
      ...item,
      qty: remainingQty(item),
      sold: 0,
      visible: item.visible !== false
    }))
  }));

  // Load stock from Sheets
  useEffect(() => { loadStock(); loadStockHistory(); }, []);

  function countStockItems(sourceStock=[]) {
    return sourceStock.reduce((total, cat) => total + (cat.items || []).length, 0);
  }

  function parseHistoryStock(value) {
    if (!value) return [];
    if (Array.isArray(value)) return value;
    try {
      return JSON.parse(value);
    } catch(e) {
      return [];
    }
  }

  function historySummary(entry) {
    const before = parseHistoryStock(entry.beforeStock);
    const after = parseHistoryStock(entry.afterStock);
    const soldCount = before.reduce((sum, cat) => sum + (cat.items || []).reduce((itemSum, item) => itemSum + (Number(item.sold) || 0), 0), 0);
    return {
      beforeItems: countStockItems(before),
      afterItems: countStockItems(after),
      soldCount
    };
  }

  async function loadStockHistory() {
    setHistoryLoading(true);
    const localHistory = readLocalStockHistory();
    try {
      const res = await apiCall("getStockHistory");
      if (Array.isArray(res)) {
        const seen = {};
        const merged = [...res, ...localHistory].filter(entry => {
          const key = entry.id || entry.timestamp;
          if (!key || seen[key]) return false;
          seen[key] = true;
          return true;
        }).slice(0, 30);
        setStockHistory(merged);
        writeLocalStockHistory(merged);
        setHistoryNotice("");
      } else {
        setStockHistory(localHistory);
        setHistoryNotice(localHistory.length ? "Showing local history. Deploy Apps Script history to sync across devices." : "No history found yet. Finalize stock once after this update to create the first record.");
      }
    } catch(e) {
      setStockHistory(localHistory);
      setHistoryNotice(localHistory.length ? "Showing local history. Deploy Apps Script history to sync across devices." : "No history found yet. Finalize stock once after this update to create the first record.");
    }
    setHistoryLoading(false);
  }

  async function recordStockHistory(beforeStock, afterStock, reportText) {
    const localEntry = {
      id: "local_sh_" + Date.now(),
      timestamp: new Date().toISOString(),
      action: "finalize",
      beforeStock,
      afterStock,
      report: reportText
    };
    const nextLocalHistory = [localEntry, ...readLocalStockHistory()].slice(0, 30);
    writeLocalStockHistory(nextLocalHistory);
    setStockHistory(nextLocalHistory);
    setHistoryNotice("Saved to local history. Syncs to Sheets when Apps Script history is deployed.");

    try {
      await apiCall("recordStockHistory", {
        action: "finalize",
        beforeStock,
        afterStock,
        report: reportText
      });
      await loadStockHistory();
    } catch(e) {}
  }

  async function loadStock() {
    setLoading(stock.length === 0);
    setRefreshing(true);
    setStockRefreshStatus("working");
    let ok = false;
    try {
      const res = await apiCall("getStock");
      if (res && Array.isArray(res) && res.length > 0) {
        const normalized = normalizeStock(res);
        setStock(normalized);
        writeStockCache(normalized);
        ok = true;
      } else {
        if (stock.length === 0) setStock(normalizeStock(DEFAULT_STOCK));
      }
    } catch(e) {
      if (stock.length === 0) setStock(normalizeStock(DEFAULT_STOCK));
    }
    setLoading(false);
    setRefreshing(false);
    if (ok) {
      setStockRefreshStatus("done");
      setTimeout(() => setStockRefreshStatus(""), 1200);
    } else {
      setStockRefreshStatus("");
    }
  }

  function buildReportText(sourceStock=stock) {
    const now = new Date();
    const day = now.getDate();
    const month = now.toLocaleString("en-GB", {month:"long"});
    const year = now.getFullYear();
    const dateStr = `${day} ${month} ${year}`;

    let lines = [`${dateStr}`, ``];
    sourceStock.forEach(cat => {
      const visibleItems = (cat.items || []).filter(item => item.visible !== false);
      if (visibleItems.length === 0) return;
      if (lines.length > 2) lines.push(``);
      lines.push(`${cat.category}`);
      visibleItems.forEach(item => {
        lines.push(`${item.name} - ${remainingQty(item)}`);
      });
    });

    return lines.join("\n");
  }

  async function saveStock() {
    setSaving(true);
    try {
      const finalizedStock = finalizeStock(stock);
      const res = await apiCall("saveStock", {stock: finalizedStock});
      const savedStock = markStockSaved(finalizedStock, res && res.timestamp);
      setStock(savedStock);
      writeStockCache(savedStock);
      showToast("Stock saved ✓");
    } catch(e) {
      showToast("Save failed");
    }
    setSaving(false);
  }

  async function finalizeAndGenerateReport() {
    setSaving(true);
    try {
      const reportText = buildReportText(stock);
      const finalizedStock = finalizeStock(stock);
      await recordStockHistory(stock, finalizedStock, reportText);
      const res = await apiCall("saveStock", {stock: finalizedStock});
      const savedStock = markStockSaved(finalizedStock, res && res.timestamp);
      setStock(savedStock);
      writeStockCache(savedStock);
      setReport(reportText);
      showToast("Stock saved and report generated");
    } catch(e) {
      showToast("Save failed");
    }
    setSaving(false);
  }

  function updateQty(catIdx, itemIdx, delta) {
    const updated = stock.map((cat, ci) => ci !== catIdx ? cat : {
      ...cat,
      items: cat.items.map((item, ii) => ii !== itemIdx ? item : {
        ...item, sold: Math.max(0, (item.sold || 0) + delta)
      })
    });
    setStock(updated);
  }

  function setQty(catIdx, itemIdx, val) {
    if (val === "") {
      const updated = stock.map((cat, ci) => ci !== catIdx ? cat : {
        ...cat,
        items: cat.items.map((item, ii) => ii !== itemIdx ? item : {...item, sold: 0})
      });
      setStock(updated);
      return;
    }
    const n = parseInt(val);
    if (isNaN(n) || n < 0) return;
    const updated = stock.map((cat, ci) => ci !== catIdx ? cat : {
      ...cat,
      items: cat.items.map((item, ii) => ii !== itemIdx ? item : {...item, sold: n})
    });
    setStock(updated);
  }

  function setItemField(catIdx, itemIdx, field, val) {
    const updated = stock.map((cat, ci) => ci !== catIdx ? cat : {
      ...cat,
      items: cat.items.map((item, ii) => {
        if (ii !== itemIdx) return item;
        const nextVal = field === "qty" ? Math.max(0, parseInt(val) || 0) : val;
        return {...item, [field]: nextVal};
      })
    });
    setStock(updated);
  }

  function setItemVisible(catIdx, itemIdx, visible) {
    const updated = stock.map((cat, ci) => ci !== catIdx ? cat : {
      ...cat,
      items: cat.items.map((item, ii) => ii !== itemIdx ? item : {...item, visible})
    });
    setStock(updated);
  }

  function setItemCategory(catIdx, itemIdx, newCategory) {
    const category = newCategory.trim().toUpperCase();
    if (!category) return;
    const movingItem = stock[catIdx]?.items?.[itemIdx];
    if (!movingItem || stock[catIdx].category === category) return;

    setStock(prev => {
      let moved = false;
      const withoutItem = prev
        .map((cat, ci) => ci !== catIdx ? cat : {...cat, items: cat.items.filter((_, ii) => ii !== itemIdx)})
        .filter(cat => cat.items.length > 0);
      const updated = withoutItem.map(cat => {
        if (cat.category !== category) return cat;
        moved = true;
        return {...cat, items: [...cat.items, movingItem]};
      });
      return moved ? updated : [...updated, {category, items:[movingItem]}];
    });
  }

  function addItem(catIdx) {
    if (!newItemName.trim()) return;
    const updated = stock.map((cat, ci) => ci !== catIdx ? cat : {
      ...cat, items: [...cat.items, createStockItem(newItemName.trim())]
    });
    setStock(updated);
    setNewItemName("");
    setAddingTo(null);
  }

  async function saveStockState(nextStock, successMessage) {
    setSaving(true);
    try {
      const res = await apiCall("saveStock", {stock: nextStock});
      if (res && res.error) throw new Error(res.error);
      const savedStock = stampStockSaved(nextStock, res && res.timestamp);
      setStock(savedStock);
      writeStockCache(savedStock);
      showToast(successMessage);
    } catch(e) {
      setStock(nextStock);
      writeStockCache(nextStock);
      showToast("Saved locally. Sheets sync failed");
    }
    setSaving(false);
  }

  async function addManagedItem() {
    const category = manageNew.category.trim().toUpperCase();
    const name = manageNew.name.trim();
    if (!category || !name) return;
    const qty = Math.max(0, parseInt(manageNew.qty) || 0);
    let added = false;
    let duplicateFound = false;
    const newItem = createStockItem(name, qty);
    const updated = stock.map(cat => {
      if (cat.category !== category) return cat;
      added = true;
      const existingIdx = (cat.items || []).findIndex(item => stockKey(item.name) === stockKey(name));
      if (existingIdx >= 0) {
        duplicateFound = true;
        showToast("Item already exists. Use Stock In on its row.");
        return cat;
      }
      return {...cat, items:[...(cat.items || []), newItem]};
    });
    if (duplicateFound) {
      setManageNew(m => ({...m, name:"", qty:""}));
      return;
    }
    const nextStock = added ? updated : [...updated, {category, items:[newItem]}];
    setManageNew({category:"", name:"", qty:""});
    await saveStockState(nextStock, "New item saved");
  }

  async function addStockToManagedItem(catIdx, itemIdx) {
    const draftKey = stockDraftKey(catIdx, itemIdx);
    const qty = Math.max(0, parseInt(stockInDrafts[draftKey]) || 0);
    if (qty <= 0) {
      showToast("Enter stock-in quantity first");
      return;
    }
    const item = stock[catIdx]?.items?.[itemIdx];
    if (!item) return;
    const updated = stock.map((cat, ci) => ci !== catIdx ? cat : {
      ...cat,
      items: (cat.items || []).map((row, ii) => ii !== itemIdx ? row : {
        ...row,
        qty: (Number(row.qty) || 0) + qty
      })
    });
    setStockInDrafts(drafts => ({...drafts, [draftKey]:""}));
    await saveStockState(updated, `${item.name} +${qty} saved`);
  }

  async function removeManagedItem(catIdx, itemIdx) {
    const item = stock[catIdx]?.items?.[itemIdx];
    if (!item) return;
    const ok = window.confirm(`Remove "${item.name}" from stock?`);
    if (!ok) return;
    const updated = stock
      .map((cat, ci) => ci !== catIdx ? cat : {
        ...cat,
        items: (cat.items || []).filter((_, ii) => ii !== itemIdx)
      })
      .filter(cat => cat.items.length > 0);
    await saveStockState(updated, "Stock item removed");
  }

  function addCategory() {
    const category = newCatName.trim().toUpperCase();
    if (!category) return;
    setStock(s => s.some(cat => cat.category === category) ? s : [...s, {category, items: []}]);
    setNewCatName("");
    setAddingCategory(false);
    setAddingTo(category);
  }

  function generateReport() {
    setReport(buildReportText(stock));
  }

  function copyReport() {
    navigator.clipboard.writeText(report).then(() => {
      setCopied(true);
      showToast("Report copied!");
      setTimeout(() => setCopied(false), 2000);
    });
  }

  function copyWhatsAppReport() {
    const text = buildReportText(stock);
    setReport(text);
    navigator.clipboard.writeText(text).then(() => {
      setCopied(true);
      showToast("WhatsApp report copied");
      setTimeout(() => setCopied(false), 2000);
    });
  }

  if (loading) return (
    <div style={{textAlign:"center",padding:80,fontSize:11,letterSpacing:"0.3em",
                 textTransform:"uppercase",color:"var(--dim)"}}>Loading stock...</div>
  );

  return (
    <div style={{maxWidth:900,margin:"0 auto"}}>
      {toast && <div style={{position:"fixed",bottom:24,right:24,background:"var(--card)",
        border:"1px solid var(--blue)",borderRadius:3,padding:"12px 20px",
        fontSize:12,color:"var(--blue-l)",zIndex:999}}>{toast}</div>}

      {/* Header row */}
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}}>
        <div>
          <div style={{fontFamily:"'Cormorant Garamond',serif",fontSize:28,fontStyle:"italic",color:"var(--white)"}}>
            Stock Count
          </div>
          <div style={{fontSize:9,letterSpacing:"0.35em",textTransform:"uppercase",color:"var(--muted)",marginTop:4}}>
            End of Day · Inventory Check
          </div>
        </div>
        <div style={{display:"flex",gap:8}}>
          <button onClick={loadStock} disabled={refreshing || saving}
            style={{...css.btn("ghost"),padding:"10px 18px",opacity:(refreshing||saving)?0.5:1}}>
            {stockRefreshStatus === "working" ? "Working on it..." : stockRefreshStatus === "done" ? "All done!" : "↻ Refresh Stock"}
          </button>
          <button className="day-accent" onClick={finalizeAndGenerateReport} disabled={saving}
            style={{...css.btn("blue"),padding:"10px 18px",opacity:saving?0.5:1}}>
            {saving?"Saving...":"Finalize + Save Report"}
          </button>
          <button onClick={copyWhatsAppReport}
            style={{...css.btn("primary"),padding:"10px 18px"}}>
            Copy WhatsApp
          </button>
        </div>
      </div>

      {/* Stock grid */}
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(360px,1fr))",gap:12,marginBottom:16}}>
        {stock.map((cat, catIdx) => {
          const hasVisibleItems = (cat.items || []).some(item => item.visible !== false);
          const isEmptyCategory = !cat.items || cat.items.length === 0;
          const isAddingToCategory = addingTo === cat.category;
          if (!hasVisibleItems && !isEmptyCategory && !isAddingToCategory) return null;
          return (
          <div key={catIdx} style={{...css.card,padding:0,overflow:"hidden"}}>
            {/* Category header */}
            <div style={{background:"var(--card2)",borderBottom:"1px solid var(--border)",
                         padding:"12px 16px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <span className="stock-heading" style={{fontSize:10,fontWeight:600,letterSpacing:"0.3em",
                            textTransform:"uppercase",color:"var(--blue-l)"}}>{cat.category}</span>
              <button className="day-accent" onClick={()=>setAddingTo(addingTo===cat.category?null:cat.category)}
                style={{background:"none",border:"none",color:"var(--muted)",
                        fontSize:18,padding:"0 4px",lineHeight:1}}>+</button>
            </div>

            {/* Items */}
            <div style={{padding:"8px 0"}}>
              {cat.items.map((item, itemIdx) => item.visible === false ? null : (
                <div key={itemIdx} style={{display:"grid",gridTemplateColumns:"1fr 72px 132px 82px",alignItems:"center",gap:8,
                  padding:"10px 16px",borderBottom:"1px solid var(--border)"}}>
                  <div style={{fontSize:13,color:"var(--white)"}}>{item.name}</div>
                  <div>
                    <div style={{fontSize:8,letterSpacing:"0.18em",textTransform:"uppercase",color:"var(--muted)",marginBottom:4}}>Current</div>
                    <div style={{fontSize:14,fontWeight:600,color:"var(--light)"}}>{item.qty || 0}</div>
                  </div>
                  <div>
                    <div style={{fontSize:8,letterSpacing:"0.18em",textTransform:"uppercase",color:"var(--muted)",marginBottom:4}}>Sold Today</div>
                    <div style={{display:"flex",alignItems:"center",gap:4}}>
                    <button onClick={()=>updateQty(catIdx,itemIdx,-1)}
                      style={{...css.btn("ghost"),padding:"4px 10px",fontSize:14,lineHeight:1,
                              minWidth:32,textAlign:"center"}}>−</button>
                    <input
                      type="number" value={item.sold ? item.sold : ""} min="0"
                      onChange={e=>setQty(catIdx,itemIdx,e.target.value)}
                      style={{width:52,textAlign:"center",padding:"6px 4px",
                              fontSize:14,fontWeight:600,color:"var(--white)"}}/>
                    <button className="day-accent" onClick={()=>updateQty(catIdx,itemIdx,1)}
                      style={{...css.btn("blue"),padding:"4px 10px",fontSize:14,lineHeight:1,
                              minWidth:32,textAlign:"center"}}>+</button>
                    </div>
                  </div>
                  <div>
                    <div style={{fontSize:8,letterSpacing:"0.18em",textTransform:"uppercase",color:"var(--muted)",marginBottom:4}}>Remaining</div>
                    <div style={{fontSize:14,fontWeight:600,color:"var(--greenT)"}}>{remainingQty(item)}</div>
                  </div>
                  <button type="button" aria-hidden="true"
                    style={{display:"none",background:"none",border:"none",color:"var(--dim)",
                            fontSize:14,padding:"0 2px",lineHeight:1}}>×</button>
                </div>
              ))}

              {/* Add item inline */}
              {addingTo===cat.category && (
                <div style={{padding:"10px 16px",display:"flex",gap:8,borderTop:"1px solid var(--border)"}}>
                  <input value={newItemName} onChange={e=>setNewItemName(e.target.value)}
                    placeholder="New item name..."
                    onKeyDown={e=>e.key==="Enter"&&addItem(catIdx)}
                    style={{flex:1,padding:"8px 10px",fontSize:12}}/>
                  <button className="day-accent" onClick={()=>addItem(catIdx)}
                    style={{...css.btn("blue"),padding:"8px 14px",fontSize:9}}>Add</button>
                  <button onClick={()=>{setAddingTo(null);setNewItemName("");}}
                    style={{...css.btn("ghost"),padding:"8px 10px",fontSize:9}}>Cancel</button>
                </div>
              )}
            </div>
          </div>
        )})}

        {/* Add new category */}
        <div style={{...css.card,display:"flex",flexDirection:"column",
                     justifyContent:"center",alignItems:"center",minHeight:120,
                     border:"1px dashed var(--border)",background:"transparent",cursor:"pointer"}}
          onClick={()=>setAddingCategory(true)}>
          {addingCategory ? (
            <div onClick={e=>e.stopPropagation()} style={{width:"100%",padding:16,display:"flex",flexDirection:"column",gap:8}}>
              <input value={newCatName} onChange={e=>setNewCatName(e.target.value)}
                placeholder="Category name (e.g. ECN-2)"
                onKeyDown={e=>e.key==="Enter"&&addCategory()}
                style={{padding:"8px 10px",fontSize:12}} autoFocus/>
              <div style={{display:"flex",gap:8}}>
                <button className="day-accent" onClick={e=>{e.stopPropagation();addCategory();}}
                  style={{...css.btn("blue"),flex:1,padding:"8px"}}>Add Category</button>
                <button onClick={e=>{e.stopPropagation();setAddingCategory(false);setNewCatName("");}}
                  style={{...css.btn("ghost"),flex:1,padding:"8px"}}>Cancel</button>
              </div>
            </div>
          ) : (
            <>
              <div style={{fontSize:24,color:"var(--dim)",marginBottom:6}}>+</div>
              <div style={{fontSize:9,letterSpacing:"0.2em",textTransform:"uppercase",color:"var(--dim)"}}>
                Add Category
              </div>
            </>
          )}
        </div>
      </div>

      {/* Stock history */}
      <div style={{...css.card,marginBottom:16,padding:0,overflow:"hidden"}}>
        <button onClick={()=>{setHistoryOpen(v=>!v); if (!historyOpen) loadStockHistory();}}
          style={{width:"100%",background:"var(--card2)",border:"none",borderBottom:historyOpen?"1px solid var(--border)":"none",
                  padding:"13px 16px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <span style={{fontSize:10,fontWeight:600,letterSpacing:"0.3em",textTransform:"uppercase",color:"var(--blue-l)"}}>
            Stock History
          </span>
          <span style={{fontSize:18,color:"var(--muted)",lineHeight:1}}>{historyOpen?"-":"+"}</span>
        </button>

        {historyOpen && (
          <div style={{padding:16}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12,gap:10}}>
              <div style={{fontSize:11,color:"var(--muted)",lineHeight:1.6}}>
                Recent finalize snapshots, useful when stock was saved before everything was entered.
              </div>
              <button onClick={loadStockHistory} disabled={historyLoading}
                style={{...css.btn("ghost"),padding:"8px 12px",fontSize:9,whiteSpace:"nowrap"}}>
                {historyLoading ? "Working on it..." : "↻ Refresh"}
              </button>
            </div>
            {historyNotice && (
              <div style={{fontSize:11,color:"var(--gold-l)",lineHeight:1.6,marginBottom:12,
                           background:"var(--dark)",border:"1px solid var(--border)",borderRadius:2,padding:"10px 12px"}}>
                {historyNotice}
              </div>
            )}

            {stockHistory.length===0 ? (
              <div style={{textAlign:"center",padding:"24px 16px",fontSize:12,color:"var(--dim)"}}>
                No stock history yet
              </div>
            ) : (
              <div style={{display:"grid",gridTemplateColumns:selectedHistory?"260px 1fr":"1fr",gap:12}}>
                <div style={{display:"flex",flexDirection:"column",gap:6}}>
                  {stockHistory.slice(0,12).map(entry => {
                    const summary = historySummary(entry);
                    return (
                      <button key={entry.id || entry.timestamp} onClick={()=>setSelectedHistory(entry)}
                        style={{background:selectedHistory==entry?"var(--blue-gl)":"var(--dark)",
                                border:"1px solid var(--border)",borderLeft:"3px solid var(--gold)",
                                borderRadius:2,padding:"10px 12px",textAlign:"left",cursor:"pointer"}}>
                        <div style={{fontSize:12,color:"var(--white)",fontWeight:600}}>
                          {fmtDT(entry.timestamp)}
                        </div>
                        <div style={{fontSize:10,color:"var(--muted)",marginTop:4,lineHeight:1.5}}>
                          Sold entered: {summary.soldCount} · Items: {summary.afterItems}
                        </div>
                      </button>
                    );
                  })}
                </div>

                {selectedHistory && (
                  <div style={{background:"var(--dark)",border:"1px solid var(--border)",borderRadius:2,padding:14}}>
                    <div style={{display:"flex",justifyContent:"space-between",gap:12,alignItems:"center",marginBottom:12}}>
                      <div>
                        <div style={{fontSize:12,color:"var(--white)",fontWeight:600}}>{fmtDT(selectedHistory.timestamp)}</div>
                        <div style={{fontSize:10,color:"var(--muted)",marginTop:3}}>Finalize snapshot</div>
                      </div>
                      <button onClick={()=>setSelectedHistory(null)}
                        style={{background:"none",border:"1px solid var(--border)",color:"var(--muted)",padding:"4px 8px",borderRadius:2}}>×</button>
                    </div>

                    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:12}}>
                      {[
                        {label:"Before Save", data:parseHistoryStock(selectedHistory.beforeStock)},
                        {label:"After Save", data:parseHistoryStock(selectedHistory.afterStock)}
                      ].map(block => (
                        <div key={block.label}>
                          <div style={{fontSize:9,letterSpacing:"0.22em",textTransform:"uppercase",color:"var(--muted)",marginBottom:8}}>
                            {block.label}
                          </div>
                          <div style={{maxHeight:220,overflowY:"auto",border:"1px solid var(--border)",borderRadius:2,padding:10}}>
                            {block.data.map(cat => (
                              <div key={cat.category} style={{marginBottom:10}}>
                                <div style={{fontSize:10,color:"var(--blue-l)",fontWeight:700,letterSpacing:"0.16em",textTransform:"uppercase",marginBottom:5}}>
                                  {cat.category}
                                </div>
                                {(cat.items || []).filter(item=>item.visible!==false).map(item => (
                                  <div key={item.name} style={{display:"flex",justifyContent:"space-between",gap:8,fontSize:11,color:"var(--light)",lineHeight:1.7}}>
                                    <span>{item.name}</span>
                                    <span>{item.qty || 0}{item.sold ? ` / sold ${item.sold}` : ""}</span>
                                  </div>
                                ))}
                              </div>
                            ))}
                          </div>
                        </div>
                      ))}
                    </div>

                    {selectedHistory.report && (
                      <pre style={{fontSize:12,lineHeight:1.7,color:"var(--light)",whiteSpace:"pre-wrap",
                                   background:"var(--card)",border:"1px solid var(--border)",borderRadius:2,padding:12}}>
                        {selectedHistory.report}
                      </pre>
                    )}
                  </div>
                )}
              </div>
            )}
          </div>
        )}
      </div>

      {/* Manage items */}
      <div style={{...css.card,marginBottom:16,padding:0,overflow:"hidden"}}>
        <button onClick={()=>setManageOpen(v=>!v)}
          style={{width:"100%",background:"var(--card2)",border:"none",borderBottom:manageOpen?"1px solid var(--border)":"none",
                  padding:"13px 16px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <span style={{fontSize:10,fontWeight:600,letterSpacing:"0.3em",textTransform:"uppercase",color:"var(--blue-l)"}}>
            Manage Items
          </span>
          <span style={{fontSize:18,color:"var(--muted)",lineHeight:1}}>{manageOpen?"-":"+"}</span>
        </button>

        {manageOpen && (
          <div style={{padding:16}}>
            <input value={manageSearch}
              onChange={e=>setManageSearch(e.target.value)}
              placeholder="Search item or category..."
              style={{padding:"9px 11px",fontSize:12,marginBottom:12}}/>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 90px 92px",gap:8,marginBottom:12}}>
              <input value={manageNew.name}
                onChange={e=>setManageNew(m=>({...m,name:e.target.value}))}
                placeholder="New item name"
                style={{padding:"8px 10px",fontSize:12}}/>
              <input value={manageNew.category}
                onChange={e=>setManageNew(m=>({...m,category:e.target.value}))}
                placeholder="Category"
                style={{padding:"8px 10px",fontSize:12}}/>
              <input type="number" min="0" value={manageNew.qty}
                onChange={e=>setManageNew(m=>({...m,qty:e.target.value}))}
                placeholder="Start qty"
                style={{padding:"8px 10px",fontSize:12}}/>
              <button className="day-accent" onClick={addManagedItem} disabled={saving}
                style={{...css.btn("blue"),padding:"8px 10px",fontSize:9,opacity:saving?0.55:1}}>
                {saving ? "Saving..." : "Add Item"}
              </button>
            </div>

            <div style={{display:"grid",gridTemplateColumns:"1.16fr 0.74fr 58px 116px 118px 132px",gap:8,
                         padding:"0 8px 7px",fontSize:8,letterSpacing:"0.18em",textTransform:"uppercase",
                         color:"var(--muted)"}}>
              <span>Item</span>
              <span>Category</span>
              <span style={{textAlign:"center"}}>Qty</span>
              <span>Stock In</span>
              <span>Added / Updated</span>
              <span></span>
            </div>

            <div style={{display:"flex",flexDirection:"column",gap:6}}>
              {stock.flatMap((cat, catIdx) => (cat.items || [])
                .map((item, itemIdx) => ({cat, catIdx, item, itemIdx}))
                .filter(({cat, item}) => {
                  const q = manageSearch.trim().toLowerCase();
                  if (!q) return true;
                  return String(item.name || "").toLowerCase().includes(q) ||
                         String(cat.category || "").toLowerCase().includes(q);
                })
                .map(({cat, catIdx, item, itemIdx}) => (
                <div key={`${cat.category}-${itemIdx}-${item.name}`} style={{
                  display:"grid",gridTemplateColumns:"1.16fr 0.74fr 58px 116px 118px 132px",gap:8,alignItems:"center",
                  background:"var(--dark)",border:"1px solid var(--border)",borderRadius:2,padding:8,
                  opacity:item.visible===false?0.62:1
                }}>
                  <input value={item.name}
                    onChange={e=>setItemField(catIdx,itemIdx,"name",e.target.value)}
                    style={{padding:"7px 9px",fontSize:12}}/>
                  <input defaultValue={cat.category}
                    onBlur={e=>setItemCategory(catIdx,itemIdx,e.target.value)}
                    onKeyDown={e=>{if(e.key==="Enter") e.currentTarget.blur();}}
                    style={{padding:"7px 9px",fontSize:12}}/>
                  <input type="number" min="0" value={item.qty || 0}
                    onChange={e=>setItemField(catIdx,itemIdx,"qty",e.target.value)}
                    style={{padding:"7px 9px",fontSize:12,textAlign:"center"}}/>
                  <div style={{display:"grid",gridTemplateColumns:"48px 1fr",gap:6}}>
                    <input type="number" min="0" value={stockInDrafts[stockDraftKey(catIdx,itemIdx)] || ""}
                      onChange={e=>setStockInDrafts(drafts=>({...drafts,[stockDraftKey(catIdx,itemIdx)]:e.target.value}))}
                      placeholder="+"
                      style={{padding:"7px 6px",fontSize:12,textAlign:"center"}}/>
                    <button onClick={()=>addStockToManagedItem(catIdx,itemIdx)} disabled={saving}
                      style={{...css.btn("blue"),padding:"8px 6px",fontSize:8,opacity:saving?0.55:1}}>
                      Add
                    </button>
                  </div>
                  <div style={{fontSize:10,color:item.addedAt?"var(--gold-l)":"var(--muted)",lineHeight:1.4}}>
                    {stockMetaText(item)}
                  </div>
                  <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:6}}>
                    <button onClick={()=>setItemVisible(catIdx,itemIdx,item.visible===false)}
                      style={{...css.btn(item.visible===false?"green":"ghost"),padding:"8px 8px",fontSize:9}}>
                      {item.visible===false?"Restore":"Hide"}
                    </button>
                    <button onClick={()=>removeManagedItem(catIdx,itemIdx)}
                      style={{...css.btn("danger"),padding:"8px 8px",fontSize:9}}>
                      Remove
                    </button>
                  </div>
                </div>
              )))}
            </div>
          </div>
        )}
      </div>

      {/* Report output */}
      {report && (
        <div style={{...css.card,marginTop:8}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
            <span style={{fontSize:9,letterSpacing:"0.35em",textTransform:"uppercase",color:"var(--muted)"}}>
              End of Day Report
            </span>
            <button onClick={copyReport}
              style={{...css.btn(copied?"ghost":"primary"),padding:"8px 16px",fontSize:9}}>
              {copied?"Copied ✓":"Copy Report"}
            </button>
          </div>
          <pre style={{fontSize:13,lineHeight:1.9,color:"var(--white)",
                       fontFamily:"'Montserrat',sans-serif",whiteSpace:"pre-wrap",
                       background:"var(--dark)",border:"1px solid var(--border)",
                       borderRadius:2,padding:16}}>
            {report}
          </pre>
        </div>
      )}
    </div>
  );
}

ReactDOM.render(<App/>, document.getElementById("root"));
</script>
</body>
</html>
