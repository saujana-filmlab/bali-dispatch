const DATA_CACHE_KEY = "saujana-dispatch-cache-v1";

function readDispatchCache() {
  try {
    const cached = JSON.parse(localStorage.getItem(DATA_CACHE_KEY) || "null");
    return cached && Array.isArray(cached.customers) && Array.isArray(cached.orders)
      ? cached
      : null;
  } catch(e) {
    return null;
  }
}

function writeDispatchCache(customers, orders) {
  try {
    localStorage.setItem(DATA_CACHE_KEY, JSON.stringify({
      customers,
      orders,
      savedAt: Date.now()
    }));
  } catch(e) {}
}

async function apiCall(action, data=null) {
  try {
    const url = `${API}?action=${encodeURIComponent(action)}&_=${Date.now()}`;
    const readJson = async response => {
      const text = await response.text();
      try {
        return JSON.parse(text);
      } catch (err) {
        return {
          error: `Google Sheets returned ${response.status || "a non-JSON response"}`,
          detail: text.slice(0, 180)
        };
      }
    };

    if (data) {
      const r = await fetch(url, {
        method: "POST", 
        redirect: "follow",
        cache: "no-store",
        headers: {
          "Content-Type": "text/plain;charset=utf-8"
        },
        body: JSON.stringify(data)
      });
      return await readJson(r);
    }

    let r;
    try {
      r = await fetch(url, {
        method: "GET",
        redirect: "follow",
        cache: "no-store"
      });
      const result = await readJson(r);
      if (!result?.error) return result;
    } catch (getErr) {
      console.warn("GET API failed, retrying as POST:", getErr);
    }

    r = await fetch(url, {
      method: "POST",
      redirect: "follow",
      cache: "no-store",
      headers: {
        "Content-Type": "text/plain;charset=utf-8"
      },
      body: "{}"
    });
    return await readJson(r);
  } catch(e) { 
    return {error: e.toString()}; 
  }
}

const cleanOrderNumber = value => String(value || "").trim().toUpperCase();

const deliveryUrl = o => {
  if (!o || typeof o !== 'object') return BASE_URL;
  const orderNum = (o.orderNumber || "").toString();
  const name     = (o.customerName || "Customer").toString();
  const film     = (o.film || "").toString();
  const link     = (o.driveLink || "").toString();
  // Notes excluded from URL — fetched from Sheets by delivery page
  return `${BASE_URL}/?order=${encodeURIComponent(orderNum)}&name=${encodeURIComponent(name)}&film=${encodeURIComponent(film)}&link=${encodeURIComponent(link)}`;
};

async function getShortLink(longUrl) {
  // is.gd supports CORS natively — no proxy needed, fast and reliable
  const services = [
    `https://is.gd/create.php?format=simple&url=${encodeURIComponent(longUrl)}`,
    `https://v.gd/create.php?format=simple&url=${encodeURIComponent(longUrl)}`,
  ];
  for (const endpoint of services) {
    try {
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 8000);
      const res = await fetch(endpoint, { signal: controller.signal });
      clearTimeout(timeout);
      const text = (await res.text()).trim();
      if (text.startsWith("http")) return text;
    } catch(e) {}
  }
  return longUrl; // fallback to full URL if both fail
}

function Registry({customers, orders, onAdd, onUpdate, onDelete, onNewOrderFor}) {
  const [search, setSearch]       = useState("");
  const [sortBy, setSortBy]       = useState("name");
  const [selected, setSelected]   = useState(null);
  const [editing, setEditing]     = useState(null);
  const [form, setForm]           = useState({name:"",email:"",phone:""});
  const [saving, setSaving]       = useState(false);
  const [toast, setToast]         = useState("");
  const [page, setPage]           = useState(1);
  const pageSize = 20;

  const showToast = msg => { setToast(msg); setTimeout(()=>setToast(""),2500); };

const filtered = customers
  .filter(c => {
    const q = search.toLowerCase();

    return (
      String(c.name || "").toLowerCase().includes(q) ||
      String(c.email || "").toLowerCase().includes(q) ||
      String(c.phone || "").toLowerCase().includes(q)
    );
  })    .sort((a,b)=>
      sortBy==="orders"?(b.totalOrders||0)-(a.totalOrders||0):
      sortBy==="recent"?(b.lastOrderDate||0)-(a.lastOrderDate||0):
      a.name.localeCompare(b.name)
    );
  const totalPages = Math.max(1, Math.ceil(filtered.length / pageSize));
  const currentPage = Math.min(page, totalPages);
  const pagedCustomers = filtered.slice((currentPage-1)*pageSize, currentPage*pageSize);

  const custOrders = selected
    ? orders.filter(o=>o.customerId===selected.id).sort((a,b)=>b.createdAt-a.createdAt)
    : [];

  async function save() {
    if (!form.name.trim()||!form.email.trim()) return;
    setSaving(true);
    if (editing==="new") {
      await onAdd(form);
      showToast("Customer added ✓");
    } else {
      await onUpdate({...editing,...form});
      showToast("Updated ✓");
    }
    setEditing(null); setSaving(false);
  }
async function updateCustomerInfo() {
  if (!selCust) return;

  const res = await apiCall("updateCustomer", {
    id: selCust.id,
    name: custInput.trim(),
    email: custEmail.trim(),
    phone: custPhone.trim()
  });

  if (res?.success) {
  setSelCust({
    ...selCust,
    name: custInput.trim(),
    email: custEmail.trim(),
    phone: custPhone.trim()
  });

  showToast("Customer updated ✓");
} else {
  showToast(res?.error || "Could not update customer");
}
}
  async function del(id) {

function App() {
  const cachedDispatch = readDispatchCache();
  const [authed, setAuthed]       = useState(sessionStorage.getItem("saujana-auth")==="1");
  const [theme, setTheme]         = useState("night");
  const [tab, setTab]             = useState("dispatch");
  const [customers, setCustomers] = useState(cachedDispatch?.customers || []);
  const [orders, setOrders]       = useState(cachedDispatch?.orders || []);
  const [loading, setLoading]     = useState(!cachedDispatch);
  const [syncing, setSyncing]     = useState(false);
  const [prefill, setPrefill]     = useState(null);
  const [loadError, setLoadError] = useState("");

  useEffect(() => {
    document.body.setAttribute("data-theme", theme === "day" ? "light" : "dark");
  }, [theme]);

  const wait = ms => new Promise(resolve => setTimeout(resolve, ms));

  async function loadSheetData() {
    const combined = await apiCall("getInitialData");
    if (combined && Array.isArray(combined.customers) && Array.isArray(combined.orders)) {
      return [combined.customers, combined.orders];
    }

    const [c, o] = await Promise.all([
      apiCall("getCustomers"),
      apiCall("getOrders")
    ]);

    if (!Array.isArray(c) || !Array.isArray(o)) {
      throw new Error(c?.error || o?.error || "Google Sheets returned an unexpected response");
    }

    return [c, o];
  }

  async function load() {
    setLoading(customers.length === 0 && orders.length === 0);
    setLoadError("");

    try {
      let c, o;
      try {
        [c, o] = await loadSheetData();
      } catch (firstErr) {
        console.warn("LOAD RETRY:", firstErr);
        await wait(1800);
        [c, o] = await loadSheetData();
      }

      console.log("CUSTOMERS API:", c);

      setCustomers(c);
      setOrders(o);
      writeDispatchCache(c, o);
    } catch (err) {
      console.error("LOAD ERROR:", err);
      setLoadError(`Could not load Google Sheets: ${err.message || err}. Wait a moment, then tap Refresh.`);
    } finally {
      setLoading(false);
    }
  }

  useEffect(()=>{ if(authed) load(); },[authed]);

  async function handleAdd(form) {
    setSyncing(true);
    const nc = await apiCall("addCustomer",form);
    setCustomers(p=>[nc,...p]);
    setSyncing(false);
  }

  async function handleUpdate(c) {
    setSyncing(true);
    await apiCall("updateCustomer",c);
    setCustomers(p=>p.map(cu=>cu.id===c.id?{...cu,...c}:cu));
    setSyncing(false);
  }

  async function handleDelete(id) {
    setSyncing(true);
    try {
      const result = await apiCall("deleteCustomer",{id, customerId:id});
      if (result?.error) throw new Error(result.error);
      setCustomers(p=>p.filter(c=>c.id!==id));
      await load();
    } finally {
      setSyncing(false);
    }
  }

  function handleOrderSaved(saved, custId) {
    setOrders(p=>[{...saved,createdAt:Date.now()},...p]);
    if (custId) {
      setCustomers(p=>p.map(c=>c.id===custId
        ?{...c,totalOrders:(c.totalOrders||0)+1,lastOrderDate:Date.now()}:c));
    }
  }

  function handleNewOrderFor(c) {
    setPrefill(c); setTab("dispatch");
  }

  if (!authed) return <LockScreen onUnlock={()=>setAuthed(true)}/>;

  return (
    <>
      {/* Header */}
      <div style={{background:"var(--dark)",borderBottom:"1px solid var(--border)",
                   padding:"0 24px",position:"sticky",top:0,zIndex:100}}>
        <div style={{maxWidth:1100,margin:"0 auto"}}>
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",paddingTop:14}}>
            <div>
              <img className="brand-logo" src="dd-horizontal.png" alt="Darkroom Dispatch Logo" style={{height:45, objectFit:"contain", display:"block"}}/>
              <div style={{fontSize:8,letterSpacing:"0.4em",textTransform:"uppercase",color:"var(--muted)",marginTop:8}}>
                Film Lab Bali · Operations
              </div>
            </div>
            <div style={{display:"flex",alignItems:"center",gap:12}}>
              {syncing&&<span style={{fontSize:9,color:"var(--muted)",letterSpacing:"0.2em",textTransform:"uppercase"}}>Syncing...</span>}
              <button
                onClick={() => setTheme(t => t === "day" ? "night" : "day")}
                style={{...css.btn("ghost"),padding:"6px 12px",fontSize:9,minWidth:82}}
              >
                Theme: {theme === "day" ? "☀️" : "🌙"}
              </button>
              <button onClick={load} style={{...css.btn("ghost"),padding:"6px 12px",fontSize:9}}>↻ Refresh</button>
              <div className="scoreboard" aria-label={`${customers.length} customers, ${orders.length} orders`}>
                <div className="scoreboard-item">
                  <span className="scoreboard-number">{customers.length}</span>
                  <span className="scoreboard-label">Cust</span>
                </div>
                <div className="scoreboard-item">
                  <span className="scoreboard-number">{orders.length}</span>
                  <span className="scoreboard-label">Orders</span>
                </div>
              </div>
            </div>
          </div>
          <div style={{display:"flex",marginTop:10}}>
            {[{id:"dispatch",l:"Darkroom Dispatch"},{id:"registry",l:"Customer Registry"},{id:"stock",l:"Stock Count"}].map(t=>(
              <button key={t.id} onClick={()=>setTab(t.id)} style={{
                padding:"10px 24px",background:"none",
                border:"none",borderBottom:`2px solid ${tab===t.id?"var(--blue-l)":"transparent"}`,
                color:tab===t.id?"var(--white)":"var(--muted)",
                fontFamily:"'Montserrat',sans-serif",fontSize:10,
                fontWeight:tab===t.id?500:300,letterSpacing:"0.2em",textTransform:"uppercase",cursor:"pointer",
              }}>{t.l}</button>
            ))}
          </div>
        </div>
      </div>

      {/* Content */}
      <div style={{maxWidth:1100,margin:"0 auto",padding:"20px 24px"}}>
        {loadError && (
          <div style={{marginBottom:16,padding:"12px 14px",border:"1px solid var(--red)",background:"rgba(255,80,80,0.08)",
                       color:"var(--light)",fontSize:11,lineHeight:1.6}}>
            {loadError}
          </div>
        )}
        {loading ? (
          <div style={{textAlign:"center",padding:80,fontSize:11,letterSpacing:"0.3em",
                       textTransform:"uppercase",color:"var(--dim)"}}>
            Connecting to Google Sheets...
          </div>
        ) : tab==="dispatch" ? (
          <Dispatch customers={customers} orders={orders} onOrderSaved={handleOrderSaved}
            prefill={prefill} clearPrefill={()=>setPrefill(null)}/>
        ) : tab==="registry" ? (
  <Registry customers={customers} orders={orders}
    onAdd={handleAdd} onUpdate={handleUpdate} onDelete={handleDelete}
    onNewOrderFor={handleNewOrderFor}/>
) : (
  <StockTracker/>
        )}
      </div>
    </>
  );
}

// ── STOCK TRACKER COMPONENT ───────────────────────────────
function StockTracker() {
  const [stock, setStock]         = useState([]);
  const [loading, setLoading]     = useState(true);
  const [saving, setSaving]       = useState(false);
  const [report, setReport]       = useState("");
  const [copied, setCopied]       = useState(false);
  const [toast, setToast]         = useState("");
  // Add item UI
  const [addingTo, setAddingTo]   = useState(null); // category name
  const [newItemName, setNewItemName] = useState("");
  const [addingCategory, setAddingCategory] = useState(false);
  const [newCatName, setNewCatName] = useState("");
  const [manageOpen, setManageOpen] = useState(false);
  const [manageNew, setManageNew] = useState({category:"", name:"", qty:"0"});
  const [manageSearch, setManageSearch] = useState("");

  const showToast = msg => { setToast(msg); setTimeout(()=>setToast(""),2500); };
  const remainingQty = item => Math.max(0, (item.qty || 0) - (item.sold || 0));
  const normalizeStock = categories => categories.map(cat => ({
    ...cat,
    items: (cat.items || []).map(item => ({
      ...item,
      qty: Number(item.qty) || 0,
      sold: Number(item.sold) || 0,
      visible: item.visible !== false,
      lastUpdated: item.lastUpdated || ""
    }))
  }));
  const finalizeStock = categories => categories.map(cat => ({
    ...cat,
    items: (cat.items || []).map(item => ({
      ...item,
      qty: remainingQty(item),
      sold: 0,
      visible: item.visible !== false
    }))
  }));

  // Load stock from Sheets
  useEffect(() => { loadStock(); }, []);

  async function loadStock() {
    setLoading(true);
    try {
      const res = await apiCall("getStock");
      if (res && Array.isArray(res) && res.length > 0) {
        setStock(normalizeStock(res));
      } else {
        setStock(normalizeStock(DEFAULT_STOCK));
      }
    } catch(e) {
      setStock(normalizeStock(DEFAULT_STOCK));
    }
    setLoading(false);
  }

  function buildReportText(sourceStock=stock) {
    const now = new Date();
    const day = now.getDate();
    const month = now.toLocaleString("en-GB", {month:"long"});
    const year = now.getFullYear();
    const dateStr = `${day} ${month} ${year}`;

    let lines = [`${dateStr}`, ``];
    sourceStock.forEach(cat => {
      const visibleItems = (cat.items || []).filter(item => item.visible !== false);
      if (visibleItems.length === 0) return;
      if (lines.length > 2) lines.push(``);
      lines.push(`${cat.category}`);
      visibleItems.forEach(item => {
        lines.push(`${item.name} - ${remainingQty(item)}`);
      });
    });

    return lines.join("\n");
  }

  async function saveStock() {
    setSaving(true);
    try {
      const finalizedStock = finalizeStock(stock);
      await apiCall("saveStock", {stock: finalizedStock});
      setStock(finalizedStock);
      showToast("Stock saved ✓");
    } catch(e) {
      showToast("Save failed");
    }
    setSaving(false);
  }

  async function finalizeAndGenerateReport() {
    setSaving(true);
    try {
      const reportText = buildReportText(stock);
      const finalizedStock = finalizeStock(stock);
      await apiCall("saveStock", {stock: finalizedStock});
      setStock(finalizedStock);
      setReport(reportText);
      showToast("Stock saved and report generated");
    } catch(e) {
      showToast("Save failed");
    }
    setSaving(false);
  }

  function updateQty(catIdx, itemIdx, delta) {
    const updated = stock.map((cat, ci) => ci !== catIdx ? cat : {
      ...cat,
      items: cat.items.map((item, ii) => ii !== itemIdx ? item : {
        ...item, sold: Math.max(0, (item.sold || 0) + delta)
      })
    });
    setStock(updated);
  }

  function setQty(catIdx, itemIdx, val) {
    if (val === "") {
      const updated = stock.map((cat, ci) => ci !== catIdx ? cat : {
        ...cat,
        items: cat.items.map((item, ii) => ii !== itemIdx ? item : {...item, sold: 0})
      });
      setStock(updated);
      return;
    }
    const n = parseInt(val);
    if (isNaN(n) || n < 0) return;
    const updated = stock.map((cat, ci) => ci !== catIdx ? cat : {
      ...cat,
      items: cat.items.map((item, ii) => ii !== itemIdx ? item : {...item, sold: n})
    });
    setStock(updated);
  }

  function setItemField(catIdx, itemIdx, field, val) {
    const updated = stock.map((cat, ci) => ci !== catIdx ? cat : {
      ...cat,
      items: cat.items.map((item, ii) => {
        if (ii !== itemIdx) return item;
        const nextVal = field === "qty" ? Math.max(0, parseInt(val) || 0) : val;
        return {...item, [field]: nextVal};
      })
    });
    setStock(updated);
  }

  function setItemVisible(catIdx, itemIdx, visible) {
    const updated = stock.map((cat, ci) => ci !== catIdx ? cat : {
      ...cat,
      items: cat.items.map((item, ii) => ii !== itemIdx ? item : {...item, visible})
    });
    setStock(updated);
  }

  function setItemCategory(catIdx, itemIdx, newCategory) {
    const category = newCategory.trim().toUpperCase();
    if (!category) return;
    const movingItem = stock[catIdx]?.items?.[itemIdx];
    if (!movingItem || stock[catIdx].category === category) return;

    setStock(prev => {
      let moved = false;
      const withoutItem = prev
        .map((cat, ci) => ci !== catIdx ? cat : {...cat, items: cat.items.filter((_, ii) => ii !== itemIdx)})
        .filter(cat => cat.items.length > 0);
      const updated = withoutItem.map(cat => {
        if (cat.category !== category) return cat;
        moved = true;
        return {...cat, items: [...cat.items, movingItem]};
      });
      return moved ? updated : [...updated, {category, items:[movingItem]}];
    });
  }

  function addItem(catIdx) {
    if (!newItemName.trim()) return;
    const updated = stock.map((cat, ci) => ci !== catIdx ? cat : {
      ...cat, items: [...cat.items, {name: newItemName.trim(), qty: 0, sold: 0, visible: true}]
    });
    setStock(updated);
    setNewItemName("");
    setAddingTo(null);
  }

  function addManagedItem() {
    const category = manageNew.category.trim().toUpperCase();
    const name = manageNew.name.trim();
    if (!category || !name) return;
    const qty = Math.max(0, parseInt(manageNew.qty) || 0);
    let added = false;
    const updated = stock.map(cat => {
      if (cat.category !== category) return cat;
      added = true;
      return {...cat, items:[...cat.items, {name, qty, sold:0, visible:true}]};
    });
    setStock(added ? updated : [...updated, {category, items:[{name, qty, sold:0, visible:true}]}]);
    setManageNew({category:"", name:"", qty:"0"});
  }

  function addCategory() {
    const category = newCatName.trim().toUpperCase();
    if (!category) return;
    setStock(s => s.some(cat => cat.category === category) ? s : [...s, {category, items: []}]);
    setNewCatName("");
    setAddingCategory(false);
    setAddingTo(category);
  }

  function generateReport() {
    setReport(buildReportText(stock));
  }

  function copyReport() {
    navigator.clipboard.writeText(report).then(() => {
      setCopied(true);
      showToast("Report copied!");
      setTimeout(() => setCopied(false), 2000);
    });
  }

  function copyWhatsAppReport() {
    const text = buildReportText(stock);
    setReport(text);
    navigator.clipboard.writeText(text).then(() => {
      setCopied(true);
      showToast("WhatsApp report copied");
      setTimeout(() => setCopied(false), 2000);
    });
  }

  if (loading) return (
    <div style={{textAlign:"center",padding:80,fontSize:11,letterSpacing:"0.3em",
                 textTransform:"uppercase",color:"var(--dim)"}}>Loading stock...</div>
  );

  return (
    <div style={{maxWidth:900,margin:"0 auto"}}>
      {toast && <div style={{position:"fixed",bottom:24,right:24,background:"var(--card)",
        border:"1px solid var(--blue)",borderRadius:3,padding:"12px 20px",
        fontSize:12,color:"var(--blue-l)",zIndex:999}}>{toast}</div>}

      {/* Header row */}
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}}>
        <div>
          <div style={{fontFamily:"'Cormorant Garamond',serif",fontSize:28,fontStyle:"italic",color:"var(--white)"}}>
            Stock Count
          </div>
          <div style={{fontSize:9,letterSpacing:"0.35em",textTransform:"uppercase",color:"var(--muted)",marginTop:4}}>
            End of Day · Inventory Check
          </div>
        </div>
        <div style={{display:"flex",gap:8}}>
          <button className="day-accent" onClick={finalizeAndGenerateReport} disabled={saving}
            style={{...css.btn("blue"),padding:"10px 18px",opacity:saving?0.5:1}}>
            {saving?"Saving...":"Finalize + Save Report"}
          </button>
          <button onClick={copyWhatsAppReport}
            style={{...css.btn("primary"),padding:"10px 18px"}}>
            Copy WhatsApp
          </button>
        </div>
      </div>

      {/* Stock grid */}
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(360px,1fr))",gap:12,marginBottom:16}}>
        {stock.map((cat, catIdx) => {
          const hasVisibleItems = (cat.items || []).some(item => item.visible !== false);
          const isEmptyCategory = !cat.items || cat.items.length === 0;
          const isAddingToCategory = addingTo === cat.category;
          if (!hasVisibleItems && !isEmptyCategory && !isAddingToCategory) return null;
          return (
          <div key={catIdx} style={{...css.card,padding:0,overflow:"hidden"}}>
            {/* Category header */}
            <div style={{background:"var(--card2)",borderBottom:"1px solid var(--border)",
                         padding:"12px 16px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <span className="stock-heading" style={{fontSize:10,fontWeight:600,letterSpacing:"0.3em",
                            textTransform:"uppercase",color:"var(--blue-l)"}}>{cat.category}</span>
              <button className="day-accent" onClick={()=>setAddingTo(addingTo===cat.category?null:cat.category)}
                style={{background:"none",border:"none",color:"var(--muted)",
                        fontSize:18,padding:"0 4px",lineHeight:1}}>+</button>
            </div>

            {/* Items */}
            <div style={{padding:"8px 0"}}>
              {cat.items.map((item, itemIdx) => item.visible === false ? null : (
                <div key={itemIdx} style={{display:"grid",gridTemplateColumns:"1fr 72px 132px 82px",alignItems:"center",gap:8,
                  padding:"10px 16px",borderBottom:"1px solid var(--border)"}}>
                  <div style={{fontSize:13,color:"var(--white)"}}>{item.name}</div>
                  <div>
                    <div style={{fontSize:8,letterSpacing:"0.18em",textTransform:"uppercase",color:"var(--muted)",marginBottom:4}}>Current</div>
                    <div style={{fontSize:14,fontWeight:600,color:"var(--light)"}}>{item.qty || 0}</div>
                  </div>
                  <div>
                    <div style={{fontSize:8,letterSpacing:"0.18em",textTransform:"uppercase",color:"var(--muted)",marginBottom:4}}>Sold Today</div>
                    <div style={{display:"flex",alignItems:"center",gap:4}}>
                    <button onClick={()=>updateQty(catIdx,itemIdx,-1)}
                      style={{...css.btn("ghost"),padding:"4px 10px",fontSize:14,lineHeight:1,
                              minWidth:32,textAlign:"center"}}>−</button>
                    <input
                      type="number" value={item.sold ? item.sold : ""} min="0"
                      onChange={e=>setQty(catIdx,itemIdx,e.target.value)}
                      style={{width:52,textAlign:"center",padding:"6px 4px",
                              fontSize:14,fontWeight:600,color:"var(--white)"}}/>
                    <button className="day-accent" onClick={()=>updateQty(catIdx,itemIdx,1)}
                      style={{...css.btn("blue"),padding:"4px 10px",fontSize:14,lineHeight:1,
                              minWidth:32,textAlign:"center"}}>+</button>
                    </div>
                  </div>
                  <div>
                    <div style={{fontSize:8,letterSpacing:"0.18em",textTransform:"uppercase",color:"var(--muted)",marginBottom:4}}>Remaining</div>
                    <div style={{fontSize:14,fontWeight:600,color:"var(--greenT)"}}>{remainingQty(item)}</div>
                  </div>
                  <button type="button" aria-hidden="true"
                    style={{display:"none",background:"none",border:"none",color:"var(--dim)",
                            fontSize:14,padding:"0 2px",lineHeight:1}}>×</button>
                </div>
              ))}

              {/* Add item inline */}
              {addingTo===cat.category && (
                <div style={{padding:"10px 16px",display:"flex",gap:8,borderTop:"1px solid var(--border)"}}>
                  <input value={newItemName} onChange={e=>setNewItemName(e.target.value)}
                    placeholder="New item name..."
                    onKeyDown={e=>e.key==="Enter"&&addItem(catIdx)}
                    style={{flex:1,padding:"8px 10px",fontSize:12}}/>
                  <button className="day-accent" onClick={()=>addItem(catIdx)}
                    style={{...css.btn("blue"),padding:"8px 14px",fontSize:9}}>Add</button>
                  <button onClick={()=>{setAddingTo(null);setNewItemName("");}}
                    style={{...css.btn("ghost"),padding:"8px 10px",fontSize:9}}>Cancel</button>
                </div>
              )}
            </div>
          </div>
        )})}

        {/* Add new category */}
        <div style={{...css.card,display:"flex",flexDirection:"column",
                     justifyContent:"center",alignItems:"center",minHeight:120,
                     border:"1px dashed var(--border)",background:"transparent",cursor:"pointer"}}
          onClick={()=>setAddingCategory(true)}>
          {addingCategory ? (
            <div onClick={e=>e.stopPropagation()} style={{width:"100%",padding:16,display:"flex",flexDirection:"column",gap:8}}>
              <input value={newCatName} onChange={e=>setNewCatName(e.target.value)}
                placeholder="Category name (e.g. ECN-2)"
                onKeyDown={e=>e.key==="Enter"&&addCategory()}
                style={{padding:"8px 10px",fontSize:12}} autoFocus/>
              <div style={{display:"flex",gap:8}}>
                <button className="day-accent" onClick={e=>{e.stopPropagation();addCategory();}}
                  style={{...css.btn("blue"),flex:1,padding:"8px"}}>Add Category</button>
                <button onClick={e=>{e.stopPropagation();setAddingCategory(false);setNewCatName("");}}
                  style={{...css.btn("ghost"),flex:1,padding:"8px"}}>Cancel</button>
              </div>
            </div>
          ) : (
            <>
              <div style={{fontSize:24,color:"var(--dim)",marginBottom:6}}>+</div>
              <div style={{fontSize:9,letterSpacing:"0.2em",textTransform:"uppercase",color:"var(--dim)"}}>
                Add Category
              </div>
            </>
          )}
        </div>
      </div>

      {/* Manage items */}
      <div style={{...css.card,marginBottom:16,padding:0,overflow:"hidden"}}>
        <button onClick={()=>setManageOpen(v=>!v)}
          style={{width:"100%",background:"var(--card2)",border:"none",borderBottom:manageOpen?"1px solid var(--border)":"none",
                  padding:"13px 16px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <span style={{fontSize:10,fontWeight:600,letterSpacing:"0.3em",textTransform:"uppercase",color:"var(--blue-l)"}}>
            Manage Items
          </span>
          <span style={{fontSize:18,color:"var(--muted)",lineHeight:1}}>{manageOpen?"-":"+"}</span>
        </button>

        {manageOpen && (
          <div style={{padding:16}}>
            <input value={manageSearch}
              onChange={e=>setManageSearch(e.target.value)}
              placeholder="Search item or category..."
              style={{padding:"9px 11px",fontSize:12,marginBottom:12}}/>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 90px 92px",gap:8,marginBottom:12}}>
              <input value={manageNew.name}
                onChange={e=>setManageNew(m=>({...m,name:e.target.value}))}
                placeholder="New item name"
                style={{padding:"8px 10px",fontSize:12}}/>
              <input value={manageNew.category}
                onChange={e=>setManageNew(m=>({...m,category:e.target.value}))}
                placeholder="Category"
                style={{padding:"8px 10px",fontSize:12}}/>
              <input type="number" min="0" value={manageNew.qty}
                onChange={e=>setManageNew(m=>({...m,qty:e.target.value}))}
                placeholder="Qty"
                style={{padding:"8px 10px",fontSize:12}}/>
              <button className="day-accent" onClick={addManagedItem}
                style={{...css.btn("blue"),padding:"8px 10px",fontSize:9}}>Add Item</button>
            </div>

            <div style={{display:"flex",flexDirection:"column",gap:6}}>
              {stock.flatMap((cat, catIdx) => (cat.items || [])
                .map((item, itemIdx) => ({cat, catIdx, item, itemIdx}))
                .filter(({cat, item}) => {
                  const q = manageSearch.trim().toLowerCase();
                  if (!q) return true;
                  return String(item.name || "").toLowerCase().includes(q) ||
                         String(cat.category || "").toLowerCase().includes(q);
                })
                .map(({cat, catIdx, item, itemIdx}) => (
                <div key={`${cat.category}-${itemIdx}-${item.name}`} style={{
                  display:"grid",gridTemplateColumns:"1.4fr 1fr 78px 92px",gap:8,alignItems:"center",
                  background:"var(--dark)",border:"1px solid var(--border)",borderRadius:2,padding:8,
                  opacity:item.visible===false?0.62:1
                }}>
                  <input value={item.name}
                    onChange={e=>setItemField(catIdx,itemIdx,"name",e.target.value)}
                    style={{padding:"7px 9px",fontSize:12}}/>
                  <input defaultValue={cat.category}
                    onBlur={e=>setItemCategory(catIdx,itemIdx,e.target.value)}
                    onKeyDown={e=>{if(e.key==="Enter") e.currentTarget.blur();}}
                    style={{padding:"7px 9px",fontSize:12}}/>
                  <input type="number" min="0" value={item.qty || 0}
                    onChange={e=>setItemField(catIdx,itemIdx,"qty",e.target.value)}
                    style={{padding:"7px 9px",fontSize:12,textAlign:"center"}}/>
                  <button onClick={()=>setItemVisible(catIdx,itemIdx,item.visible===false)}
                    style={{...css.btn(item.visible===false?"green":"ghost"),padding:"8px 10px",fontSize:9}}>
                    {item.visible===false?"Restore":"Hide"}
                  </button>
                </div>
              )))}
            </div>
          </div>
        )}
      </div>

      {/* Report output */}
      {report && (
        <div style={{...css.card,marginTop:8}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
            <span style={{fontSize:9,letterSpacing:"0.35em",textTransform:"uppercase",color:"var(--muted)"}}>
              End of Day Report
            </span>
            <button onClick={copyReport}
              style={{...css.btn(copied?"ghost":"primary"),padding:"8px 16px",fontSize:9}}>
              {copied?"Copied ✓":"Copy Report"}
            </button>
          </div>
          <pre style={{fontSize:13,lineHeight:1.9,color:"var(--white)",
                       fontFamily:"'Montserrat',sans-serif",whiteSpace:"pre-wrap",
                       background:"var(--dark)",border:"1px solid var(--border)",
                       borderRadius:2,padding:16}}>
            {report}
          </pre>
        </div>
      )}
    </div>
  );
}

ReactDOM.render(<App/>, document.getElementById("root"));
</script>
</body>
</html>
