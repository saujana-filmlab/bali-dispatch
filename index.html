<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

const LEGACY_API = "https://script.google.com/macros/s/AKfycbyCCkm0VIH6jsuj6T68KktBiHgE3IKnDQEOgEogRExKxmQ4WHXaW9wK4C9gZ2hhlfk/exec";
const WORKER_API = window.location.hostname === "127.0.0.1"
  ? "http://127.0.0.1:8799"
  : "https://bali-dispatch-api.saujanalab-bali.workers.dev";
const API_MODE_PARAM = new URLSearchParams(window.location.search).get("api");
const API_MODE = API_MODE_PARAM === "legacy" ? "legacy" : "supabase";
const API = API_MODE === "supabase" ? WORKER_API : LEGACY_API;
const BASE_URL = "https://bali-scans.saujanalab.com";
const AUTH_SESSION_KEY = "saujana-auth";
const ADMIN_KEY_SESSION_KEY = "saujana-contact-sheets-admin-key";
const DATA_CACHE_KEY = "saujana-dispatch-cache-v1";
const STOCK_CACHE_KEY = "saujana-stock-cache-v1";
const STOCK_HISTORY_CACHE_KEY = "saujana-stock-history-cache-v1";
const API_TIMEOUTS = {
  default: 20000,
  getInitialData: 12000,
  getCustomers: 12000,
  getOrders: 12000,
  getDeliveryForEdit: 12000,
  listDriveScans: 60000,
  correctDelivery: 45000,
  getOrderDeliveryLink: 12000,
  saveOrderDeliveryLink: 12000,
  getStock: 12000,
  getStockHistory: 12000,
  verifyContactSheetAdmin: 15000,
  addCustomer: 25000,
  updateCustomer: 25000,
  deleteCustomer: 25000,
  addOrder: 35000,
  createFolder: 45000,
  prepareContactSheetPublish: 70000,
  beginContactSheetUpload: 60000,
  createContactSheetUploadTicket: 60000,
  completeContactSheetUpload: 60000,
  cancelContactSheetUpload: 25000,
  saveStock: 35000,
  finalizeStock: 45000,
  recordStockHistory: 35000,
  exportData: 45000
};
const API_RETRY_DELAYS = [600, 1600, 3600];
const API_RETRY_ACTIONS = new Set([
  "getInitialData",
  "getCustomers",
  "getOrders",
  "getOrderDeliveryLink",
  "getOrderByNumber",
  "getStock",
  "getStockHistory",
  "verifyContactSheetAdmin",
  "addOrder",
  "createFolder",
  "prepareContactSheetPublish",
  "beginContactSheetUpload",
  "createContactSheetUploadTicket",
  "createContactSheetUploadTickets",
  "completeContactSheetUpload",
  "cancelContactSheetUpload",
  "saveStock",
  "finalizeStock",
  "recordStockHistory",
  "exportData"
]);
const WORKER_ACTIONS = new Set([
  "browseDriveFolder",
  "browseDriveThumbnail",
  "getSpoolSoldCounts",
  "workshopUploadRoll",
  "workshopUploadSession",
  "listDriveScans",
  "getDeliveryForEdit",
  "correctDelivery",
  "getRollCallReport",
  "getRollCall",
  "rollCallCommand",
  "getRollCallCard",
  "dispatchHealthcheck",
  "healthcheck",
  "getInitialData",
  "getCustomers",
  "addCustomer",
  "updateCustomer",
  "deleteCustomer",
  "getOrders",
  "getOrderDeliveryLink",
  "saveOrderDeliveryLink",
  "getOrder",
  "getOrderByNumber",
  "addOrder",
  "updateCollectNegatives",
  "verifyContactSheetAdmin",
  "prepareContactSheetPublish",
  "beginContactSheetUpload",
  "createContactSheetUploadTicket",
  "createContactSheetUploadTickets",
  "completeContactSheetUpload",
  "cancelContactSheetUpload",
  "getStock",
  "saveStock",
  "finalizeStock",
  "getStockHistory",
  "recordStockHistory",
  "exportData"
]);

function apiEndpointForAction(action) {
  if (action === "createFolder" || (API_MODE === "supabase" && WORKER_ACTIONS.has(action))) return WORKER_API;
  return LEGACY_API;
}

async function readDriveScan(file,{signal}={}) {
  const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),120000),abort=()=>controller.abort();
  if(signal?.aborted)controller.abort();else signal?.addEventListener('abort',abort,{once:true});
  try{
    const url=new URL(WORKER_API);url.searchParams.set('action','getDriveScan');
    const response=await fetch(url,{method:'POST',cache:'no-store',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({adminKey:getContactSheetAdminKey(),ticket:file.ticket}),signal:controller.signal});
    const type=response.headers.get('Content-Type')||'';
    if(!response.ok||type.includes('json')){const result=await response.json().catch(()=>({}));throw Error(result.error||'Could not load this scan from Drive.');}
    if(!/^image\/(jpeg|tiff)/i.test(type))throw Error('Drive returned an unsupported scan format.');
    const blob=await response.blob();if(blob.size!==file.size)throw Error('The scan download was incomplete. Please try again.');return blob;
  }finally{clearTimeout(timer);signal?.removeEventListener('abort',abort);}
}

function apiTimeoutFor(action) {
  return API_TIMEOUTS[action] || API_TIMEOUTS.default;
}

function shouldRetryApiResult(action, result) {
  if (!API_RETRY_ACTIONS.has(action) || !result) return false;
  if (result.retryable === true) return true;
  const status = Number(result.httpStatus || result.status || 0);
  return status === 404 || status === 429 || status >= 500;
}

function apiRetryDelay(attempt) {
  return new Promise(resolve => setTimeout(resolve, API_RETRY_DELAYS[Math.min(attempt, API_RETRY_DELAYS.length - 1)]));
}

function requireApiSuccess(result, fallbackMessage) {
  if (!result || result.error || result.success === false) {
    throw new Error(result?.error || fallbackMessage);
  }
  return result;
}

function readDispatchCache() {
  try {
    const cached = JSON.parse(localStorage.getItem(DATA_CACHE_KEY) || "null");
    return cached && Array.isArray(cached.customers) && Array.isArray(cached.orders)
      ? cached
      : null;
  } catch(e) {
    return null;
  }
}

function writeDispatchCache(customers, orders) {
  try {
    localStorage.setItem(DATA_CACHE_KEY, JSON.stringify({
      customers,
      orders,
      savedAt: Date.now()
    }));
  } catch(e) {}
}

function readStockCache() {
  try {
    const cached = JSON.parse(localStorage.getItem(STOCK_CACHE_KEY) || "null");
    return cached && Array.isArray(cached.stock) ? cached : null;
  } catch(e) {
    return null;
  }
}

function writeStockCache(stock) {
  try {
    localStorage.setItem(STOCK_CACHE_KEY, JSON.stringify({

    }));

function readLocalStockHistory() {
  try {
    const history = JSON.parse(localStorage.getItem(STOCK_HISTORY_CACHE_KEY) || "[]");
    return Array.isArray(history) ? history : [];
  } catch(e) {
    return [];
  }
}

function writeLocalStockHistory(history) {
  try {
    localStorage.setItem(STOCK_HISTORY_CACHE_KEY, JSON.stringify((history || []).slice(0, 30)));
  } catch(e) {}
}

async function apiCall(action, data=null, {signal,retry=true}={}) {
  try {
    if (!API) {
      return {
        success: true,
        id: `beta-${action}-${Date.now()}`,
        ...(data || {})
      };
    }
    const endpoint = apiEndpointForAction(action);
    const url = `${endpoint}?action=${encodeURIComponent(action)}&_=${Date.now()}`;
    const maxAttempts = retry&&API_RETRY_ACTIONS.has(action) ? API_RETRY_DELAYS.length + 1 : 1;
    const fetchWithTimeout = async (endpoint, options={}) => {
      const controller = new AbortController();
      const timeoutMs = apiTimeoutFor(action);
      const timer = setTimeout(() => controller.abort(), timeoutMs);
      try {
        return await fetch(endpoint, {...options, signal:signal?AbortSignal.any([signal,controller.signal]):controller.signal});
      } finally {
        clearTimeout(timer);
      }
    };
    const readJson = async response => {
      const text = await response.text();
      try {
        const parsed = JSON.parse(text);
        return response.ok ? parsed : {
          ...parsed,
          httpStatus: response.status,
          retryable: response.status === 404 || response.status === 429 || response.status >= 500
        };
      } catch (err) {
        return {
          error: `${endpoint === WORKER_API ? "Dispatch Worker" : "Google Sheets"} returned ${response.status || "a non-JSON response"} while running ${action}`,
          detail: text.slice(0, 180),
          httpStatus: response.status,
          retryable: response.status === 404 || response.status === 429 || response.status >= 500
        };
      }
    };

    const postJson = async body => {
      const response = await fetchWithTimeout(url, {
        method: "POST",
        redirect: "follow",
        cache: "no-store",
        headers: {
          "Content-Type": "text/plain;charset=utf-8"
        },
        body
      });
      return await readJson(response);
    };

    const runOnce = async () => {
      if(endpoint===WORKER_API)return await postJson(JSON.stringify({adminKey:getContactSheetAdminKey(),...(data||{})}));
      if (data) return await postJson(JSON.stringify(data));

      try {
        const response = await fetchWithTimeout(url, {
          method: "GET",
          redirect: "follow",
          cache: "no-store"
        });
        const result = await readJson(response);
        if (!result?.error) return result;
      } catch (getErr) {
        console.warn("GET API failed, retrying as POST:", getErr);
      }

      return await postJson("{}");
    };

    let lastResult = null;
    let lastError = null;
    for (let attempt = 0; attempt < maxAttempts; attempt += 1) {
      try {
        const result = await runOnce();
        if (attempt < maxAttempts - 1 && shouldRetryApiResult(action, result)) {
          lastResult = result;
          console.warn(`Retrying ${action} after transient response`, result);
          await apiRetryDelay(attempt);
          continue;
        }
        return result;
      } catch (err) {
        lastError = err;
        if (attempt < maxAttempts - 1 && API_RETRY_ACTIONS.has(action) &&
            (err?.name === "AbortError" || err instanceof TypeError)) {
          console.warn(`Retrying ${action} after request failure`, err);
          await apiRetryDelay(attempt);
          continue;
        }
        throw err;
      }
    }

    if (lastResult) return lastResult;
    throw lastError || new Error(`${action} could not finish`);
  } catch(e) { 
    if (e?.name === "AbortError") {
      return {error: `${action} took too long to finish. Please try again in a moment.`};
    }
    return {error: e?.message || e.toString()}; 
  }
}

function getContactSheetAdminKey() {
  return sessionStorage.getItem(ADMIN_KEY_SESSION_KEY) || "";
}

function normalizeScanStyle(value) {
  return String(value || "classic").trim().toLowerCase().replace(/\s+/g,"-");
}

function normalizeFrameFormat(value) {
  return String(value || "full").toLowerCase() === "half" ? "half-frame" : "full-frame";
}

function validateContactSheetsForPublish(sheets) {
  (sheets || []).forEach((sheet, index) => {
    const label = sheet.filmName || `roll ${index + 1}`;
    if (!(sheet.deliveryBlob instanceof Blob)) {
      throw new Error(`Contact sheet missing delivery upload for ${label}. Rebuild that roll and try again.`);
    }
    if (!(sheet.storyBlob instanceof Blob)) {
      throw new Error(`Contact sheet missing story upload for ${label}. Rebuild that roll and try again.`);
    }
  });
}

async function createContactSheetTicketMap({orderNumber, uploadNonce, sheets}) {
  const requests = [];
  (sheets || []).forEach(sheet => {
    requests.push({rollIndex:sheet.rollIndex, variant:"delivery"});
    requests.push({rollIndex:sheet.rollIndex, variant:"story"});
  });
  if (!requests.length) return {};

  const result = await apiCall("createContactSheetUploadTickets", {orderNumber, uploadNonce, requests});
  if (!result?.error && Array.isArray(result?.tickets)) {
    return result.tickets.reduce((map, ticket) => {
      map[`${ticket.rollIndex}:${ticket.variant}`] = ticket;
      return map;
    }, {});
  }

  const fallbackAllowed = /unknown action/i.test(String(result?.error || "")) || result?.httpStatus === 404;
  if (!fallbackAllowed) throw new Error(result?.error || "Could not prepare contact-sheet upload tickets");

  const tickets = {};
  for (const request of requests) {
    const ticket = await apiCall("createContactSheetUploadTicket", {
      orderNumber,
      uploadNonce,
      rollIndex:request.rollIndex,
      variant:request.variant
    });
    if (!ticket?.uploadUrl || !ticket?.fileUrl) {
      throw new Error(ticket?.error || `Could not prepare the ${request.variant} upload`);
    }
    tickets[`${request.rollIndex}:${request.variant}`] = {...ticket, ...request};
  }
  return tickets;
}

async function prepareContactSheetPublish({orderPayload, sheets}) {
  const requests = [];
  (sheets || []).forEach(sheet => {
    requests.push({rollIndex:sheet.rollIndex, variant:"delivery"});
    requests.push({rollIndex:sheet.rollIndex, variant:"story"});
  });

  const prepared = await apiCall("prepareContactSheetPublish", {
    ...orderPayload,
    adminKey:getContactSheetAdminKey(),
    requests
  });

  if (!prepared?.error && prepared?.uploadNonce && Array.isArray(prepared?.tickets)) {
    const ticketMap = prepared.tickets.reduce((map, ticket) => {
      map[`${ticket.rollIndex}:${ticket.variant}`] = ticket;
      return map;
    }, {});
    return {
      saved: prepared.order || prepared.saved || prepared,
      uploadNonce: prepared.uploadNonce,
      ticketMap
    };
  }

  const fallbackAllowed = /unknown action/i.test(String(prepared?.error || ""));
  if (!fallbackAllowed) throw new Error(prepared?.error || "Could not prepare contact-sheet publishing");

  const saved = await apiCall("addOrder", orderPayload);
  if (!saved || saved.error) throw new Error(saved?.error || "Could not save the order");

  const uploadSession = await apiCall("beginContactSheetUpload", {
    orderNumber:orderPayload.orderNumberText || orderPayload.orderNumber,
    adminKey:getContactSheetAdminKey()
  });
  if (!uploadSession?.uploadNonce) {
    throw new Error(uploadSession?.error || "Could not start the contact-sheet upload");
  }

  return {
    saved,
    uploadNonce: uploadSession.uploadNonce,
    ticketMap: await createContactSheetTicketMap({
      orderNumber:orderPayload.orderNumberText || orderPayload.orderNumber,
      uploadNonce:uploadSession.uploadNonce,
      sheets
    })
  };
}

async function uploadContactSheetVariant({orderNumber,uploadNonce,sheet,variant,ticket}) {
  const blob = variant === "story" ? sheet.storyBlob : sheet.deliveryBlob;
  if (!(blob instanceof Blob)) throw new Error(`Missing ${variant} JPEG for ${sheet.filmName}`);

  if (API_MODE === "supabase") {
    const params = new URLSearchParams({
      action:"uploadContactSheetFile",
      orderNumber,
      uploadNonce,
      rollIndex:String(sheet.rollIndex),
      variant,
      _:String(Date.now())
    });
    let response;
    let lastError = null;
    for (let attempt=0; attempt<API_RETRY_DELAYS.length+1; attempt+=1) {
      try {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), apiTimeoutFor("completeContactSheetUpload"));
        try {
          response = await fetch(`${WORKER_API}?${params.toString()}`, {
            method:"POST",
            cache:"no-store",
            headers:{"Content-Type":"image/jpeg"},
            body:blob,
            signal:controller.signal
          });
        } finally {
          clearTimeout(timer);
        }
        if (response.ok || !(response.status === 429 || response.status >= 500)) break;
      } catch(error) {
        lastError = error;
      }
      if (attempt < API_RETRY_DELAYS.length) await apiRetryDelay(attempt);
    }
    if (!response) {
      throw new Error(lastError?.message || "Could not reach contact-sheet storage");
    }
    const result = await response.json().catch(() => ({}));
    if (!response.ok || result?.error || !result?.fileUrl) {
      throw new Error(result?.error || `Upload failed (${response.status})`);
    }
    return result.fileUrl;
  }

  const uploadTicket = ticket || await apiCall("createContactSheetUploadTicket", {
    orderNumber,
    uploadNonce,
    rollIndex:sheet.rollIndex,
    variant
  });
  if (!uploadTicket?.uploadUrl || !uploadTicket?.fileUrl) {
    throw new Error(uploadTicket?.error || `Could not prepare the ${variant} upload`);
  }

  let response;
  let lastError = null;
  for (let attempt=0; attempt<API_RETRY_DELAYS.length+1; attempt+=1) {
    try {
      response = await fetch(uploadTicket.uploadUrl, {
        method:"PUT",
        headers:{"Content-Type":"image/jpeg"},
        body:blob
      });
      if (response.ok || !(response.status === 429 || response.status >= 500)) break;
    } catch(error) {
      lastError = error;
    }
    if (attempt < API_RETRY_DELAYS.length) await apiRetryDelay(attempt);
  }
  if (!response) {
    throw new Error(lastError?.message || "Could not reach contact-sheet storage. Open Darkroom Dispatch from its approved web address and try again.");
  }
  if (!response.ok) {
    let message = `Upload failed (${response.status})`;
    try {
      const result = await response.json();
      if (result?.error) message = result.error;
    } catch(e) {}
    throw new Error(message);
  }
  return uploadTicket.fileUrl;
}

const fmtDate = ts => ts ? new Date(ts).toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"}) : "-";
const fmtDT   = ts => {
  if (!ts) return "-";
  const d = new Date(ts);
  return d.toLocaleDateString("en-GB",{day:"2-digit",month:"short"}) + " · " +
         d.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"});
};
const cleanOrderNumber = value => String(value || "").trim().toUpperCase();
const ORDER_NUMBER_CACHE_KEY = "saujana-order-number-cache-v1";
const DUPLICATE_ORDER_TITLE = "You sure about that number? 👀";
const DUPLICATE_ORDER_MESSAGE = "This order number already belongs to someone else. Please double-check it before continuing.";
const DUPLICATE_ORDER_SUFFIX_HELP = "If this is the B&W or ECN-2 part of the same order, add -BW or -ECN to the end of that order number.";

function readOrderNumberCache() {
  try {
    return JSON.parse(localStorage.getItem(ORDER_NUMBER_CACHE_KEY) || "{}") || {};
  } catch(e) {
    return {};
  }
}

function rememberOrderNumber(id, orderNumber) {
  if (!id || !orderNumber) return;
  try {
    const cache = readOrderNumberCache();
    cache[id] = cleanOrderNumber(orderNumber);
    localStorage.setItem(ORDER_NUMBER_CACHE_KEY, JSON.stringify(cache));
  } catch(e) {}
}

function restoreOrderNumbers(orders) {
  const cache = readOrderNumberCache();
  return (orders || []).map(order => ({
    ...order,
    orderNumber: cache[order.id] || cleanOrderNumber(order.orderNumber)
  }));
}

const deliveryUrl = o => {
  if (!o || typeof o !== 'object') return BASE_URL;
  const orderNum = (o.orderNumber || "").toString();
  const name     = (o.deliveryName || o.deliveryDisplayName || o.customerName || "Customer").toString();
  const film     = (o.deliveryFilm || o.film || "").toString();
  const link     = (o.driveLink || "").toString();
  const sheetMode = Array.isArray(o.contactSheets) ? (o.contactSheets.length ? "1" : "0") : "";
  const deliveryTheme = normalizeDeliveryTheme(o.deliveryTheme);
  const deliveryDate = String(o.deliveryDate || baliDeliveryDate());
  // Notes excluded from URL — fetched from Sheets by delivery page
  const collectionChoice = SaujanaNegativeCollection.normalize(o.collectNegatives);
  return `${BASE_URL}/?theme=bali&negative=${encodeURIComponent(deliveryTheme)}&date=${encodeURIComponent(deliveryDate)}&order=${encodeURIComponent(orderNum)}&name=${encodeURIComponent(name)}&film=${encodeURIComponent(film)}&link=${encodeURIComponent(link)}${sheetMode ? `&sheets=${sheetMode}` : ""}${collectionChoice ? `&collectNegatives=${collectionChoice}` : ""}`;
};

async function staffDeliveryUrl(order,onDetails) {
  const response = await apiCall("getOrderDeliveryLink", {orderNumber:order.orderNumber});
  if (!response || response.error) throw new Error(response?.error || "Could not load this delivery link");
  onDetails?.(response);
  const url = new URL(response.deliveryUrl || deliveryUrl(order));
  const fragment = new URLSearchParams(url.hash.slice(1));
  if (response.rollCallToken) fragment.set("rollCall", response.rollCallToken);
  else fragment.delete("rollCall");
  url.hash = fragment.toString();
  return url.href;
}

function openStaffDelivery(order, onError) {
  const tab = window.open("about:blank", "_blank");
  if (!tab) return onError("Allow pop-ups to open this delivery page.");
  tab.opener = null;
  staffDeliveryUrl(order).then(url => tab.location.replace(url)).catch(error => {
    tab.close();
    onError(error.message || "Could not open this delivery page.");
  });
}

const DELIVERY_THEME_OPTIONS = [
  {value:"colour", label:"Colour Negative", accent:"#ff6425", paper:"#f3c3a2", surface:"#180b06"},
  {value:"bw", label:"Black & White", accent:"#eeeae2", paper:"#f3f1eb", surface:"#111111"},
  {value:"classic", label:"Classic", accent:"#c9a15c", paper:"#ece7db", surface:"#111315"}
];

function normalizeDeliveryTheme(value) {
  const normalized = String(value || "").trim().toLowerCase();
  return normalized === "bw" || normalized === "classic" ? normalized : "colour";
}

function baliDeliveryDate(value = new Date()) {
  const parts = new Intl.DateTimeFormat("en-CA", {
    timeZone:"Asia/Makassar",
    year:"numeric",
    month:"2-digit",
    day:"2-digit"
  }).formatToParts(value);
  const fields = Object.fromEntries(parts.map(part=>[part.type,part.value]));
  return `${fields.year}-${fields.month}-${fields.day}`;
}

function compactRollDetails(values) {
  const rolls = (values || []).map(value=>String(value || "").trim()).filter(Boolean);
  if (!rolls.length) return "";

  const groups = [];
  rolls.forEach(name => {
    const existing = groups.find(group=>group.name.toLocaleLowerCase()===name.toLocaleLowerCase());
    if (existing) existing.count += 1;
    else groups.push({name,count:1});
  });

  if (groups.length === 1 && groups[0].count > 1) {
    return `${groups[0].name} · ${groups[0].count} rolls`;
  }
  return groups.map(group=>group.count > 1 ? `${group.name} × ${group.count}` : group.name).join(" · ");
}

const escapePreviewHtml = value => String(value || "")
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");

const blobToDataUrl = blob => new Promise((resolve,reject) => {
  const reader = new FileReader();
  reader.onload = () => resolve(reader.result);
  reader.onerror = () => reject(new Error("Could not prepare the delivery preview."));
  reader.readAsDataURL(blob);
});

async function getShortLink(longUrl) {
  // is.gd supports CORS natively — no proxy needed, fast and reliable
  const services = [
    `https://is.gd/create.php?format=simple&url=${encodeURIComponent(longUrl)}`,
    `https://v.gd/create.php?format=simple&url=${encodeURIComponent(longUrl)}`,
  ];
  for (const endpoint of services) {
    try {
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 8000);
      const res = await fetch(endpoint, { signal: controller.signal });
      clearTimeout(timeout);
      const text = (await res.text()).trim();
      if (text.startsWith("http")) return text;
    } catch(e) {}
  }
  return longUrl; // fallback to full URL if both fail
}

function downloadCsvFile(file) {
  const blob = new Blob([file.content || ""], {type:file.mimeType || "text/csv;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = url;
  link.download = file.fileName || "saujana-export.csv";
  document.body.appendChild(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

  useEffect(() => {
    if (!open) return;
    const onKeyDown = event => {
      if (event.key === "Escape") closeExport();
    };
    window.addEventListener("keydown", onKeyDown);
    return () => window.removeEventListener("keydown", onKeyDown);
  }, [open, exporting]);

  if (API_MODE !== "supabase") return null;

  async function runExport() {
    if (!pw.trim() || exporting) return;
    setExporting(true);
    setError("");
    setDone(false);

      const res = requireApiSuccess(
        await apiCall("exportData", {adminKey:pw}),
        "Could not export data"
      );
      const nextFiles = Array.isArray(res.files) ? res.files : [];
      if (!nextFiles.length) throw new Error("No export files were returned");
      setFiles(nextFiles);
      nextFiles.forEach((file, index) => {
        setTimeout(() => downloadCsvFile(file), index * 250);

        <div
          onMouseDown={event => {
            if (event.target === event.currentTarget) closeExport();
          }}
          style={{position:"fixed",inset:0,background:"rgba(0,0,0,.78)",zIndex:1000,
                  padding:20,overflowY:"auto"}}

                  ...css.btn("ghost"),
                  flex:"0 0 auto",
                  width:34,
                  height:34,
                  padding:0,

                  lineHeight:1,
                  display:"inline-flex",
                  alignItems:"center",
                  justifyContent:"center"
                }}
                aria-label="Close export dialog"

                ×

            </div>

            <input

              onChange={e=>setPw(e.target.value)}

            {done && <div style={{fontSize:11,color:"var(--greenT)",lineHeight:1.5,marginBottom:10}}>Export ready. If your browser blocked multiple downloads, use the buttons below.</div>}

      }
      return [...previous.filter(item => item.rollKey !== sheet.rollKey), sheet]

    const api=async(action,payload)=>{

      if(!current())throw Error("This draft is no longer open.");

      return response;

        if(saved&&saved.id!==attempt.id)throw Error("That order number belongs to another order. Find the saved order before continuing.");
        if(saved&&(saved.deliveryRevision||saved.delivery))throw Error("This order changed after it was saved. Reopen it from Find past order.");
        attempt.saved=saved;

      if(!attempt.saved){
        attempt.createStarted=true;

      rememberOrderNumber(saved.id,orderNumber);
      if(SaujanaNegativeCollection.normalize(saved.collectNegatives)!==delivery.collectNegatives)throw Error("Dispatch did not save the negatives collection choice.");

      if(sheets.length&&!attempt.committed){
        if(attempt.commitStarted){
          const existing=await api("getOrderByNumber",{orderNumber});
          if(existing?.id!==saved.id)throw Error("The saved order could not be verified.");
          if(existing.deliveryRevision!==initialRevision){
            const ready=existing.contactSheets||[];
            const matches=ready.length===attempt.manifest.length&&attempt.manifest.every(sheet=>ready.some(item=>
              item.rollIndex===sheet.rollIndex&&item.deliveryUrl===sheet.deliveryUrl&&item.storyUrl===sheet.storyUrl));
            if(!matches||existing.deliveryRevision!==initialRevision+1)throw Error("This delivery changed on another device. Reopen the saved order before continuing.");
            attempt.committed=existing;
          }
        }
        if(!attempt.committed){
          if(!attempt.nonce){
            stage("Preparing contact-sheet upload");
            const session=await api("beginContactSheetUpload",{orderNumber,publishOrderId:saved.id,expectedDeliveryRevision:initialRevision});
            if(!session?.uploadNonce)throw Error("Could not start the contact-sheet upload.");

          for(const [index,sheet] of sheets.entries()){
            const next={rollIndex:sheet.rollIndex,filmName:sheet.filmName,frameCount:sheet.frameCount,
              scanStyle:normalizeScanStyle(sheet.scanStyle),format:normalizeFrameFormat(sheet.format)};
            const variants=[["delivery","deliveryUrl"],["story","storyUrl"]];
            if(variants.some(([variant])=>!attempt.variants.has(sheet.rollIndex+":"+variant)))stage("Uploading contact sheets / Roll "+(index+1)+" of "+sheets.length);
            const uploads=await Promise.allSettled(variants.map(async ([variant,field])=>{

              if(!attempt.variants.has(key)){
                const url=await uploadContactSheetVariant({orderNumber,uploadNonce:attempt.nonce,sheet,variant});
                if(!current())return;
                attempt.variants.set(key,url);
              }
              next[field]=attempt.variants.get(key);
            }));
            if(!current())return;
            const failed=uploads.find(upload=>upload.status==="rejected");

      <div className="dispatch-main">

              <h1><img src={workshopDaylight?"/refresh/brand/workshop-light.png":"/refresh/brand/workshop.png"} alt="Rollo's Workshop"/></h1><p>ORDER {orderNo||"NOT SET"} / {contactSheetCustomerName||"NEW CUSTOMER"}</p>
            </div>

                : <picture>
                    <source media="(prefers-reduced-motion: reduce)" srcSet={workshopDaylight?"/refresh/brand/Rollo_On_Duty_Neon.svg#daylight-still":"/refresh/brand/Rollo_On_Duty_Neon.svg#still"}/>
                    <img className="sl-duty-sign" src={workshopDaylight?"/refresh/brand/Rollo_On_Duty_Neon.svg#daylight":"/refresh/brand/Rollo_On_Duty_Neon.svg"} width="124" height="34" alt="Rollo is on duty"/>
                  </picture>}
            </div>
          </header>
          {!loadedPastOrder&&<WorkshopFilmStrip folderReady={Boolean(driveLink)} scansReady={refreshWorkspace.some(roll=>roll.frames)}
            skipSheets={skipContactSheets} sheetsReady={everyRollResolved} published={Boolean(result)}/>}
          {!loadedPastOrder&&<div className="sl-studio-body">
            <section id="refresh-folder" className={"sl-folder sl-step-summary "+(driveLink?"complete":"")} inert={generating||publishRetry?"":undefined}>
              <span className="sl-step-icon">{driveLink?<RefreshIcon name="Check" size={14}/>:"1"}</span><h2>Drive folder</h2>
              {realDriveTrial&&<WorkshopDriveConnection trial={trial}/>}
              {driveFolderId&&!editingDrive&&<WorkshopDriveLink key={driveLink} url={driveLink}/>}
              {driveLink&&!editingDrive&&!result&&!loadedPastOrder&&<button type="button" className="sl-secondary" disabled={trial.busy||generating} onClick={()=>editDriveLink(driveLink)}>Change link</button>}
              {!result&&!loadedPastOrder&&!editingDrive&&<>
                {realDriveTrial&&driveFolderId&&!trial.batch&&trial.connection&&<button type="button" className="sl-secondary" disabled={trial.busy||generating} onClick={async()=>{if(await trial.attach(driveFolderId,driveLink))setIntakeMode("drive-trial");}}>Use for uploads</button>}
                <div className="sl-folder-options">
                {!driveLink&&<><button type="button" className="sl-secondary sl-folder-paste" disabled={trial.busy||creatingFolder} onClick={pasteDriveLink}><RefreshIcon name="Clipboard" size={14}/>Paste Drive link</button><span className="sl-folder-or">OR</span></>}

                  {creatingFolder?<span className="sl-folder-spin"><RefreshIcon name="LoaderCircle" size={14}/></span>:<RefreshIcon name="FolderPlus" size={14}/>}
                  {creatingFolder?"Creating folder...":recoveryDemo?(driveLink?"Create new sample folder":"Create sample folder"):driveLink?"Create new folder":"Create Drive folder"}
                </button>}
                </div>
              </>}
              {!result&&editingDrive&&<form className="sl-folder-editor" onSubmit={event=>{event.preventDefault();confirmDriveLink();}}>
                <input autoFocus aria-label="Google Drive link" value={driveDraft} onChange={event=>editDriveLink(event.target.value)} placeholder="Paste a Google Drive folder link"/>
                <button className="sl-secondary" type="submit" disabled={trial.busy}>Use this folder</button>
                <button className="sl-text-button" type="button" onClick={closeDriveEditor}>Cancel</button>
                {driveLinkError&&<p role="alert">{driveLinkError}</p>}

              {realDriveTrial&&trial.folderStatus&&<p role="status" className="sl-intake-mode-note">{trial.folderStatus}</p>}
              {!realDriveTrial&&<p className="sl-folder-status" role="status">{creatingFolder?"Creating your Drive folder...":createdFolderLink&&createdFolderLink===driveLink?<><RefreshIcon name="Check" size={14}/>Drive folder ready</>:null}</p>}
            </section>
<div className="cs-studio-container" inert={result||generating||publishRetry?"":undefined}>          <ContactSheetGenerator
            key={workspaceGeneration}
            localTrialIntake={true}
            skipSheetPreparation={skipContactSheets}
            uploadTrialRolls={!loadedPastOrder&&intakeMode!=="sheets"?groups=>{if(!driveFolderId||!orderNo.trim())throw Error("Set the order number and Drive folder before dropping scans.");directTransfers.enqueue(orderNo.trim().toUpperCase()+":"+driveFolderId,driveFolderId,groups,orderNo);}:null}
            intakeModeControl={intakeModeControl}
            driveTransferPanel={result||generating||publishRetry?null:transferPanel}
            driveFolderPanel={driveFolderPanel}
            uploadJob={currentUpload?.inFlight?currentUpload:null}
            recoverySample={Boolean(recoveryDemo&&orderNo.startsWith("DEMO-")&&trial.folderId&&intakeMode==="drive-trial"&&!directTransfers.interrupted.some(job=>job.folder===trial.folderId))}

            onSheetInvalidated={handleContactSheetInvalidated}
            driveLink={driveLink}
            driveApi={apiCall}
            readDriveFile={readDriveScan}
            orderNumber={cleanOrderNumber(orderNo)}
            customerName={contactSheetCustomerName}
            rolls={rolls}
            excludedRolls={skipContactSheets ? rolls.map((_,index)=>index) : excludedRolls}
            onRollInclusionChange={handleRollInclusionChange}
            onSheetsChange={handleContactSheetReady}
          /></div>
            <section id="refresh-publish" className="sl-publish" data-state={result?"published":generating?"publishing":canGen?"ready":"pending"} aria-busy={generating}>
              {result?<div className="sl-publish-handoff sl-delivery-workspace">
                <header><h2><span className="sl-step-icon"><RefreshIcon name="Check" size={14}/></span>Publish &amp; delivery</h2><span className="sl-publish-status" role="status">Published{publishDemo?" / Local demo":""}</span></header>
                {collectionNotice}
                {deliverySharing}
                {deliveryPreview}
              </div>:<>
              <div className="sl-publish-main"><h2><span className="sl-step-icon"><RefreshIcon name={canGen?"Check":"LockKeyhole"} size={14}/></span>Publish &amp; delivery</h2>
                {publishDemo&&<span className="sl-publish-demo">Local demo</span>}
                <div className="sl-checklist">
                  <span className={driveLink?"done":""}><RefreshIcon name={driveLink?"Check":"CircleDashed"} size={13}/>Drive folder</span>

                    <span className={refreshWorkspace.some(roll=>roll.frames)?"done":""}><RefreshIcon name={refreshWorkspace.some(roll=>roll.frames)?"Check":"CircleDashed"} size={13}/>Scans loaded</span>
                    {namedRolls.map((roll,index)=><span key={index} className={contactSheets.some(sheet=>sheet.rollIndex===index)||excludedRolls.includes(index)?"done":""}><RefreshIcon name={contactSheets.some(sheet=>sheet.rollIndex===index)||excludedRolls.includes(index)?"Check":"CircleDashed"} size={13}/>Roll {String(index+1).padStart(2,"0")} {excludedRolls.includes(index)?refreshWorkspace[index]?.blank?"blank":"skipped":"finalized"}</span>)}
                  </>}

                {publishRetry?<p className="sl-publish-error" role="alert">{publishRetry}</p>:<p role={generating||trial.blankPending?"status":undefined}>{generating?publishStage:trial.blankPending?"Creating blank roll folder...":publishHint}</p>}

              <img src="/refresh/neggie.png" alt="" width="130" height="130"/>

        </div>

        {result&&loadedPastOrder&&<div className="sl-delivery-workspace saved" id="refresh-publish">
            <section className="sl-delivery-recap" aria-label="Delivery recap">

}

function Registry({customers, orders, onAdd, onUpdate, onDelete, onNewOrderFor, onLoadDelivery, orderStatus}) {
  const [search, setSearch]       = useState("");
  const [sortBy, setSortBy]       = useState("name");
  const [selected, setSelected]   = useState(null);
  const [customerTab, setCustomerTab] = useState("orders");
  useEffect(()=>{if(selected){const current=customers.find(customer=>customer.id===selected.id);if(current&&current!==selected)setSelected(current);}},[customers]);
  useEffect(()=>{setCustomerTab("orders");},[selected?.id]);
  function switchCustomerTab(event) {
    const keys=["ArrowLeft","ArrowRight","Home","End"];
    if(!keys.includes(event.key))return;
    event.preventDefault();
    const next=event.key==="Home"?"orders":event.key==="End"?"roll-call":customerTab==="orders"?"roll-call":"orders";
    setCustomerTab(next);
    event.currentTarget.parentElement.querySelector(next==="orders"?"#registry-orders-tab":"#registry-roll-call-tab").focus();
  }
  const [editing, setEditing]     = useState(null);
  const [form, setForm]           = useState({name:"",email:"",phone:""});
  const [saving, setSaving]       = useState(false);
  const [toast, setToast]         = useState("");
  const [page, setPage]           = useState(1);
  const pageSize = 20;

  const showToast = msg => { setToast(msg); setTimeout(()=>setToast(""),2500); };

  const customerActivity=React.useMemo(()=>{
    const timestamp=value=>value?(new Date(value).getTime()||0):0;
    const activity=new Map(customers.map(customer=>[String(customer.id),{added:timestamp(customer.createdAt),order:timestamp(customer.lastOrderDate)}]));
    orders.forEach(order=>{const record=activity.get(String(order.customerId));if(record)record.order=Math.max(record.order,timestamp(order.createdAt));});
    return activity;
  },[customers,orders]);
  const recentActivity=customer=>{const activity=customerActivity.get(String(customer.id));return Math.max(activity?.added||0,activity?.order||0);};
const filtered = customers
  .filter(c => {
    const q = search.toLowerCase();

    return (
      String(c.name || "").toLowerCase().includes(q) ||
      String(c.email || "").toLowerCase().includes(q) ||
      String(c.phone || "").toLowerCase().includes(q)
    );
  })    .sort((a,b)=>
      sortBy==="orders"?(b.totalOrders||0)-(a.totalOrders||0):
      sortBy==="recent"?(recentActivity(b)-recentActivity(a)||a.name.localeCompare(b.name)):
      a.name.localeCompare(b.name)
    );
  const totalPages = Math.max(1, Math.ceil(filtered.length / pageSize));
  const currentPage = Math.min(page, totalPages);
  const pagedCustomers = filtered.slice((currentPage-1)*pageSize, currentPage*pageSize);

  const custOrders = selected
    ? orders.filter(o=>o.customerId===selected.id).sort((a,b)=>b.createdAt-a.createdAt)
    : [];
  const recentCustomers = [...customers]
    .sort((a,b)=>(b.createdAt||0)-(a.createdAt||0))
    .slice(0,8);

  async function save() {
    if (!form.name.trim()||!form.email.trim()) return;
    setSaving(true);
    if (editing==="new") {
      await onAdd(form);
      showToast("Customer added ✓");
    } else {
      await onUpdate({...editing,...form});
      showToast("Updated ✓");
    }
    setEditing(null); setSaving(false);
  }
async function updateCustomerInfo() {
  if (!selCust) return;

  const res = await apiCall("updateCustomer", {
    id: selCust.id,
    name: custInput.trim(),
    email: custEmail.trim(),
    phone: custPhone.trim()
  });

  if (res?.success) {
  setSelCust({
    ...selCust,
    name: custInput.trim(),
    email: custEmail.trim(),
    phone: custPhone.trim()
  });

  showToast("Customer updated ✓");
} else {
  showToast(res?.error || "Could not update customer");
}
}
  async function del(id) {
    if (!confirm("Remove this customer?")) return;
    try {
      await onDelete(id);
      if (selected?.id===id) setSelected(null);
      showToast("Removed ✓");
    } catch(e) {
      showToast(e.message || "Could not remove customer");
    }
  }

  return <section className="sl-registry">
    <Toast msg={toast}/>
    <header className="sl-page-heading"><div><span className="sl-eyebrow">Customer records</span><h1>Customer registry</h1><p>{customers.length} customers / {orders.length} orders</p></div><div className="sl-page-actions"><a className="sl-secondary" href="rollcall/"><RefreshIcon name="ContactRound"/>Roll Call Office<RefreshIcon name="ArrowUpRight" size={14}/></a><button className="sl-primary" onClick={()=>{setEditing("new");setForm({name:"",email:"",phone:""})}}><RefreshIcon name="UserPlus"/>Add customer</button></div></header>
    <div className="registry-workspace sl-registry-layout">
      <div className="sl-status-column">
      {orderStatus}
      <aside className="registry-list sl-directory">
        <div className="sl-directory-toolbar"><label className="sl-search"><RefreshIcon name="Search"/><input aria-label="Search customers" placeholder="Search name, email or phone..." value={search} onChange={e=>{setSearch(e.target.value);setPage(1)}}/>{search&&<button aria-label="Clear customer search" onClick={()=>{setSearch("");setPage(1)}}><RefreshIcon name="X" size={14}/></button>}</label><div className="sl-directory-order-group" role="group" aria-label="Sort customers">{[{value:"name",label:"A-Z"},{value:"orders",label:"Most Orders"},{value:"recent",label:"Recent"}].map(option=><button key={option.value} aria-pressed={sortBy===option.value} title={option.value==="recent"?"Newest registrations or order activity first":undefined} onClick={()=>{setSortBy(option.value);setPage(1)}}>{option.label}</button>)}</div><span className="sl-directory-result-count">{filtered.length} {filtered.length===1?"customer":"customers"}</span></div>
        <div className="sl-directory-rows" key={JSON.stringify([search,sortBy,currentPage])} role="region" aria-label="Customer results" tabIndex={0}>{pagedCustomers.length?pagedCustomers.map(customer=><button className={"sl-customer-row "+(selected?.id===customer.id?"selected":"")} key={customer.id} onClick={()=>setSelected(customer)} aria-pressed={selected?.id===customer.id}>
          <span className="sl-avatar">{(customer.name||"?").split(" ").filter(Boolean).slice(0,2).map(word=>word[0]).join("")}</span><span className="sl-customer-identity"><strong>{customer.name}</strong><small>{customer.email}</small>{customer.phone&&<small>{customer.phone}</small>}{sortBy==="recent"&&<span className="sl-customer-activity">{customerActivity.get(String(customer.id))?.added>0&&<span data-activity="added"><RefreshIcon name="UserPlus" size={11}/>Added {fmtDate(customerActivity.get(String(customer.id)).added)}</span>}{customerActivity.get(String(customer.id))?.order>0&&<span data-activity="order"><RefreshIcon name="Film" size={11}/>Last order {fmtDate(customerActivity.get(String(customer.id)).order)}</span>}</span>}</span><span className="sl-order-tally">{customer.totalOrders||0}<small>{customer.totalOrders===1?"order":"orders"}</small></span><RefreshIcon name="ChevronRight" size={14}/>
        </button>):<div className="sl-empty-state"><RefreshIcon name="SearchX" size={26}/><h3>{search?"No matching customers":"No customers yet"}</h3><p>{search?"Try another name, email, or phone number.":"New customers will appear here."}</p></div>}</div>
        {totalPages>1&&<div className="sl-pagination"><button className="sl-icon-button" aria-label="Previous customer page" disabled={currentPage===1} onClick={()=>setPage(page=>Math.max(1,page-1))}><RefreshIcon name="ChevronLeft"/></button><span>{currentPage} / {totalPages}</span><button className="sl-icon-button" aria-label="Next customer page" disabled={currentPage===totalPages} onClick={()=>setPage(page=>Math.min(totalPages,page+1))}><RefreshIcon name="ChevronRight"/></button></div>}
      </aside>
      </div>
      <div className="registry-detail sl-customer-dossier" role="region" aria-label="Customer details" tabIndex={0}>

function useWorkshopDriveTrial(enabled,setDriveLink,directTransfers) {
  const savedKey="dispatch-workshop-drive-trial";
  const [restored]=React.useState(()=>{
    if(!enabled)return null;
    try {
      const saved=sessionStorage.getItem(savedKey);
      return saved===null?null:JSON.parse(saved);
    } catch{return null;}
  });
  const batch=React.useRef(restored?.batch||null),requestVersion=React.useRef(0),folder=React.useRef(restored?.folder||null),pending=React.useRef(new Map());
  const createBatch=React.useRef(restored?.folder?null:restored?.batch||null);
  const [busy,setBusy]=React.useState(false);
  const [folderStatus,setFolderStatus]=React.useState(""),[scanStatus,setScanStatus]=React.useState("");
  const [folderGeneration,setFolderGeneration]=React.useState(0);
  const [blankPending,setBlankPending]=React.useState(0),[blankRevision,setBlankRevision]=React.useState(0);
  const [connection,setConnection]=React.useState(null),[connectionError,setConnectionError]=React.useState("");
  async function checkConnection(){
    try {const result=await fetch("/refresh/drive-trial/status").then(response=>response.json());setConnection(result.connected);}
    catch{setConnection(false);}
  }
  React.useEffect(()=>{
    if(!enabled)return;
    void checkConnection();
    window.addEventListener("focus",checkConnection);
    return()=>window.removeEventListener("focus",checkConnection);
  },[enabled]);
  async function connect(secret){
    setConnectionError("");
    try{
      const response=await fetch("/refresh/drive-trial/setup",{method:"POST",body:secret});
      const result=await response.json();
      if(!response.ok)throw Error(result.error||"Connection could not be verified.");
      setConnection(true);setFolderStatus("");
    }catch(error){setConnectionError(error.message);}
  }
  React.useEffect(()=>{
    if(!restored?.folder)return;
    sessionStorage.setItem(savedKey,JSON.stringify(restored));
    setDriveLink("https://drive.google.com/drive/folders/"+restored.folder);
  },[restored,setDriveLink]);
  function remember(){sessionStorage.setItem(savedKey,JSON.stringify({batch:batch.current,folder:folder.current}));}
  async function request(action,batchId,extra={},signal) {
    const response=await fetch("/refresh/drive-trial",{method:"POST",headers:{"X-Trial-Action":action,"X-Trial-Batch":batchId||"",...extra},signal});
    const result=await response.json();
    if(!response.ok)throw Error(result.error||"Drive did not confirm the change.");
    return result;
  }
  function readFolder(rootId,targetId,pageToken,signal){
    return request("browse",null,{"X-Trial-Folder":rootId,"X-Trial-Target":targetId,...(pageToken?{"X-Trial-Page":pageToken}:{})},signal);
  }
  function readThumbnail(rootId,targetId,fileId,signal){
    return request("thumbnail",null,{"X-Trial-Folder":rootId,"X-Trial-Target":targetId,"X-Trial-File":fileId},signal).then(result=>result.image);
  }
  const newBatch=()=>"trial-"+crypto.randomUUID().replace(/-/g,"").slice(0,16);
  function detach() {
    batch.current=null;folder.current=null;createBatch.current=null;
    setBlankPending(0);
    remember();
  }
  function view(link){
    ++requestVersion.current;
    detach();pending.current.clear();setScanStatus("");setBusy(false);setDriveLink(link);setFolderStatus("");
  }
  async function create(fresh=false) {
    if(busy)return;
    const version=++requestVersion.current;
    const batchId=createBatch.current||=newBatch();
    setBusy(true);setFolderStatus("Creating trial folder...");
    try {
      const {folderId}=await request("create",batchId);
      if(version!==requestVersion.current)return;
      detach();
      batch.current=batchId;folder.current=folderId;
      remember();
      setDriveLink("https://drive.google.com/drive/folders/"+folderId);
      if(fresh){pending.current.clear();setScanStatus("");setFolderGeneration(value=>value+1);}
      setFolderStatus(window.DISPATCH_RECOVERY_DEMO?"Sample folder created.":"Private trial folder created.");
      if(!fresh)sendPending();
      return true;
    } catch(error) {if(version===requestVersion.current)setFolderStatus(error.message);}
    finally {if(version===requestVersion.current)setBusy(false);}
  }
  async function attach(folderId,link) {
    if(busy)return;
    const version=++requestVersion.current;
    const batchId=newBatch();
    detach();
    setDriveLink(link);
    setBusy(true);setFolderStatus("Checking upload access...");
    try {
      await request("attach",batchId,{"X-Trial-Folder":folderId});
      if(version!==requestVersion.current)return;
      batch.current=batchId;folder.current=folderId;
      remember();
      setFolderStatus("Drive uploads enabled.");
      sendPending();
      return true;
    } catch(error) {
      if(version!==requestVersion.current)return;
      setFolderStatus(error.message+" You can still use the link for delivery and upload in Drive.");
    } finally {if(version===requestVersion.current)setBusy(false);}
  }
  function sendPending() {
    const queued=[...pending.current];
    pending.current.clear();
    if(queued.length>1){setScanStatus("The order number changed before uploads started. Reopen the correct order or upload those scans in Drive.");return;}
    const accepted=queued.every(([orderNo,groups])=>enqueueGroups([...groups.values()],orderNo));
    setScanStatus(accepted?"":"Not uploaded: this folder is already associated with a different order number.");
  }
  function enqueueGroups(groups,orderNo){
    const scans=groups.filter(group=>!group.blank),blanks=groups.filter(group=>group.blank);
    if(scans.length&&!directTransfers.enqueue(batch.current,folder.current,scans,orderNo))return false;
    if(blanks.length){
      const active=batch.current;
      setBlankPending(count=>count+blanks.length);
      for(const group of blanks)request("blank",active,{"X-Trial-Roll":"roll-"+workshopRollLabel(group.index)})
        .then(()=>{
          if(batch.current!==active)return;
          setBlankRevision(value=>value+1);
          if(group.files.length&&!directTransfers.enqueue(active,folder.current,[group],orderNo))setFolderStatus("Add the blank roll scans in Drive.");
        })
        .catch(()=>{if(batch.current===active)setFolderStatus("Add the blank roll folder in Drive.");})
        .finally(()=>{if(batch.current===active)setBlankPending(count=>Math.max(0,count-1));});
    }
    return true;
  }
  function upload(groups,orderNo) {
    const duplicate=groups.find(({files})=>new Set(files.map(file=>file.name)).size!==files.length);
    if(duplicate){setScanStatus("Roll "+(duplicate.index+1)+" has duplicate scan filenames. Rename those files before uploading to Drive. Contact sheets are still being prepared.");return;}
    if(!folder.current){
      const queued=pending.current.get(orderNo)||new Map();
      groups.forEach(group=>queued.set(group.index,group));
      pending.current.set(orderNo,queued);
      setScanStatus("Not uploaded to Drive. Create a folder or confirm a writable Drive link.");
      return;
    }
    const accepted=enqueueGroups(groups,orderNo);
    setScanStatus(accepted?"":"Not uploaded: this folder is already associated with a different order number. Choose the correct Drive folder.");
  }
  function reset() {
    ++requestVersion.current;
    detach();pending.current.clear();
    sessionStorage.setItem(savedKey,"null");
    setDriveLink("");setBusy(false);setFolderStatus("");setScanStatus("");
  }
  return {batch:batch.current,folderId:folder.current,busy,folderStatus,scanStatus,folderGeneration,blankPending,blankRevision,connection,connectionError,connect,create,attach,upload,reset,view,readFolder,readThumbnail};
}

function useDriveTransferPreview() {
  const [jobs,setJobs]=React.useState([]);
  const [now,setNow]=React.useState(0);
  const transfers=jobs.map(job=>{
    const total=job.rolls.reduce((sum,roll)=>sum+roll.frames,0);
    const sent=Math.min(total,Math.floor(total*Math.max(0,now-job.started)/10000));
    return {...job,total,sent,done:sent===total};
  });
  const active=transfers.some(job=>!job.done);
  React.useEffect(()=>{
    if(!active)return;
    const timer=setInterval(()=>setNow(performance.now()),100);
    return()=>clearInterval(timer);
  },[active]);
  function start(key,orderNo,rolls) {
    const started=performance.now();
    setNow(started);
    setJobs(previous=>[...previous.filter(job=>job.key!==key),{key,orderNo,rolls,started,minimized:false}]);
  }
  function minimize(key) {setJobs(previous=>previous.map(job=>job.key===key?{...job,minimized:true}:job));}
  function minimizeAll() {setJobs(previous=>previous.map(job=>({...job,minimized:true})));}
  function dismiss(key) {setJobs(previous=>previous.filter(job=>job.key!==key));}
  return {transfers,start,minimize,minimizeAll,dismiss};
}

const workshopThumbnailQueue=[];
let workshopActiveThumbnails=0;
function pumpWorkshopThumbnails(){
  while(workshopActiveThumbnails<2&&workshopThumbnailQueue.length){
    const next=workshopThumbnailQueue.shift();
    next.signal.removeEventListener("abort",next.cancel);
    if(next.signal.aborted){next.resolve(null);continue;}
    workshopActiveThumbnails++;
    Promise.resolve().then(next.load).then(next.resolve,next.reject).finally(()=>{
      workshopActiveThumbnails--;
      pumpWorkshopThumbnails();
    });
  }
}
function queueWorkshopThumbnail(load,signal){
  return new Promise((resolve,reject)=>{
    if(signal.aborted){resolve(null);return;}
    const task={load,signal,resolve,reject,cancel(){
      const index=workshopThumbnailQueue.indexOf(task);
      if(index!==-1)workshopThumbnailQueue.splice(index,1);
      resolve(null);
    }};
    signal.addEventListener("abort",task.cancel,{once:true});
    workshopThumbnailQueue.push(task);
    pumpWorkshopThumbnails();
  });
}
const workshopLocalThumbnails=new WeakMap();
async function makeWorkshopThumbnail(file,signal){
  if(workshopLocalThumbnails.has(file))return workshopLocalThumbnails.get(file);
  const source=/\.tiff?$/i.test(file.name)?await csgFileToPreparedBlob(file):file;
  if(signal.aborted)return null;
  const bitmap=await createImageBitmap(source,{resizeWidth:320,resizeQuality:"medium",imageOrientation:"from-image"});
  const canvas=document.createElement("canvas");
  try{
    if(signal.aborted)return null;
    const scale=Math.min(1,320/Math.max(bitmap.width,bitmap.height));
    canvas.width=Math.max(1,Math.round(bitmap.width*scale));
    canvas.height=Math.max(1,Math.round(bitmap.height*scale));
    canvas.getContext("2d").drawImage(bitmap,0,0,canvas.width,canvas.height);
    const thumb=await csgCanvasBlob(canvas,.76);
    workshopLocalThumbnails.set(file,thumb);
    return thumb;
  }finally{bitmap.close();canvas.width=canvas.height=0;}
}

function WorkshopFrame({entry,position,load}) {
  const ref=React.useRef(null);
  const [src,setSrc]=React.useState(entry.src||"");
  React.useEffect(()=>{
    if((!load&&!entry.file)||entry.flag||entry.src)return;
    let live=true,objectUrl="",observer;
    const controller=new AbortController();
    async function show(){
      try{
        const {signal}=controller;
        const result=await queueWorkshopThumbnail(()=>entry.file
          ?makeWorkshopThumbnail(entry.file,signal):load(entry.id,signal),signal);
        if(live&&result){
          if(result instanceof Blob){objectUrl=URL.createObjectURL(result);setSrc(objectUrl);}
          else setSrc(result);
        }
      }catch{}
    }
    if(window.IntersectionObserver){
      observer=new IntersectionObserver(entries=>{if(entries.some(item=>item.isIntersecting)){observer.disconnect();void show();}},{rootMargin:"64px"});
      observer.observe(ref.current);
    }else void show();
    return ()=>{live=false;controller.abort();observer?.disconnect();if(objectUrl)URL.revokeObjectURL(objectUrl);};
  },[entry.id,entry.file,entry.src,entry.flag,load]);
  return <li ref={ref} className="rb-frame" data-flag={Boolean(entry.flag)} style={{"--rb-step":Math.min(position,10)}}>
    <div className="rb-frame-image">{src?<img src={src} loading="lazy" decoding="async" alt="" onError={()=>setSrc("")}/>:<RefreshIcon name={entry.flag?"TriangleAlert":"Image"} size={22}/>}</div>
    <span title={entry.name}>{entry.name}</span>
    {entry.flag&&<small>{entry.flag}</small>}
  </li>;
}

function WorkshopFrameTicks({roll}){
  const ticks=roll.progress.ticks||[];
  const cols=Math.min(36,ticks.length);
  const states=Array.from({length:cols},(_,index)=>{
    const start=Math.floor(index*ticks.length/cols),end=Math.floor((index+1)*ticks.length/cols);
    const part=ticks.slice(start,end);
    return part.includes("error")?"error":part.every(state=>state==="done")?"done":
      part.some(state=>state==="sending"||state==="done")?"sending":"queued";
  });
  return <div className="rb-upload-track">
    <progress className="sl-sr-only" aria-label={"Upload progress for roll "+roll.number} value={roll.progress.done} max={roll.count||1}/>
    <div className="rb-ticks" aria-hidden="true" style={{"--rb-ticks":Math.max(1,cols)}}>{states.map((state,index)=><i key={index} data-status={state}/>)}</div>
    <small>{roll.progress.done} / {roll.count} uploaded</small>
  </div>;
}

async function workshopDropGroups(dataTransfer){
  const files=Array.from(dataTransfer.files||[]);
  const entries=Array.from(dataTransfer.items||[]).map(item=>item.webkitGetAsEntry?.()).filter(Boolean);
  const dirs=entries.filter(entry=>entry.isDirectory);
  if(!dirs.length)return workshopPickedGroups(files);
  const groups=[];
  for(const dir of dirs.sort((a,b)=>CSG_COLLATOR.compare(a.name,b.name))){
    const children=await csgReadDirectory(dir.createReader());
    const subfolders=children.filter(item=>item.isDirectory);
    const direct=children.filter(item=>item.isFile);
    if(direct.length||!subfolders.length)groups.push({name:dir.name,folder:true,files:await Promise.all(direct.map(csgEntryFile))});
    for(const sub of subfolders.sort((a,b)=>CSG_COLLATOR.compare(a.name,b.name))){
      const nested=await csgReadDirectory(sub.createReader());
      groups.push({name:sub.name,source:dir.name,folder:true,nested:nested.some(item=>item.isDirectory),files:await Promise.all(nested.filter(item=>item.isFile).map(csgEntryFile))});
    }
  }
  const loose=entries.filter(item=>item.isFile);
  if(loose.length)groups.push({name:"Selected scans",files:await Promise.all(loose.map(csgEntryFile))});
  return groups;
}

function workshopPickedGroups(files){
  const groups=new Map();
  for(const file of Array.from(files||[])){
    const path=file.webkitRelativePath?.split("/")||[];
    const name=path.length>1?(path[1]&&path.length>2?path[1]:path[0]):"Selected scans";
    if(!groups.has(name))groups.set(name,{name,source:path.length>2?path[0]:"",folder:path.length>1,files:[],nested:false});
    if(path.length>3)groups.get(name).nested=true;
    else groups.get(name).files.push(file);
  }
  return [...groups.values()];
}

async function workshopPrepareFrames(files,onProgress){
  const frames=[];
  for(const [index,file] of files.entries()){
    const blob=await csgFileToPreparedBlob(file);
    frames.push({name:file.name,blob});
    onProgress?.(index+1);
    await new Promise(resolve=>setTimeout(resolve,0));
  }
  return frames;
}

async function workshopScanSignature(file){
  const clipboard=file.type==="image/png"&&/^clipboard-.+\.png$/.test(file.name);
  if(!workshopScanName(file.name)&&!clipboard)return false;
  try{
    const b=new Uint8Array(await file.slice(0,8).arrayBuffer());
    if(clipboard)return [137,80,78,71,13,10,26,10].every((byte,i)=>byte===b[i]);
    if(/\.tiff?$/i.test(file.name))return [[73,73,42,0],[77,77,0,42],[73,73,43,0],[77,77,0,43]].some(header=>header.every((byte,i)=>byte===b[i]));
    return b[0]===255&&b[1]===216&&b[2]===255;
  }catch{return false;}
}

function useWorkshopIntake({available,occupied,sheetLoaded,prepare,orderName,job,uploadsEnabled,uploadBlocked,skipSheets,recordExcluded,correctionRollIndex=null}){
  const [queue,setQueue]=React.useState([]);
  const [queueName,setQueueName]=React.useState("");
  const [activeId,setActiveId]=React.useState("");
  const [drive,setDrive]=React.useState(false);
  const [reading,setReading]=React.useState(false);
  const [intakeError,setIntakeError]=React.useState("");
  const nextId=React.useRef(0);
  const queueRef=React.useRef([]);
  const alive=React.useRef(true);
  const busy=React.useRef(false);
  const lastProgress=React.useRef(new Map());
  if(!job)lastProgress.current.clear();
  if(job)for(const roll of job.rolls){lastProgress.current.set(roll.roll,roll);}
  React.useEffect(()=>()=>{alive.current=false;},[]);
  function write(next){
    queueRef.current=next;
    if(alive.current)setQueue(next);
  }
  function submit(selected){
    const ids=new Set(selected.map(roll=>roll.id));
    if(!ids.size)return;
    const skipped=queueRef.current.filter(roll=>!roll.submitted&&!roll.ignored&&!roll.included);
    recordExcluded?.([...skipped.filter(roll=>!roll.blocked),...selected.filter(roll=>roll.blank)].map(roll=>roll.index));
    write(queueRef.current.map(roll=>ids.has(roll.id)?{...roll,submitted:true,sendsOriginals:uploadsEnabled}:
      skipped.includes(roll)?{...roll,ignored:true}:roll));
    void prepare(selected).catch(error=>{if(alive.current)setIntakeError(error.message);});
  }
  async function stage(groups){
    const signatures=new Map(await Promise.all(groups.flatMap(group=>group.files).map(async file=>[file,await workshopScanSignature(file)])));
    if(!alive.current||!groups.length)return;
    const existing=queueRef.current;
    const used=new Set([...occupied,...existing.filter(roll=>!roll.blocked&&!roll.ignored).map(roll=>roll.index)]);
    const numbered=new Set(correctionRollIndex===null?groups.map(group=>workshopRollNumber(group.name)).filter(value=>value>0).map(value=>value-1):[]);
    const batch=groups.map(group=>{
      const rollNo=correctionRollIndex===null?workshopRollNumber(group.name):0;
      const index=rollNo?rollNo-1:available.findIndex((_,slot)=>!used.has(slot)&&!numbered.has(slot));
      const canMap=index>=0&&Boolean(available[index])&&!used.has(index);
      if(canMap)used.add(index);
      const blank=correctionRollIndex===null&&group.folder&&!group.nested&&workshopIsBlankRoll(group.name);
      const fileCounts=new Map();
      group.files.forEach(file=>fileCounts.set(file.name,(fileCounts.get(file.name)||0)+1));
      const raw=group.files.filter(file=>!blank||!/^(\.ds_store|thumbs\.db|desktop\.ini)$/i.test(file.name)).sort((a,b)=>CSG_COLLATOR.compare(a.name,b.name));
      const frames=raw.map((file,i)=>({id:String(i),file,name:file.name,
        flag:!signatures.get(file)?"Not JPEG or TIFF":
          fileCounts.get(file.name)>1?"Duplicate filename":""}));
      const files=frames.filter(frame=>!frame.flag).map(frame=>frame.file);
      const warnings=[
        group.folder&&!rollNo&&!blank&&correctionRollIndex===null?"Folder name does not match Roll 01, Roll 02, etc.":"",
        group.nested?"Nested folders were skipped.":"",
        frames.some(frame=>frame.flag==="Not JPEG or TIFF")?"Non-JPEG/TIFF files were skipped.":"",
        frames.some(frame=>frame.flag==="Duplicate filename")?"Duplicate filenames were skipped.":"",
        !files.length&&!blank?"No JPEG/TIFF scans in this roll.":"",
        !canMap?"This roll has no available slot on the order.":""
      ].filter(Boolean);
      return {id:"local-"+(++nextId.current),folderName:group.name,folder:group.folder,blank,index,name:available[index]||group.name,
        number:index>=0?workshopRollLabel(correctionRollIndex??index):"?",files,frames,warnings,count:files.length,skipped:frames.length-files.length,
        included:Boolean(canMap&&(files.length||blank)),blocked:!canMap};
    });
    setIntakeError("");setActiveId("");setDrive(false);
    if(!existing.length)setQueueName(groups.find(group=>group.source)?.source||"");
    write([...existing,...batch]);
    if(!existing.some(roll=>!roll.submitted&&!roll.ignored)&&!batch.some(roll=>roll.warnings.length)&&!uploadBlocked)submit(batch);
  }
  async function receive(dataTransfer){
    if(busy.current)return;
    busy.current=true;setReading(true);setIntakeError("");
    try{await stage(await workshopDropGroups(dataTransfer));}
    catch(error){if(alive.current)setIntakeError(error.message||"Could not read the dropped folder.");}
    finally{busy.current=false;if(alive.current)setReading(false);}
  }
  async function pick(files){
    if(busy.current)return;
    busy.current=true;setReading(true);setIntakeError("");
    try{await stage(workshopPickedGroups(files));}
    catch(error){if(alive.current)setIntakeError(error.message||"Could not read the selected scans.");}
    finally{busy.current=false;if(alive.current)setReading(false);}
  }
  function toggle(id){
    const changed=queueRef.current.find(roll=>roll.id===id);
    if(!changed||changed.submitted||changed.ignored||changed.blocked||(!changed.count&&!changed.blank))return;
    write(queueRef.current.map(roll=>roll.id===id?{...roll,included:!roll.included}:roll));
  }
  const eligible=queue.filter(roll=>!roll.submitted&&!roll.ignored&&roll.included&&!roll.blocked&&(roll.count||roll.blank));
  const staged=queue.some(roll=>!roll.submitted&&!roll.ignored);
  const shown=queue.map(roll=>{
    if(roll.blank&&!roll.blocked)return {...roll,editable:!roll.submitted&&!roll.ignored,state:roll.submitted?"done":"waiting",status:roll.included?"Blank roll":"Skipped"};
    const progress=roll.sendsOriginals&&lastProgress.current.get("roll-"+roll.number);
    const state=!roll.submitted?"waiting":progress?.error?"error":progress?.sheetState==="error"?"error":progress?.sent===roll.count?"done":"uploading";
    let status=!roll.included?"Skipped":roll.warnings.length&&!roll.submitted?"Needs attention":!roll.submitted?"Ready":
      state==="error"?"Scans selected":roll.sendsOriginals?state==="done"?"Uploaded":progress?"Uploading":"Scans selected":"Contact sheets only";
    return {...roll,editable:!roll.submitted&&!roll.ignored,state:roll.warnings.length&&!roll.submitted?"warning":state,status,
      progress:progress&&{done:progress.sent,ticks:progress.ticks},
      sheetStatus:roll.submitted&&!skipSheets?(progress?.sheetState==="done"?"Contact sheets staged":
        progress?.sheetState==="error"?"Contact sheets failed":progress?.sheetState&&progress.sheetState!=="waiting"?"Preparing contact sheets":
        !progress?.sheetState&&sheetLoaded.has(roll.index)?"Ready to review":"Contact sheets pending"):""};
  });
  const active=shown.find(roll=>roll.id===activeId);
  const complete=shown.some(roll=>roll.submitted&&!roll.blank)&&shown.every(roll=>!roll.submitted||roll.blank||
    (roll.sendsOriginals?roll.state==="done":skipSheets||sheetLoaded.has(roll.index))&&
    !["waiting","building","uploading","error"].includes(roll.sendsOriginals?lastProgress.current.get("roll-"+roll.number)?.sheetState:""));
  const frameCount=eligible.reduce((sum,roll)=>sum+roll.count,0);
  const action=uploadsEnabled?"Upload ":"Prepare ";
  return {pick,receive,showDrive:drive,setDrive,reading,hasQueue:queue.length>0,error:intakeError,uploadsEnabled,
    blankRolls:queue.filter(roll=>roll.blank&&roll.submitted).map(roll=>roll.index),
    panel:<WorkshopRollBrowser orderName={queueName||orderName} rolls={shown} active={active} onOpen={roll=>setActiveId(roll.id)}
      onBack={()=>setActiveId("")} onToggle={toggle} frames={active?.frames||[]} loading={reading} error={intakeError}
      footerLabel={staged?(frameCount?action+frameCount+(frameCount===1?" scan":" scans"):eligible.length?"Confirm blank roll":"Select a roll"):complete&&!skipSheets?"Review contact sheets":undefined}
      footerDisabled={staged&&(!eligible.length||uploadBlocked||reading)}
      footerAction={()=>{if(staged)submit(eligible);else document.getElementById("refresh-sheets")?.scrollIntoView({block:"start"});}}
      />};
}


function parseWorkshopDriveFolder(value) {
  try {
    const url=new URL(value);
    if(url.origin!=="https://drive.google.com"||url.username||url.password)return "";
    return url.pathname.match(/^\/drive\/(?:u\/\d+\/)?folders\/([\w-]{10,100})\/?$/)?.[1]||"";
  }catch{return "";}
}

function WorkshopDriveLink({url}){
  const [status,setStatus]=React.useState("");
  const [manual,setManual]=React.useState(false);
  async function copy(){
    try{
      await navigator.clipboard.writeText(url);
      setManual(false);setStatus("Drive link copied.");
    }catch{
      setManual(true);setStatus("");
    }
  }
  return <>
    <button type="button" className="sl-text-button" data-drive-link={url} onClick={copy}>Copy Drive link<RefreshIcon name="Copy" size={14}/></button>
    {status&&<span className="sl-folder-copy-status" role="status">{status}</span>}
    {manual&&<input className="sl-drive-copy-field" autoFocus readOnly aria-label="Drive link to copy" value={url} onFocus={event=>event.currentTarget.select()}/>}
