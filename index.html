function WorkshopDriveFolder({folderUrl,folderId,trial,uploadRevision,orderRolls=[]}) {
  const [activeId,setActiveId]=React.useState("");
  const [data,setData]=React.useState({});
  const [loading,setLoading]=React.useState(true);
  const [error,setError]=React.useState("");
  const [revision,setRevision]=React.useState(0);
  const [pageToken,setPageToken]=React.useState("");
  const target=activeId&&activeId!=="root-frames"?activeId:folderId;
  const connected=trial?trial.connection:true;
  const trialMode=Boolean(trial);
  function read(id,token="",signal){
    return trial?trial.readFolder(folderId,id,token,signal):apiCall("browseDriveFolder",{folderUrl,folderId:id,pageToken:token},{signal});
  }
  const loadThumbnail=React.useCallback(async (id,signal)=>{
    if(trialMode)return trial.readThumbnail(folderId,target,id,signal);
    const result=await apiCall("browseDriveThumbnail",{folderUrl,folderId:target,fileId:id},{signal});
    return result?.image||"";
  },[trialMode,folderId,folderUrl,target]);
  React.useEffect(()=>{
    if(connected===null)return;
    if(!connected){setLoading(false);setError("Connect the Drive trial to check what is in this folder.");return;}
    const controller=new AbortController(),{signal}=controller;
    setLoading(true);setError("");
    read(target,pageToken,signal).then(result=>{
      if(!result?.folder||!Array.isArray(result.items))throw Error(result?.error||"Drive did not return the folder contents.");
      if(signal.aborted)return;
      setData(previous=>{
        const items=pageToken?[...new Map([...(previous[target]?.items||[]),...result.items].map(item=>[item.id,item])).values()]:result.items;
        return {...previous,[target]:{...result,items}};
      });
      // Fill roll counts from the first page of each child without fetching images.
      if(target===folderId&&!pageToken){
        const pending=result.items.filter(item=>item.folder);
        const loadCounts=async()=>{
          while(!signal.aborted&&pending.length){
            const item=pending.shift();
            try{
              const child=await read(item.id,"",signal);
              if(!signal.aborted&&child?.folder)setData(previous=>previous[item.id]?previous:{...previous,[item.id]:child});
            }catch{}
          }
        };
        void loadCounts();void loadCounts();
      }
    }).catch(error=>{if(!signal.aborted)setError(error.message);}).finally(()=>{if(!signal.aborted)setLoading(false);});
    return ()=>controller.abort();
  },[folderUrl,target,pageToken,revision,connected,trialMode]);
  function refresh(){
    setData(previous=>target===folderId?{}:{[folderId]:previous[folderId]});
    setPageToken("");setRevision(value=>value+1);
  }
  React.useEffect(()=>{if(uploadRevision)refresh();},[uploadRevision]);
  function select(id){
    setError("");setPageToken("");setActiveId(id);
  }
  const root=data[folderId],current=data[target];
  const rootScans=root?.items.filter(item=>!item.folder)||[];
  const folders=root?.items.filter(item=>item.folder)||[];
  const rolls=folders.map((item,index)=>{
    const number=workshopRollNumber(item.name);
    const entry=data[item.id];
    const files=entry?.items||[];
    const blank=workshopIsBlankRoll(item.name);
    const skipped=files.filter(file=>file.folder||!workshopScanName(file.name)).length;
    const warnings=[!number&&!blank?"Folder name does not match Roll 01, Roll 02, etc.":"",
      entry&&!files.length&&!blank?"Empty roll.":"",skipped?"Some items are not JPEG/TIFF scans.":""].filter(Boolean);
    return {id:item.id,number:number?String(number).padStart(2,"0"):workshopRollLabel(index),
      folderName:item.name,name:orderRolls[number-1]||item.name,count:entry?files.length-skipped:null,partial:Boolean(entry?.nextPageToken),skipped,
      warnings,state:warnings.length?"warning":"ready",status:warnings.length?"Needs attention":blank?"Blank roll":"In Drive"};
  });
  if(rootScans.length)rolls.push({id:"root-frames",number:"01",name:orderRolls[0]||"Loose scans",folderName:"Loose scans",
    count:rootScans.filter(item=>workshopScanName(item.name)).length,partial:Boolean(root.nextPageToken),status:"In Drive"});
  const active=rolls.find(roll=>roll.id===activeId);
  const frames=active?(active.id==="root-frames"?rootScans:current?.items||[]).map(item=>({...item,
    flag:item.folder?"Nested folder":workshopScanName(item.name)?"":"Not JPEG or TIFF"})):[];
  return <WorkshopRollBrowser orderName={root?.folder.name||"Drive folder"} rolls={rolls} active={active}
    onOpen={roll=>select(roll.id)} onBack={()=>select("")} frames={frames} loadThumbnail={loadThumbnail}
    loading={loading} error={error} nextPage={current?.nextPageToken} onMore={()=>setPageToken(current.nextPageToken)}
    onRefresh={refresh} readOnly/>;
}

const WORKSHOP_UPLOADS=true;
function workshopRollTarget(orderNo,folder,group){
  const orderNumber=String(orderNo).trim().toUpperCase(), rollNumber=group.index+1;
  if(!/^[A-Z0-9][A-Z0-9_-]{0,39}$/.test(orderNumber)||!folder)throw Error("Set the order number and Drive folder before uploading.");
  const name=String(group.name||"").trim().replace(/^roll[\s_-]*\d+\s*(?:[-_:]\s*)?/i,"");
  const rollName="Roll "+String(rollNumber).padStart(2,"0")+(name?" - "+name:"")+(group.blank&&!workshopIsBlankRoll(name)?" BLANK":"");
  return {orderNumber,orderFolderId:folder,rollNumber,rollName};
}
let workshopSessionQueue=Promise.resolve();
function workshopDriveAction(action,data){
  // Apps Script locks session creation, but the scans themselves can transfer in parallel.
  const request=workshopSessionQueue.then(async()=>{
    for(let attempt=0;;attempt++){
      const result=await apiCall(action,data,{retry:false});
      if(result&&!result.error)return result;
      const busy=result?.error==="Drive folder creation is busy. Please try again."||result?.httpStatus===429;
      if(!busy||attempt>=2)throw Error(result?.error||"Drive did not confirm the upload request.");
      await new Promise(resolve=>setTimeout(resolve,500*(attempt+1)));
    }
  });
  workshopSessionQueue=request.catch(()=>{});
  return request;
}
async function workshopSendOriginal(job,file,update){
  const original=file.original,size=original.size;
  const target=file.target;
  if(target.orderFolderId!==job.folder||target.orderNumber!==job.orderNo.trim().toUpperCase())throw Error("The upload no longer matches its order folder.");
  if(!file.digest){
    const hash=await crypto.subtle.digest("SHA-256",await original.arrayBuffer());
    file.digest=Array.from(new Uint8Array(hash),b=>b.toString(16).padStart(2,"0")).join("");
  }
  const result=await workshopDriveAction("workshopUploadSession",{...target,filename:original.name,size,digest:file.digest});
  if(result.done){file.offset=size;return;}
  const url=new URL(result.sessionUrl);
  if(url.origin!=="https://www.googleapis.com"||url.pathname!=="/upload/drive/v3/files"||!url.searchParams.has("upload_id")||url.username||url.password)throw Error("Drive did not return a valid upload destination.");
  file.phase="uploading";
  // The session is scoped to this file. Never send the Dispatch staff key to Google.
  async function put(range,body){
    const api=new URL(WORKER_API);api.searchParams.set("action","workshopUploadBytes");
    const res=await fetch(api.href,{method:"POST",headers:{Authorization:"Bearer "+encodeURIComponent(getContactSheetAdminKey()),"X-Workshop-Session":url.href,"X-Workshop-Range":range},body,credentials:"omit",redirect:"error",referrerPolicy:"no-referrer",signal:AbortSignal.timeout(120000)});
    const reply=await res.json();
    if(!res.ok||reply.error||typeof reply.done!=="boolean"||!Number.isSafeInteger(reply.offset)){
      const error=Error(reply.error||"Drive did not confirm the upload.");
      error.transient=[408,429,500,502,503,504].includes(res.status)&&!/^Drive did not confirm the upload \((?:400|401|403|404|409|410)\)\.$/.test(error.message);
      throw error;
    }
    return reply;
  }
  let state=await put("bytes */"+size,null),recoveries=0;
  while(!state.done){
    const start=state.offset,end=Math.min(start+8*1024*1024,size);
    if(!Number.isSafeInteger(start)||start<0||start>=size)throw Error("Drive did not confirm the final file.");
    try{
      state=await put("bytes "+start+"-"+(end-1)+"/"+size,original.slice(start,end));
    }catch(error){
      if(recoveries>=2||!(error.transient||error instanceof TypeError||error.name==="TimeoutError"))throw error;
      recoveries++;
      await new Promise(resolve=>setTimeout(resolve,500*recoveries));
      // Check what Drive actually received before sending any bytes again.
      state=await put("bytes */"+size,null);
      if(state.offset<start||state.offset>end)throw Error("Drive returned an invalid upload position.");
      file.offset=state.offset;update();continue;
    }
    if(state.offset<=start||state.offset>end)throw Error("Drive did not confirm the uploaded bytes.");
    file.offset=state.offset;update();
  }
  file.offset=size;
}

function useRealDriveTransfers() {
  const jobs=React.useRef([]),active=React.useRef(0),building=React.useRef(0);
  const [version,setVersion]=React.useState(0);
  const storageKey="dispatch-interrupted-uploads";
  const [interrupted,setInterrupted]=React.useState(()=>{
    try{
      const stored=JSON.parse(sessionStorage.getItem(storageKey)||"[]");
      return Array.isArray(stored)?stored.filter(item=>item?.batch&&/^[\w-]+$/.test(item.folder)):[];
    }catch{return [];}
  });
  const lastSnapshot=React.useRef("");
  const dismissed=React.useRef(new Set());
  const update=()=>setVersion(value=>value+1);
  async function api(job,action,headers={},body){
    for(let attempt=0;;attempt++){
      const response=await fetch("/refresh/drive-trial",{method:"POST",headers:{"X-Trial-Action":action,"X-Trial-Batch":job.batch,...headers},body});
      const result=await response.json();
      if(response.ok)return result;
      if(action==="session"&&result.code==="setupBusy"&&result.retryable&&attempt<5){
        await new Promise(resolve=>setTimeout(resolve,Math.min(4000,500*2**attempt)));
        continue;
      }
      if(result.code==="setupBusy")throw Error("This file's upload could not start. Other files will continue; resume this file when ready.");
      throw Error(result.error||"The upload was interrupted.");
    }
  }
  async function transfer(job,file) {
    try{
      file.state="sending";file.phase="preparing";file.error="";update();
      if(WORKSHOP_UPLOADS){
        if(file.emptyRoll)await workshopDriveAction("workshopUploadRoll",file.target);
        else await workshopSendOriginal(job,file,update);
        file.state="done";return;
      }
      if(!file.digest){
        const hash=await crypto.subtle.digest("SHA-256",await file.original.arrayBuffer());
        file.digest=Array.from(new Uint8Array(hash),byte=>byte.toString(16).padStart(2,"0")).join("");
      }
      if(!file.session){
        const result=await api(job,"session",{"X-Trial-Roll":file.roll,"X-Trial-Filename":encodeURIComponent(file.original.name),
          "X-Trial-Size":String(file.original.size),"X-Trial-Digest":file.digest,...(file.sheet?{"X-Trial-Kind":"sheet"}:{})});
        if(result.done){file.offset=file.original.size;file.state="done";return;}
        file.session=result.session;
      }
      let result;
      try{result=await api(job,"probe",{"X-Trial-Session":file.session});}
      catch(error){file.session=null;throw error;}
      file.offset=result.offset;
      file.phase="uploading";update();
      if(result.done){file.state="done";return;}
      while(file.offset<file.original.size){
        const start=file.offset,end=Math.min(file.original.size,start+8*1024*1024);
        result=await api(job,"chunk",{"X-Trial-Session":file.session,"X-Trial-Offset":String(start)},file.original.slice(start,end));
        if(result.offset<=start&&!result.done)throw Error("Drive has not confirmed the chunk. Retry to resume.");
        file.offset=result.offset;update();
        if(result.done)break;
      }
      if(!result.done)throw Error("Drive has not confirmed this file.");
      file.state="done";
    }catch(error){file.error=file.original.name+": "+error.message;file.state="error";}
    finally{active.current--;update();pump();}
  }
  function pump(){
    for(const job of jobs.current)for(const [roll,task] of job.sheetTasks){
      const files=job.files.filter(file=>file.roll===roll);
      if(task.state==="waiting"&&building.current<1&&files.length&&files.every(file=>file.state==="done")){
        task.state="building";building.current++;update();
        Promise.resolve().then(task.build).then(sheets=>{
          task.state="uploading";
          for(const original of sheets)job.files.push({roll,original,sheet:true,state:"queued",offset:0});
        }).catch(error=>{task.state="error";task.error=error.message||"Contact sheets could not be built.";})
          .finally(()=>{building.current--;update();pump();});
      }else if(task.state==="uploading"&&files.every(file=>file.state==="done")){
        task.state="done";task.build=null;update();
      }
    }
    while(active.current<3){
      let selected;
      for(const job of jobs.current){const file=job.files.find(file=>file.state==="queued");if(file){selected={job,file};break;}}
      if(!selected)break;
      selected.file.state="sending";active.current++;void transfer(selected.job,selected.file);
    }
  }
  function enqueue(batch,folder,groups,orderNo) {
    let job=jobs.current.find(job=>job.batch===batch);
    if(!job){job={batch,folder,orderNo,files:[],sheetTasks:new Map(),expanded:false,retryCount:0};jobs.current.push(job);}
    if(job.folder!==folder||job.orderNo.trim()!==orderNo.trim())return false;
    for(const group of groups){
      const roll="roll-"+String(group.index+1).padStart(2,"0");
      const target=WORKSHOP_UPLOADS?workshopRollTarget(orderNo,folder,group):null;
      if(WORKSHOP_UPLOADS&&group.blank&&!group.files.length&&!job.files.some(f=>f.emptyRoll&&f.roll===roll)){
        job.files.push({roll,name:group.name,original:{name:target.rollName,size:0},sheet:true,emptyRoll:true,target,state:"queued",offset:0});
      }
      if(!WORKSHOP_UPLOADS&&group.buildSheets&&!job.sheetTasks.has(roll))job.sheetTasks.set(roll,{state:"waiting",build:group.buildSheets});
      for(const original of group.files){
        if(!job.files.some(file=>!file.sheet&&file.roll===roll&&file.original.name===original.name&&file.original.size===original.size&&file.original.lastModified===original.lastModified)){
          job.files.push({roll,name:group.name||"Roll "+(group.index+1),target,original,state:"queued",offset:0});
        }
      }
    }
    update();pump();return true;
  }
  function toggle(batch){const job=jobs.current.find(job=>job.batch===batch);if(job)job.expanded=!job.expanded;update();}
  function retryFailed(batch){
    const job=jobs.current.find(job=>job.batch===batch);
    if(!WORKSHOP_UPLOADS||!job||inFlight(job))return;
    const failedFiles=job.files.filter(file=>file.state==="error");
    if(!failedFiles.length)return;
    job.retryCount++;
    for(const file of failedFiles){file.state="queued";file.error="";}
    update();pump();
  }
  function done(job){return job.files.every(file=>file.state==="done")&&[...job.sheetTasks.values()].every(task=>task.state==="done");}
  function inFlight(job){return job.files.some(file=>["queued","sending"].includes(file.state))||[...job.sheetTasks.values()].some(task=>task.state==="building");}
  function dismiss(batch){jobs.current=jobs.current.filter(job=>job.batch!==batch||inFlight(job));dismissInterrupted(batch);update();}
  function dismissInterrupted(batch){
    dismissed.current.add(batch);
    storeRecoverySummary();
    setInterrupted(previous=>previous.filter(job=>job.batch!==batch));
  }
  function storeRecoverySummary(){
    const entries=new Map(interrupted.filter(job=>!dismissed.current.has(job.batch)).map(job=>[job.batch,job]));
    for(const job of jobs.current){
      if(done(job)){entries.delete(job.batch);continue;}
      const originals=job.files.filter(file=>!file.sheet);
      entries.set(job.batch,{batch:job.batch,folder:job.folder,orderNo:job.orderNo,
        sent:originals.filter(file=>file.state==="done").length,total:originals.length});
    }
    const next=JSON.stringify([...entries.values()]);
    if(next===lastSnapshot.current)return;
    try{sessionStorage.setItem(storageKey,next);lastSnapshot.current=next;}catch{}
  }
  React.useEffect(()=>{storeRecoverySummary();},[version,interrupted]);
  const hasOutstanding=jobs.current.some(inFlight);
  React.useEffect(()=>{
    if(!hasOutstanding)return;
    function warn(event){
      if(!jobs.current.some(inFlight))return;
      storeRecoverySummary();
      event.preventDefault();event.returnValue="";
    }
    window.addEventListener("beforeunload",warn);
    return ()=>window.removeEventListener("beforeunload",warn);
  },[hasOutstanding,interrupted]);
  const transfers=jobs.current.map(job=>{
    const originals=job.files.filter(file=>!file.sheet);
    const totalBytes=originals.reduce((sum,file)=>sum+file.original.size,0),sentBytes=originals.reduce((sum,file)=>sum+file.offset,0);
    const total=originals.length,sent=originals.filter(file=>file.state==="done").length;
    return {...job,key:job.batch,total,sent,totalBytes,sentBytes,done:done(job),inFlight:inFlight(job),error:job.files.find(file=>file.state==="error")?.error||[...job.sheetTasks.values()].find(task=>task.error)?.error,
      rolls:[...new Set(job.files.map(file=>file.roll))].map(roll=>{
        const files=originals.filter(file=>file.roll===roll);
        const derivatives=job.files.filter(file=>file.roll===roll&&file.sheet);
        const task=job.sheetTasks.get(roll);
        return {roll,name:files[0]?.name||derivatives[0]?.name||roll,frames:files.length,sent:files.filter(file=>file.state==="done").length,
          ticks:files.map(file=>file.state),
          active:files.some(file=>file.state==="sending"),uploading:files.some(file=>file.state==="sending"&&file.phase==="uploading"),
          error:files.some(file=>file.state==="error")||derivatives.some(file=>file.state==="error")||task?.state==="error",
          sheetState:derivatives.some(file=>file.state==="error")?"error":task?.state};
      })};
  });
  return {transfers,enqueue,toggle,dismiss,interrupted,dismissInterrupted,retryFailed};
}

function orderTransferStage(job){
  if(job.sent===job.total)return {state:"sheets",label:"Staging contact sheets",icon:"Images"};
  if(job.sentBytes||job.rolls.some(roll=>roll.uploading))return {state:"upload",label:"Uploading scans",icon:"CloudUpload"};
  if(job.rolls.some(roll=>roll.active))return {state:"prepare",label:"Preparing scans",icon:"LoaderCircle"};
  return {state:"prepare",label:"Queued",icon:"Clock"};
}

function OrderStatusRow({job,manager}){
  const expanded=job.expanded;
  const stage=orderTransferStage(job),number=job.orderNo||"draft";
  const originalPercent=Math.floor(job.sentBytes/(job.totalBytes||1)*100);
  const sheetTasks=job.rolls.filter(roll=>roll.sheetState);
  const sheetsDone=sheetTasks.filter(roll=>roll.sheetState==="done").length;
  return <article className="sl-order-status-row" data-stage={stage.state} aria-label={"Order "+number}>
    <div className="sl-order-status-top">
      <button type="button" className="sl-order-status-expand" aria-expanded={expanded}
        aria-label={"Order "+number+" / "+job.sent+" of "+job.total+" scans"} onClick={()=>manager.toggle(job.batch)}>
        <span className="sl-order-status-icon"><RefreshIcon name={stage.icon} size={16}/></span>
        <span className="sl-order-status-title"><strong>Order {number}</strong><small>{stage.label}</small></span>
        <RefreshIcon name={expanded?"ChevronUp":"ChevronDown"} size={15}/>
      </button>
    </div>
    <RealDriveProgress job={job} label={"Scan upload progress for order "+number}/>
    <div className="sl-order-status-count"><span>{job.sent} of {job.total} scans uploaded</span><strong>{originalPercent}%</strong></div>
    {sheetTasks.length>0&&(stage.state==="sheets"||stage.state==="done"||expanded)&&<div className="sl-order-status-sheet"><RefreshIcon name="Images" size={13}/><span>{sheetsDone} of {sheetTasks.length} {sheetTasks.length===1?"roll":"rolls"} with sheets staged</span></div>}
    {expanded&&<ul className="sl-order-status-rolls">{job.rolls.map(roll=><li key={roll.roll}><span>{roll.name}</span><small>{roll.sent} / {roll.frames} scans</small></li>)}</ul>}
    {expanded&&<OrderStatusDriveLink folder={job.folder}/>}
  </article>;
}

function OrderStatusDriveLink({folder}){
  const sample=window.DISPATCH_RECOVERY_DEMO===true&&folder.startsWith("recovery-trial-");
  return <a className="sl-text-button sl-status-drive-link" href={(sample?"/refresh/recovery-folder/":"https://drive.google.com/drive/folders/")+encodeURIComponent(folder)} target="_blank" rel="noopener noreferrer">
    {sample?"Open sample folder":"Open in Drive"}<RefreshIcon name="ArrowUpRight" size={13}/>
  </a>;
}

function UploadNote({job,manager,interrupted=false}){
  const number=job.orderNo||"draft";
  const allScansSent=job.total>0&&job.sent===job.total;
  const failedFiles=WORKSHOP_UPLOADS&&!interrupted?job.files.filter(file=>file.state==="error"):[];
  const summary=allScansSent&&job.error
    ? "Scans reached Drive, but one roll did not finish."
    : `${job.sent} of ${job.total} scans confirmed.`;
  const nextStep=failedFiles.length?"Select Retry missing files to try again.":"Please update in Drive.";
  return <article className="sl-order-status-row sl-upload-note" data-stage={job.done?"done":"error"} aria-label={(job.done?"Completed upload for order ":"Incomplete upload for order ")+number}>
    <div className="sl-order-status-top">
      <span className="sl-order-status-icon"><RefreshIcon name={job.done?"Check":"TriangleAlert"} size={15}/></span>
      <span className="sl-order-status-title"><strong>Order {number}</strong><small>{job.done?"Upload complete":"Upload incomplete"}</small></span>
      <button type="button" className="sl-icon-button" aria-label={"Dismiss upload note for order "+number} title="Dismiss upload note" onClick={()=>interrupted?manager.dismissInterrupted(job.batch):manager.dismiss(job.batch)}><RefreshIcon name="X" size={15}/></button>
    </div>
    {!job.done&&<>
      <p>{summary} {nextStep}</p>
      {failedFiles.map((file,i)=><p key={i}>{file.error}</p>)}
      {failedFiles.length>0&&<button type="button" className="sl-secondary" onClick={()=>manager.retryFailed(job.batch)}>Retry missing files</button>}
      <OrderStatusDriveLink folder={job.folder}/>
    </>}
  </article>;
}

function OrderUploadAnnouncements({transfers}){
  const previousOutcomes=React.useRef(new Map());
  const [announcement,setAnnouncement]=React.useState({id:0,text:""});

  React.useEffect(()=>{
    const outcomes=new Map();
    const messages=[];
    for(const job of transfers){
      if(job.inFlight)continue;
      const outcome=job.done?"Upload complete":"Upload incomplete";
      const attempt=`${outcome}:${job.files.length}:${job.retryCount}`;
      outcomes.set(job.batch,attempt);
      if(previousOutcomes.current.get(job.batch)!==attempt){
        messages.push(`Order ${job.orderNo||"draft"}. ${outcome}.`);
      }
    }
    previousOutcomes.current=outcomes;
    if(messages.length)setAnnouncement(previous=>({id:previous.id+1,text:messages.join(" ")}));
  },[transfers]);

  return <div className="sl-sr-only" role="status" aria-live="polite" aria-atomic="true">
    <span key={announcement.id}>{announcement.text}</span>
  </div>;
}

function OrderStatusTray({manager,demo}){
  const jobs=manager.transfers;
  const interrupted=manager.interrupted.filter(job=>!jobs.some(active=>active.batch===job.batch));
  const active=jobs.filter(job=>job.inFlight);
  const notes=jobs.filter(job=>!job.inFlight);
  if(!jobs.length&&!interrupted.length&&!demo.transfers.length)return null;
  return <section className="sl-order-status" aria-label="Order status">
    <header><h3><RefreshIcon name="ListChecks" size={16}/>Order status</h3>{active.length>0&&<span>{active.length} uploading</span>}</header>
    <div className="sl-order-status-jobs">
      {active.map(job=><OrderStatusRow key={job.batch} job={job} manager={manager}/>)}
      {notes.map(job=><UploadNote key={job.batch} job={job} manager={manager}/>)}
      {interrupted.map(job=><UploadNote key={job.batch} job={job} manager={manager} interrupted/>)}
      {demo.transfers.map(job=><article key={job.key} className="sl-order-status-row">
        <div className="sl-order-status-top"><span className="sl-order-status-title"><strong>Order {job.orderNo}</strong><small>Simulation</small></span>
          {job.done&&<button type="button" className="sl-icon-button" aria-label={"Dismiss upload note for order "+job.orderNo} onClick={()=>demo.dismiss(job.key)}><RefreshIcon name="X" size={15}/></button>}
        </div>{job.done?<small>Upload complete</small>:<progress aria-label="Simulation progress" value={job.sent} max={job.total}/>}
      </article>)}
    </div>
  </section>;
}

function RealDriveProgress({job,label}) {
  return <div className="sl-real-progress" role="progressbar" aria-label={label} aria-valuemin={0}
    aria-valuemax={job.totalBytes||1} aria-valuenow={job.sentBytes} data-done={job.done}>
    <span style={{width:job.sentBytes/(job.totalBytes||1)*100+"%"}}/>
  </div>;
}

function workshopOrderDate(value){
  if(!value)return "";
  const date=new Date(value);
  if(!Number.isFinite(date.getTime()))return "";
  const timeZone="Asia/Makassar";
  if(typeof value==="string"&&/^\d{4}-\d{2}-\d{2}$/.test(value)){
    return new Intl.DateTimeFormat("en-GB",{day:"2-digit",month:"short",timeZone}).format(date);
  }
  return new Intl.DateTimeFormat("en-GB",{day:"2-digit",month:"short",timeZone}).format(date)+" / "+
    new Intl.DateTimeFormat("en-GB",{hour:"2-digit",minute:"2-digit",hourCycle:"h23",timeZone}).format(date);
}

function WorkshopPastOrderFinder({search,onSearch,orders,onLoad,disabled}){
  const [open,setOpen]=React.useState(false);
  const container=React.useRef(null),trigger=React.useRef(null),input=React.useRef(null),rows=React.useRef([]);
  function close(returnFocus=false){
    setOpen(false);
    if(returnFocus)trigger.current?.focus();
  }
  function load(order){
    if(!order||disabled)return;
    close(true);
    onSearch("");
    void onLoad(order);
  }
  React.useEffect(()=>{
    function keys(event){
      if(event.defaultPrevented||event.ctrlKey||event.altKey||event.metaKey||event.shiftKey)return;
      if(event.key==="Escape"&&open){
        event.preventDefault();close(true);return;
      }
      if(event.key!=="/"||disabled||document.querySelector('[aria-modal="true"]')||
        event.target.closest?.("input, textarea, select, [contenteditable]"))return;
      event.preventDefault();setOpen(true);input.current?.focus();
    }
    function outside(event){if(open&&!container.current?.contains(event.target))close();}
    document.addEventListener("keydown",keys);document.addEventListener("pointerdown",outside);
    return()=>{document.removeEventListener("keydown",keys);document.removeEventListener("pointerdown",outside);};
  },[open,disabled]);
  React.useEffect(()=>{if(open)input.current?.focus();},[open]);
  return <div ref={container} className="sl-past-finder">
    <button ref={trigger} type="button" className="sl-secondary sl-past-trigger" aria-expanded={open} aria-controls="sl-past-panel"
      aria-keyshortcuts="/" disabled={disabled} onClick={()=>setOpen(value=>!value)}>
      <RefreshIcon name="Search" size={15}/>Find past order<kbd aria-hidden="true">/</kbd>
    </button>
    {open&&<div className="sl-past-panel" id="sl-past-panel" role="dialog" aria-label="Find past order"
      onKeyDown={event=>{
        if(!["ArrowUp","ArrowDown"].includes(event.key)||!orders.length)return;
        const index=rows.current.indexOf(event.target);
        if(index<0&&event.target!==input.current)return;
        event.preventDefault();
        const next=event.key==="ArrowDown"?index+1:index-1;
        (next<0?input.current:rows.current[Math.min(next,orders.length-1)])?.focus();
      }}>
      <form role="search" className="sl-past-search" onSubmit={event=>{event.preventDefault();load(orders[0]);}}>
        <RefreshIcon name="Search" size={16}/>
        <input ref={input} type="search" aria-label="Search past orders" placeholder="Order number or customer name" value={search} onChange={event=>onSearch(event.target.value)}/>
      </form>
      {search.trim()&&<>
        {orders.length?<ul className="sl-past-results">
          {orders.map((order,index)=><li key={order.id||order.orderNumber}>
            <button ref={element=>{rows.current[index]=element;}} type="button" onClick={()=>load(order)}>
              <span><span className="sl-past-result-heading"><strong>{order.orderNumber}</strong><span>{order.customerName}</span></span>
                <small>{[workshopOrderDate(order.createdAt),order.film].filter(Boolean).join(" / ")}</small></span>
              <span className="sl-past-load">Load<RefreshIcon name="CornerDownLeft" size={13}/></span>
            </button>
          </li>)}
        </ul>:<p role="status">No matching saved orders.</p>}
        {orders.length>0&&<p className="sl-past-count" role="status">{orders.length} {orders.length===1?"match":"matches"} shown</p>}
      </>}
    </div>}
  </div>;
}

function applySpoolSoldCounts(stock,data,previous=new Set()){
  if(!data||!/^\d{4}-\d{2}-\d{2}$/.test(data.day)||!Array.isArray(data.rows))throw Error(data?.error||"Spool counts are unavailable.");
  const counts=new Map();
  for(const {stockId,sold} of data.rows){
    if(typeof stockId!=="string"||!stockId||!Number.isSafeInteger(sold)||sold<0||counts.has(stockId))throw Error("Spool returned invalid sold counts.");
    counts.set(stockId,sold);
  }
  let matched=0,units=0;
  const appliedIds=new Set();
  const nextStock=stock.map(cat=>({...cat,items:(cat.items||[]).map(item=>{
    const id=String(item.id??"");
    if(item.visible===false||!counts.has(id))return item;
    const sold=counts.get(id);
    counts.delete(id);
    if(sold===0&&!previous.has(id))return item;
    appliedIds.add(id);
    matched++;
    units+=sold;
    return {...item,sold};
  })}));
  const unmatched=[...counts.values()].filter(sold=>sold>0).length+(Array.isArray(data.unmatched)?data.unmatched.length:0);
  return {nextStock,matched,units,unmatched,appliedIds};
}

function StockTracker({orderStatus}) {
  const [spoolSyncBusy,setSpoolSyncBusy]=useState(false);
  const [spoolSyncStatus,setSpoolSyncStatus]=useState("");
  const [spoolSyncClosed,setSpoolSyncClosed]=useState(false);
  const [spoolSyncDay,setSpoolSyncDay]=useState(null);
  const spoolSyncedIds=useRef(new Set());
  async function syncSpoolSold(){
    setSpoolSyncBusy(true);
    try{
      const data=await apiCall("getSpoolSoldCounts");
      if(data?.finalized){setSpoolSyncClosed(true);setSpoolSyncStatus("Spool sales were already finalized for today.");return;}
      const previous=spoolSyncedIds.current;
      const {matched,units,unmatched,appliedIds}=applySpoolSoldCounts(stock,data,previous);
      setStock(current=>applySpoolSoldCounts(current,data,previous).nextStock);
      spoolSyncedIds.current=appliedIds;
      setSpoolSyncDay(matched?data.day:null);
      setSpoolSyncStatus(matched?units+" Spool units synced across "+matched+" items."+(unmatched?" "+unmatched+" unmatched; not applied.":""):unmatched?"No matched sales. "+unmatched+" items need matching.":"No Spool sales to sync today.");
    }catch(error){setSpoolSyncStatus(error.message||"Could not sync Spool sales.");}
    finally{setSpoolSyncBusy(false);}
  }

  const cachedStock = readStockCache();
  const [stockView,setStockView]=useState("count");
  const [countSearch,setCountSearch]=useState("");
  function switchStockTab(event) {
    const keys=["ArrowLeft","ArrowRight","Home","End"];if(!keys.includes(event.key))return;
    event.preventDefault();const ids=["count","rollcall","history","manage"],index=ids.indexOf(stockView);
    const next=event.key==="Home"?"count":event.key==="End"?"manage":ids[(index+(event.key==="ArrowRight"?1:3))%4];
    setStockView(next);if(next==="history")loadStockHistory();
    document.getElementById("sl-stock-tab-"+next)?.focus();
  }
  const [stock, setStock]         = useState(cachedStock?.stock || []);
  const [loading, setLoading]     = useState(!cachedStock);
  const [refreshing, setRefreshing] = useState(false);
  const [stockRefreshStatus, setStockRefreshStatus] = useState("");
  const [saving, setSaving]       = useState(false);
  const [report, setReport]       = useState("");
  const [rollCallReport,setRollCallReport] = useState(null);
  const [copyingReport,setCopyingReport] = useState(false);
  const [copied, setCopied]       = useState(false);
  const [toast, setToast]         = useState("");
  // Add item UI
  const [addingTo, setAddingTo]   = useState(null); // category name
  const [newItemName, setNewItemName] = useState("");
  const [addingCategory, setAddingCategory] = useState(false);
  const [newCatName, setNewCatName] = useState("");
  const [manageOpen, setManageOpen] = useState(false);
  const [manageNew, setManageNew] = useState({category:"", name:"", qty:"0"});
  const [manageSearch, setManageSearch] = useState("");
  const [stockInDrafts, setStockInDrafts] = useState({});
  const [historyOpen, setHistoryOpen] = useState(false);
  const [stockHistory, setStockHistory] = useState(readLocalStockHistory());
  const [historyLoading, setHistoryLoading] = useState(false);
  const [historyNotice, setHistoryNotice] = useState("");
  const [selectedHistory, setSelectedHistory] = useState(null);

  const showToast = msg => { setToast(msg); setTimeout(()=>setToast(""),2500); };
  const remainingQty = item => Math.max(0, (item.qty || 0) - (item.sold || 0));
  const stockKey = value => String(value || "").trim().toLowerCase();
  const stockDraftKey = (catIdx, itemIdx) => `${catIdx}:${itemIdx}`;
  const stockMetaText = item => {
    if (item.addedAt) return `Added ${fmtDT(item.addedAt)}`;
    if (item.lastUpdated) return `Updated ${fmtDT(item.lastUpdated)}`;
    return "Not saved yet";
  };
  const createStockItem = (name, qty=0) => ({
    name,
    qty:Number(qty) || 0,
    sold:0,
    visible:true,
    addedAt:new Date().toISOString(),
    lastUpdated:""
  });
  const markStockSaved = (categories, timestamp) => categories.map(cat => ({
    ...cat,
    items: (cat.items || []).map(item => ({
      ...item,
      sold:0,
      addedAt:"",
      lastUpdated:timestamp || new Date().toISOString()
    }))
  }));
  const stampStockSaved = (categories, timestamp) => categories.map(cat => ({
    ...cat,
    items: (cat.items || []).map(item => ({
      ...item,
      addedAt:"",
      lastUpdated:timestamp || new Date().toISOString()
    }))
  }));
  const normalizeStock = categories => categories.map(cat => ({
    ...cat,
    items: (cat.items || []).map(item => ({
      ...item,
      qty: Number(item.qty) || 0,
      sold: Number(item.sold) || 0,
      visible: item.visible !== false,
      addedAt: item.addedAt || "",
      lastUpdated: item.lastUpdated || ""
    }))
  }));
  const finalizeStock = categories => categories.map(cat => ({
    ...cat,
    items: (cat.items || []).map(item => ({
      ...item,
      qty: remainingQty(item),
      sold: 0,
      visible: item.visible !== false
    }))
  }));
  const stockCategoryRank = category => {
    const name = String(category || "").toUpperCase();
    if (name.includes("COLOR") && name.includes("35")) return 10;
    if ((name.includes("BW") || name.includes("B&W") || name.includes("BLACK")) && name.includes("35")) return 20;
    if (name.includes("120")) return 30;
    if (name.includes("110")) return 40;
    if (name.includes("FILM")) return 50;
    if (name.includes("CAMERA")) return 80;
    if (name.includes("BATTER")) return 90;
    return 70;
  };
  const orderedStockEntries = (categories=stock) => (categories || [])
    .map((cat, catIdx) => ({cat, catIdx}))
    .sort((a, b) => {
      const rankDiff = stockCategoryRank(a.cat.category) - stockCategoryRank(b.cat.category);
      if (rankDiff) return rankDiff;
      return String(a.cat.category || "").localeCompare(String(b.cat.category || ""));
    });
  const orderedStock = categories => orderedStockEntries(categories).map(entry => entry.cat);

  // Load stock from Sheets
  useEffect(() => { loadStock(); loadStockHistory(); }, []);

  function countStockItems(sourceStock=[]) {
    return sourceStock.reduce((total, cat) => total + (cat.items || []).length, 0);
  }

  function parseHistoryStock(value) {
    if (!value) return [];
    if (Array.isArray(value)) return value;
    try {
      return JSON.parse(value);
    } catch(e) {
      return [];
    }
  }

  function historySummary(entry) {
    const before = parseHistoryStock(entry.beforeStock);
    const after = parseHistoryStock(entry.afterStock);
    const soldCount = before.reduce((sum, cat) => sum + (cat.items || []).reduce((itemSum, item) => itemSum + (Number(item.sold) || 0), 0), 0);
    return {
      beforeItems: countStockItems(before),
      afterItems: countStockItems(after),
      soldCount
    };
  }

  async function loadStockHistory() {
    setHistoryLoading(true);
    const localHistory = readLocalStockHistory();
    try {
      const res = await apiCall("getStockHistory");
      if (Array.isArray(res)) {
        const seen = {};
        const merged = [...res, ...localHistory].filter(entry => {
          const key = entry.id || entry.timestamp;
          if (!key || seen[key]) return false;
          seen[key] = true;
          return true;
        }).slice(0, 30);
        setStockHistory(merged);
        writeLocalStockHistory(merged);
        setHistoryNotice("");
      } else {
        setStockHistory(localHistory);
        setHistoryNotice(localHistory.length ? "Showing local history. Deploy Apps Script history to sync across devices." : "No history found yet. Finalize stock once after this update to create the first record.");
      }
    } catch(e) {
      setStockHistory(localHistory);
      setHistoryNotice(localHistory.length ? "Showing local history. Deploy Apps Script history to sync across devices." : "No history found yet. Finalize stock once after this update to create the first record.");
    }
    setHistoryLoading(false);
  }

  async function recordStockHistory(beforeStock, afterStock, reportText) {
    const localEntry = {
      id: "local_sh_" + Date.now(),
      timestamp: new Date().toISOString(),
      action: "finalize",
      beforeStock,
      afterStock,
      report: reportText
    };
    const nextLocalHistory = [localEntry, ...readLocalStockHistory()].slice(0, 30);
    writeLocalStockHistory(nextLocalHistory);
    setStockHistory(nextLocalHistory);
    setHistoryNotice("Saved to local history. Syncs to Sheets when Apps Script history is deployed.");

    try {
      await apiCall("recordStockHistory", {
        action: "finalize",
        beforeStock,
        afterStock,
        report: reportText
      });
      await loadStockHistory();
    } catch(e) {}
  }

  async function loadStock() {
    setSpoolSyncDay(null);
    setSpoolSyncStatus("");
    spoolSyncedIds.current=new Set();
    setLoading(stock.length === 0);
    setRefreshing(true);
    setStockRefreshStatus("working");
    let ok = false;
    try {
      const res = await apiCall("getStock");
      if (res && Array.isArray(res) && res.length > 0) {
        const normalized = normalizeStock(res);
        setStock(normalized);
        writeStockCache(normalized);
        ok = true;
      } else {
        if (stock.length === 0) setStock(normalizeStock(DEFAULT_STOCK));
      }
    } catch(e) {
      if (stock.length === 0) setStock(normalizeStock(DEFAULT_STOCK));
    }
    setLoading(false);
    setRefreshing(false);
    if (ok) {
      setStockRefreshStatus("done");
      setTimeout(() => setStockRefreshStatus(""), 1200);
    } else {
      setStockRefreshStatus("");
    }
  }

  function buildReportText(sourceStock=stock,redemptions=rollCallReport) {
    const now = new Date();
    const dateStr = new Intl.DateTimeFormat("en-GB",{timeZone:"Asia/Makassar",day:"numeric",month:"long",year:"numeric"}).format(now);

    let lines = [`${dateStr}`, ``];
    orderedStock(sourceStock).forEach(cat => {
      const visibleItems = (cat.items || []).filter(item => item.visible !== false);
      if (visibleItems.length === 0) return;
      if (lines.length > 2) lines.push(``);
      lines.push(`${cat.category}`);
      visibleItems.forEach(item => {
        lines.push(`${item.name} - ${remainingQty(item)}`);
      });
    });

    if(redemptions) {
      const used=redemptions.items.length;
      lines.push("","ROLL CALL / FREE DEVSCAN",used+" "+(used===1?"voucher":"vouchers")+" used");
    }
    return lines.join("\n");
  }

  async function saveStock() {
    setSaving(true);
    try {
      const finalizedStock = finalizeStock(stock);
      const res = requireApiSuccess(await apiCall("saveStock", {stock: finalizedStock}), "Could not save stock");

      writeStockCache(savedStock);

  }

  async function saveFinalizedStockWithHistory(beforeStock, finalizedStock, reportText) {
    const combined = await apiCall("finalizeStock", {
      action: "finalize",
      ...(spoolSyncDay?{spoolDay:spoolSyncDay}:{}),
      beforeStock,
      stock: finalizedStock,
      afterStock: finalizedStock,
      report: reportText
    });

    if (combined?.success) return combined;
    const canFallback = /unknown action/i.test(String(combined?.error || ""));
    if (!canFallback || spoolSyncDay) {
      throw new Error(combined?.error || "Could not save stock");
    }

    const saved = requireApiSuccess(await apiCall("saveStock", {stock: finalizedStock}), "Could not save stock");
    await recordStockHistory(beforeStock, finalizedStock, reportText);
    return saved;
  }

  async function finalizeAndGenerateReport() {
    if(spoolSyncBusy||saving)return;
    if(spoolSyncDay&&stock.some(cat=>(cat.items||[]).some(item=>item.visible!==false&&item.sold>item.qty))){showToast("Check sold counts: one or more exceed current stock.");return;}
    setSaving(true);
    try {
      const redemptions=await SaujanaRollCall.loadDailyReport((action,data)=>apiCall(action,{...data,adminKey:getContactSheetAdminKey()}));
      setRollCallReport(redemptions);
      const reportText = buildReportText(stock,redemptions);
      const finalizedStock = finalizeStock(stock);
      const res = await saveFinalizedStockWithHistory(stock, finalizedStock, reportText);
      const savedStock = spoolSyncDay&&Array.isArray(res.history?.afterStock)?normalizeStock(res.history.afterStock):markStockSaved(finalizedStock,res.timestamp);
      setStock(savedStock);
      writeStockCache(savedStock);
      setReport(reportText);
      if(spoolSyncDay){setSpoolSyncDay(null);setSpoolSyncClosed(true);setSpoolSyncStatus("Today's Spool sales finalized.");}
      if (res.history) {
        const nextLocalHistory = [res.history, ...readLocalStockHistory()].slice(0, 30);
        writeLocalStockHistory(nextLocalHistory);
        setStockHistory(nextLocalHistory);
        setHistoryNotice("");
      }
      showToast("Stock saved and report generated");
    } catch(e) {
      showToast(e?.message || "Save failed");
    }
    setSaving(false);
  }

  function updateQty(catIdx, itemIdx, delta) {
    const updated = stock.map((cat, ci) => ci !== catIdx ? cat : {
      ...cat,
      items: cat.items.map((item, ii) => ii !== itemIdx ? item : {
        ...item, sold: Math.max(0, (item.sold || 0) + delta)
      })
    });
    setStock(updated);
  }

  function setQty(catIdx, itemIdx, val) {
    if (val === "") {
      const updated = stock.map((cat, ci) => ci !== catIdx ? cat : {
        ...cat,
        items: cat.items.map((item, ii) => ii !== itemIdx ? item : {...item, sold: 0})
      });
      setStock(updated);
      return;
    }
    const n = parseInt(val);
    if (isNaN(n) || n < 0) return;
    const updated = stock.map((cat, ci) => ci !== catIdx ? cat : {
      ...cat,
      items: cat.items.map((item, ii) => ii !== itemIdx ? item : {...item, sold: n})
    });
    setStock(updated);
  }

  function setItemField(catIdx, itemIdx, field, val) {
    const updated = stock.map((cat, ci) => ci !== catIdx ? cat : {
      ...cat,
      items: cat.items.map((item, ii) => {
        if (ii !== itemIdx) return item;
        const nextVal = field === "qty" ? Math.max(0, parseInt(val) || 0) : val;
        return {...item, [field]: nextVal};
      })
    });
    setStock(updated);
  }

  function setItemVisible(catIdx, itemIdx, visible) {
    const updated = stock.map((cat, ci) => ci !== catIdx ? cat : {
      ...cat,
      items: cat.items.map((item, ii) => ii !== itemIdx ? item : {...item, visible})
    });
    setStock(updated);
  }

  function setItemCategory(catIdx, itemIdx, newCategory) {
    const category = newCategory.trim().toUpperCase();
    if (!category) return;
    const movingItem = stock[catIdx]?.items?.[itemIdx];
    if (!movingItem || stock[catIdx].category === category) return;

    setStock(prev => {
      let moved = false;
      const withoutItem = prev
        .map((cat, ci) => ci !== catIdx ? cat : {...cat, items: cat.items.filter((_, ii) => ii !== itemIdx)})
        .filter(cat => cat.items.length > 0);
      const updated = withoutItem.map(cat => {
        if (cat.category !== category) return cat;
        moved = true;
        return {...cat, items: [...cat.items, movingItem]};
      });
      return moved ? updated : [...updated, {category, items:[movingItem]}];
    });
  }

  function addItem(catIdx) {
    if (!newItemName.trim()) return;
    const updated = stock.map((cat, ci) => ci !== catIdx ? cat : {
      ...cat, items: [...cat.items, createStockItem(newItemName.trim())]
    });
    setStock(updated);
    setNewItemName("");
    setAddingTo(null);
  }

  async function saveStockState(nextStock, successMessage) {
    setSaving(true);
    try {
      const res = requireApiSuccess(await apiCall("saveStock", {stock: nextStock}), "Could not save stock");
      const savedStock = stampStockSaved(nextStock, res.timestamp);
      setStock(savedStock);
      writeStockCache(savedStock);
      showToast(successMessage);
    } catch(e) {
      setStock(nextStock);
      writeStockCache(nextStock);
      showToast(e?.message || "Saved locally. Sheets sync failed");
    }
    setSaving(false);
  }

  async function addManagedItem() {
    const category = manageNew.category.trim();
    if(!stock.some(cat=>cat.category===category)){showToast("Choose a category first.");return;}
    const name = manageNew.name.trim();
    if (!category || !name) return;
    const qty = Math.max(0, parseInt(manageNew.qty) || 0);
    let added = false;
    let duplicateFound = false;
    const newItem = createStockItem(name, qty);
    const updated = stock.map(cat => {
      if (cat.category !== category) return cat;
      added = true;
      const existingIdx = (cat.items || []).findIndex(item => stockKey(item.name) === stockKey(name));
      if (existingIdx >= 0) {
        duplicateFound = true;
        showToast("Item already exists. Use Stock In on its row.");
        return cat;
      }
      return {...cat, items:[...(cat.items || []), newItem]};
    });
    if (duplicateFound) {
      setManageNew(m => ({...m, name:"", qty:""}));
      return;
    }
    const nextStock = added ? updated : [...updated, {category, items:[newItem]}];
    setManageNew({category, name:"", qty:""});
    await saveStockState(nextStock, "New item saved");
  }

  async function addStockToManagedItem(catIdx, itemIdx) {
    const draftKey = stockDraftKey(catIdx, itemIdx);
    const qty = Math.max(0, parseInt(stockInDrafts[draftKey]) || 0);
    if (qty <= 0) {
      showToast("Enter stock-in quantity first");
      return;
    }
    const item = stock[catIdx]?.items?.[itemIdx];
    if (!item) return;
    const updated = stock.map((cat, ci) => ci !== catIdx ? cat : {
      ...cat,
      items: (cat.items || []).map((row, ii) => ii !== itemIdx ? row : {
        ...row,
        qty: (Number(row.qty) || 0) + qty
      })
    });
    setStockInDrafts(drafts => ({...drafts, [draftKey]:""}));
    await saveStockState(updated, `${item.name} +${qty} saved`);
  }

  async function removeManagedItem(catIdx, itemIdx) {
    const item = stock[catIdx]?.items?.[itemIdx];
    if (!item) return;
    const ok = window.confirm(`Remove "${item.name}" from stock?`);
    if (!ok) return;
    const updated = stock
      .map((cat, ci) => ci !== catIdx ? cat : {
        ...cat,
        items: (cat.items || []).filter((_, ii) => ii !== itemIdx)
      })
      .filter(cat => cat.items.length > 0);
    await saveStockState(updated, "Stock item removed");
  }

  function addCategory() {
    const category = newCatName.trim().toUpperCase();
    if (!category) return;
    setStock(s => s.some(cat => cat.category === category) ? s : [...s, {category, items: []}]);
    setNewCatName("");
    setAddingCategory(false);
    setAddingTo(category);
  }

  function generateReport() {
    setReport(buildReportText(stock));
  }

  function copyReport() {
    copyWhatsAppReport();
  }

  async function copyWhatsAppReport() {
    setCopyingReport(true);
    try {
      const redemptions=await SaujanaRollCall.loadDailyReport((action,data)=>apiCall(action,{...data,adminKey:getContactSheetAdminKey()}));
      setRollCallReport(redemptions);
      const text = buildReportText(stock,redemptions);
      setReport(text);
      await navigator.clipboard.writeText(text);
      setCopied(true);
      showToast("WhatsApp report copied");
      setTimeout(() => setCopied(false), 2000);
    } catch(error){showToast(error.message||"Could not copy report.");}
    finally{setCopyingReport(false);}
  }

  if (loading) return (
    <div style={{textAlign:"center",padding:80,fontSize:11,letterSpacing:"0.3em",
                 textTransform:"uppercase",color:"var(--dim)"}}>Loading stock...</div>
  );

  return <section className="sl-stock">
    <Toast msg={toast}/>
    <header className="sl-page-heading"><div><span className="sl-eyebrow">Lab handover</span><h1>Stock + report</h1><p>{new Intl.DateTimeFormat("en-GB",{timeZone:"Asia/Makassar",day:"numeric",month:"long",year:"numeric"}).format(new Date())} / Bali</p></div><button className="sl-secondary" onClick={loadStock} disabled={refreshing||saving}><RefreshIcon name="RefreshCw" size={15}/>{refreshing?"Refreshing...":"Refresh stock"}</button></header>
    <div className="sl-stock-summary"><div><RefreshIcon name="Package" size={18}/><span><strong>{stock.reduce((sum,category)=>sum+(category.items||[]).filter(item=>item.visible!==false).reduce((n,item)=>n+(Number(item.qty)||0),0),0)}</strong> units in stock</span></div><div><RefreshIcon name="Minus" size={18}/><span><strong>{stock.reduce((sum,category)=>sum+(category.items||[]).filter(item=>item.visible!==false).reduce((n,item)=>n+(Number(item.sold)||0),0),0)}</strong> sold today</span></div><button onClick={()=>setStockView("rollcall")}><RefreshIcon name="TicketCheck" size={18}/><span><strong>{rollCallReport?.items.length||0}</strong> Roll Call redemptions</span><RefreshIcon name="ArrowRight" size={14}/></button></div>
    <div className="sl-stock-layout">
      <div className="sl-status-column">
      {orderStatus}
      <div className="sl-stock-workspace">
        <div className="sl-stock-tabs" role="tablist" aria-label="Stock and report views">{[{id:"count",label:"Daily count",icon:"ListChecks"},{id:"rollcall",label:"Roll Call",icon:"TicketCheck"},{id:"history",label:"History",icon:"History"},{id:"manage",label:"Manage items",icon:"Settings2"}].map(tab=><button key={tab.id} role="tab" aria-selected={stockView===tab.id} tabIndex={stockView===tab.id?0:-1} aria-controls={"sl-stock-"+tab.id} id={"sl-stock-tab-"+tab.id} onKeyDown={switchStockTab} onClick={()=>{setStockView(tab.id);if(tab.id==="history")loadStockHistory()}}><RefreshIcon name={tab.icon} size={16}/>{tab.label}</button>)}</div>
        <section id="sl-stock-count" role="tabpanel" aria-labelledby="sl-stock-tab-count" hidden={stockView!=="count"}>
          <div className="sl-stock-filter"><label className="sl-search"><RefreshIcon name="Search"/><input aria-label="Search daily stock" value={countSearch} onChange={e=>setCountSearch(e.target.value)} placeholder="Find an item or category..."/></label><button className="sl-secondary" onClick={()=>setAddingCategory(value=>!value)}><RefreshIcon name="Plus" size={15}/>Category</button></div>
          {addingCategory&&<div className="sl-inline-editor"><input autoFocus value={newCatName} onChange={e=>setNewCatName(e.target.value)} placeholder="Category name" onKeyDown={e=>{if(e.key==="Enter")addCategory()}}/><button className="sl-primary" onClick={addCategory}>Add category</button><button className="sl-secondary" onClick={()=>{setAddingCategory(false);setNewCatName("")}}>Cancel</button></div>}
          <div className="sl-count-table"><div className="sl-count-head"><span>Item</span><span>Current</span><span>Sold today</span><span>Remaining</span></div>
            {orderedStockEntries().map(({cat,catIdx})=>{
              const visible=(cat.items||[]).map((item,itemIdx)=>({item,itemIdx})).filter(({item})=>item.visible!==false&&(!countSearch||(item.name+" "+cat.category).toLowerCase().includes(countSearch.toLowerCase())));
              if(!visible.length&&countSearch)return null;
              return <section className="sl-stock-category" key={catIdx}><header><h2>{cat.category}</h2><span>{visible.length} {visible.length===1?"item":"items"}</span><button className="sl-icon-button" title="Add item" aria-label={"Add item to "+cat.category} onClick={()=>setAddingTo(value=>value===cat.category?null:cat.category)}><RefreshIcon name="Plus" size={15}/></button></header>
                {visible.map(({item,itemIdx})=><div className="sl-count-row" key={itemIdx}><div className="sl-count-name"><strong>{item.name}</strong></div><span className="sl-count-value"><small>Current</small>{item.qty||0}</span><div className="sl-sold-field"><small>Sold today</small><div className="sl-quantity"><button title="Reduce sold count" aria-label={"Reduce sold "+item.name} disabled={saving||!(Number(item.sold)>0)} onClick={()=>updateQty(catIdx,itemIdx,-1)}><RefreshIcon name="Minus" size={14}/></button><input aria-label={"Sold today "+item.name} type="number" min="0" value={item.sold||""} placeholder="0" disabled={saving} onChange={e=>setQty(catIdx,itemIdx,e.target.value)}/><button title="Increase sold count" aria-label={"Increase sold "+item.name} disabled={saving} onClick={()=>updateQty(catIdx,itemIdx,1)}><RefreshIcon name="Plus" size={14}/></button></div></div><span className={"sl-count-value sl-remaining "+(remainingQty(item)===0?"empty":"")}><small>Remaining</small>{remainingQty(item)}</span></div>)}
                {addingTo===cat.category&&<div className="sl-inline-editor"><input value={newItemName} onChange={e=>setNewItemName(e.target.value)} placeholder="New item name..." onKeyDown={e=>{if(e.key==="Enter")addItem(catIdx)}}/><button className="sl-primary" onClick={()=>addItem(catIdx)}>Add item</button><button className="sl-secondary" onClick={()=>{setAddingTo(null);setNewItemName("")}}>Cancel</button></div>}
              </section>;
            })}
          </div>
        </section>
        <section id="sl-stock-rollcall" role="tabpanel" aria-labelledby="sl-stock-tab-rollcall" hidden={stockView!=="rollcall"}><SaujanaRollCall.ReportPanel report={rollCallReport} onChange={setRollCallReport} api={(action,data)=>apiCall(action,{...data,adminKey:getContactSheetAdminKey()})}/></section>
        <section id="sl-stock-history" role="tabpanel" aria-labelledby="sl-stock-tab-history" hidden={stockView!=="history"}>
          <div className="sl-section-label"><h2>Saved handovers</h2><button className="sl-secondary" disabled={historyLoading} onClick={loadStockHistory}><RefreshIcon name="RefreshCw" size={14}/>Refresh history</button></div>
          {historyNotice&&<p className="sl-help">{historyNotice}</p>}
          {stockHistory.length?<div className="sl-handover-history">{stockHistory.slice(0,12).map(entry=><button key={entry.id||entry.timestamp} className={selectedHistory===entry?"selected":""} onClick={()=>setSelectedHistory(entry)}><RefreshIcon name="FileClock" size={20}/><span><strong>{fmtDT(entry.timestamp)}</strong><small>{historySummary(entry).soldCount} sold / {historySummary(entry).afterItems} items</small></span><RefreshIcon name="ChevronRight" size={15}/></button>)}</div>:<div className="sl-empty-state"><RefreshIcon name="History" size={28}/><h3>No saved handovers yet</h3><p>Saved stock snapshots will appear here.</p></div>}
          {selectedHistory&&<div className="sl-snapshot"><div className="sl-section-label"><h3>{fmtDT(selectedHistory.timestamp)}</h3><button className="sl-icon-button" aria-label="Close handover snapshot" onClick={()=>setSelectedHistory(null)}><RefreshIcon name="X"/></button></div><div className="sl-snapshot-columns">{[{label:"Before save",data:parseHistoryStock(selectedHistory.beforeStock)},{label:"After save",data:parseHistoryStock(selectedHistory.afterStock)}].map(block=><div key={block.label}><h4>{block.label}</h4>{orderedStock(block.data).map(cat=><div className="sl-snapshot-category" key={cat.category}><strong>{cat.category}</strong>{(cat.items||[]).filter(item=>item.visible!==false).map(item=><p key={item.name}><span>{item.name}</span><span>{item.qty||0}{item.sold?" / sold "+item.sold:""}</span></p>)}</div>)}</div>)}</div>{selectedHistory.report&&<pre>{selectedHistory.report}</pre>}</div>}
        </section>
        <section id="sl-stock-manage" role="tabpanel" aria-labelledby="sl-stock-tab-manage" hidden={stockView!=="manage"}>
          <div className="sl-section-label"><h2>Inventory management</h2><button className="sl-secondary" onClick={()=>setAddingCategory(value=>!value)}><RefreshIcon name="Plus" size={15}/>Category</button></div>
          {addingCategory&&<div className="sl-inline-editor"><input autoFocus aria-label="New inventory category" value={newCatName} onChange={e=>setNewCatName(e.target.value)} placeholder="Category name"/><button className="sl-primary" onClick={()=>{const category=newCatName.trim().toUpperCase();if(!category)return;addCategory();setManageNew(value=>({...value,category}))}}>Add category</button><button className="sl-secondary" onClick={()=>{setAddingCategory(false);setNewCatName("")}}>Cancel</button></div>}
          <label className="sl-search"><RefreshIcon name="Search"/><input aria-label="Search managed items" value={manageSearch} onChange={e=>setManageSearch(e.target.value)} placeholder="Search item or category..."/></label>
          <div className="sl-add-managed"><input aria-label="New managed item name" value={manageNew.name} onChange={e=>setManageNew(value=>({...value,name:e.target.value}))} placeholder="New item name"/><select aria-label="New managed item category" value={manageNew.category} disabled={saving} onChange={e=>setManageNew(value=>({...value,category:e.target.value}))}><option value="" disabled>Select category</option>{[...new Set(orderedStockEntries().map(({cat})=>cat.category))].map(category=><option key={category} value={category}>{category}</option>)}</select><input aria-label="New managed item quantity" type="number" min="0" value={manageNew.qty} onChange={e=>setManageNew(value=>({...value,qty:e.target.value}))}/><button className="sl-primary" disabled={saving||!manageNew.name.trim()||!manageNew.category} onClick={addManagedItem}><RefreshIcon name="Plus" size={15}/>Add item</button></div>
          <div className="sl-managed-items">{orderedStockEntries().flatMap(({cat,catIdx})=>(cat.items||[]).map((item,itemIdx)=>({cat,catIdx,item,itemIdx}))).filter(({cat,item})=>!manageSearch||(item.name+" "+cat.category).toLowerCase().includes(manageSearch.toLowerCase())).map(({cat,catIdx,item,itemIdx})=><article className={"sl-managed-item "+(item.visible===false?"hidden-item":"")} key={catIdx+"-"+itemIdx}>
            <div className="sl-managed-fields"><label>Item<input aria-label={"Item name "+catIdx+"-"+itemIdx} value={item.name} onChange={e=>setItemField(catIdx,itemIdx,"name",e.target.value)}/></label><label>Category<input aria-label={"Item category "+catIdx+"-"+itemIdx} defaultValue={cat.category} onBlur={e=>setItemCategory(catIdx,itemIdx,e.target.value)} onKeyDown={e=>{if(e.key==="Enter")e.currentTarget.blur()}}/></label><label>Quantity<input aria-label={"Quantity "+item.name} type="number" min="0" value={item.qty||0} onChange={e=>setItemField(catIdx,itemIdx,"qty",e.target.value)}/></label></div>
            <footer><small>{stockMetaText(item)}{item.visible===false?" / Hidden":""}</small><div className="sl-managed-actions"><div className="sl-stock-in"><input aria-label={"Stock in "+item.name} type="number" min="0" placeholder="Qty" value={stockInDrafts[stockDraftKey(catIdx,itemIdx)]||""} onChange={e=>setStockInDrafts(value=>({...value,[stockDraftKey(catIdx,itemIdx)]:e.target.value}))}/><button className="sl-secondary" disabled={saving} onClick={()=>addStockToManagedItem(catIdx,itemIdx)}>Stock in</button></div><button className="sl-icon-button" aria-label={(item.visible===false?"Restore ":"Hide ")+item.name} title={item.visible===false?"Restore item":"Hide item"} onClick={()=>setItemVisible(catIdx,itemIdx,item.visible===false)}><RefreshIcon name={item.visible===false?"Eye":"EyeOff"}/></button><button className="sl-icon-button" aria-label={"Remove "+item.name} title="Remove item" onClick={()=>removeManagedItem(catIdx,itemIdx)}><RefreshIcon name="Trash2"/></button></div></footer>
          </article>)}</div>
        </section>
      </div>
      </div>
      <aside className="sl-handover"><span className="sl-eyebrow">End of day</span><h2>Daily handover</h2><p>{new Intl.DateTimeFormat("en-GB",{timeZone:"Asia/Makassar",day:"numeric",month:"short",year:"numeric"}).format(new Date())} / Bali</p><dl><div><dt>Stock sold</dt><dd>{stock.reduce((sum,category)=>sum+(category.items||[]).filter(item=>item.visible!==false).reduce((n,item)=>n+(Number(item.sold)||0),0),0)}</dd></div><div><dt>Roll Call used</dt><dd>{rollCallReport?.items.length||0}</dd></div></dl>        <button className="sl-secondary" type="button" aria-label="Sync Spool sales" aria-busy={spoolSyncBusy} disabled={saving||refreshing||loading||spoolSyncBusy||spoolSyncClosed} onClick={syncSpoolSold}>
          <RefreshIcon name="RefreshCw" size={15}/><span>{spoolSyncBusy?"Syncing":"Sync"}</span><span className="sl-spool-wordmark" aria-hidden="true"/><span>{spoolSyncBusy?"sales...":"sales"}</span>
        </button>{spoolSyncStatus&&<p role="status">{spoolSyncStatus}</p>}
<button className="sl-primary" disabled={saving||spoolSyncBusy} onClick={finalizeAndGenerateReport}><RefreshIcon name="Save" size={16}/>{saving?"Saving...":"Finalize + Save Report"}</button><button className="sl-secondary" disabled={copyingReport||saving} onClick={copyWhatsAppReport}><RefreshIcon name="Copy" size={16}/>{copyingReport?"Preparing...":"Copy WhatsApp"}</button>{report&&<div className="sl-report-output"><div className="sl-section-label"><h3>Saved report</h3><button className="sl-icon-button" title="Copy report" aria-label="Copy saved report" onClick={copyReport}><RefreshIcon name={copied?"Check":"Copy"} size={15}/></button></div><pre>{report}</pre></div>}</aside>
    </div>
  </section>;

}

ReactDOM.render(<App/>, document.getElementById("root"));
</script>
</body>
</html>
